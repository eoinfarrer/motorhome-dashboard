<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Audrey - Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--bg2:#eceae4;--bg3:#e4e2db;
  --border:#d4d0c8;--border2:#c8c4ba;
  --text:#1a1a18;--text-dim:#555;--text-muted:#999;
  --go:#1a8a4a;--caution:#c07800;--danger:#c0392b;
  --frost:#2471a3;--gold:#9a7040;
  --mono:'DM Mono',monospace;--display:'Syne',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.5;min-height:100vh;padding-top:var(--safe-top);-webkit-font-smoothing:antialiased;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;gap:12px;box-shadow:0 1px 8px rgba(0,0,0,0.06);}
.header-left{display:flex;align-items:baseline;gap:10px;flex-shrink:0;}
.wordmark{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-0.5px;color:var(--text);}
.wordmark span{color:var(--gold);}
.header-tag{font-size:9px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;}
.trip-selector{background:white;border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:4px;outline:none;cursor:pointer;max-width:180px;flex-shrink:1;min-width:0;}
.refresh-btn{background:none;border:1px solid var(--border2);color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
.refresh-btn.loading{opacity:0.5;pointer-events:none;}

/* MASTER BAR */
.master-bar{display:flex;align-items:stretch;border-bottom:1px solid var(--border);min-height:56px;}
.master-status{display:flex;align-items:center;gap:10px;padding:14px 20px;font-family:var(--display);font-size:18px;font-weight:700;flex-shrink:0;min-width:140px;background:var(--bg2);border-right:1px solid var(--border);}
.master-advice{display:flex;align-items:center;padding:14px 20px;font-size:13px;color:var(--text-dim);flex:1;line-height:1.5;}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* COUNTDOWN / NEXT DRIVE GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.countdown-card{grid-column:span 2;background:var(--bg2);padding:20px;display:flex;align-items:center;gap:20px;}
.countdown-number{font-family:var(--display);font-size:clamp(36px,8vw,56px);font-weight:800;line-height:1;color:var(--gold);flex-shrink:0;}
.countdown-detail{flex:1;}
.countdown-label{font-size:10px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;}
.countdown-trip{font-family:var(--display);font-size:clamp(16px,4vw,22px);font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.2;}
.trip-status-badge{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:20px;font-family:var(--mono);}
.drive-card{grid-column:span 2;background:var(--bg3);padding:16px 18px;border-top:2px solid var(--frost);}
.drive-route{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.drive-origin,.drive-dest{font-family:var(--display);font-size:clamp(14px,3.5vw,18px);font-weight:600;}
.drive-arrow{color:var(--frost);font-size:16px;flex-shrink:0;}
.drive-meta{display:flex;gap:16px;flex-wrap:wrap;}
.drive-stat{display:flex;flex-direction:column;gap:2px;}
.drive-stat-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.drive-stat-value{font-size:13px;color:var(--frost);font-weight:500;}
.card-label{font-size:9px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}

/* COLLAPSIBLE SECTIONS */
.section{border-bottom:1px solid var(--border);}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;background:var(--bg2);cursor:pointer;user-select:none;-webkit-user-select:none;}
.section-head:hover{background:var(--bg3);}
.section-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.section-title{font-size:11px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;font-weight:600;}
.section-meta{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.section-chevron{font-size:14px;color:var(--gold);transition:transform 0.2s;flex-shrink:0;margin-left:8px;}
.section-body{overflow:hidden;transition:max-height 0.25s ease;}
.section.collapsed .section-body{max-height:0!important;}
.section.collapsed .section-chevron{transform:rotate(-90deg);}

/* VEHICLE GRID */
.van-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);}
.van-card{background:var(--bg);padding:14px 16px;text-align:center;}
.van-card-icon{font-size:20px;margin-bottom:4px;display:block;}
.van-card-value{font-family:var(--display);font-size:clamp(14px,3.5vw,20px);font-weight:700;line-height:1;margin-bottom:3px;}
.van-card-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}

/* WEATHER */
.weather-list{}
.weather-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);}
.weather-row:last-child{border-bottom:none;}
.weather-row.today{background:#fdf8ee;}
.weather-date{font-size:12px;color:var(--text-dim);}
.weather-date strong{display:block;font-size:13px;color:var(--text);font-weight:600;}
.weather-middle{min-width:0;}
.weather-condition{font-size:13px;color:var(--text-dim);}
.weather-stats{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.weather-risk{font-size:12px;font-weight:600;text-align:right;}
.weather-nums{font-size:11px;color:var(--text-dim);text-align:right;}
.weather-loc-head{padding:7px 18px 4px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;letter-spacing:1px;color:var(--text-dim);font-weight:600;text-transform:uppercase;}

/* ITINERARY */
.itin-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;padding:12px 18px;border-bottom:1px solid var(--border);}
.itin-row:last-child{border-bottom:none;}
.itin-row.today{background:#fdf8ee;border-left:3px solid var(--gold);}
.itin-row.past{opacity:0.45;}
.itin-date{font-size:11px;color:var(--text-muted);padding-top:2px;line-height:1.4;}
.itin-date strong{display:block;font-size:13px;color:var(--text-dim);font-weight:600;}
.itin-location{font-size:15px;color:var(--text);font-weight:600;margin-bottom:3px;}
.itin-notes{font-size:12px;color:var(--text-dim);margin-top:1px;}
.itin-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:3px;align-self:start;font-weight:600;}
.type-DEPART  {background:#e8f5ee;color:var(--go);border:1px solid #b8dfc8;}
.type-DRIVE   {background:#e8f0f8;color:var(--frost);border:1px solid #b8cce8;}
.type-STOPOVER{background:#f8f0e0;color:var(--gold);border:1px solid #e0c890;}
.type-STAY    {background:#eeece8;color:var(--text-dim);border:1px solid var(--border2);}
.type-ARRIVE  {background:#f0e8f8;color:#7d3c98;border:1px solid #d8b8e8;}
.type-RETURN  {background:#fde8e8;color:var(--danger);border:1px solid #f0b8b8;}

/* LPG */
.refill-btn{background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.refill-btn:hover{border-color:var(--frost);background:var(--bg3);}

/* MISC */
.state-message{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.8;}
.state-message .icon{font-size:32px;display:block;margin-bottom:12px;}
.footer{padding:20px;text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:1px;border-top:1px solid var(--border);}
.last-updated{color:var(--text-muted);margin-top:4px;font-size:11px;margin-bottom:12px;}
.footer-wordmark{font-family:var(--display);font-size:14px;font-weight:800;color:var(--text-dim);letter-spacing:-0.5px;margin-bottom:2px;}
.settings-toggle{background:none;border:1px solid var(--border2);color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:4px;cursor:pointer;margin-top:8px;transition:all 0.15s;}
.settings-toggle:hover{border-color:var(--gold);color:var(--gold);}
.settings-panel{text-align:left;margin-top:12px;display:none;}
.settings-panel.open{display:block;}
.settings-group{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px;background:var(--bg);}
.settings-group-head{padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.settings-group-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:12px;color:var(--text-dim);}
.settings-row-right{display:flex;align-items:center;gap:8px;}
.settings-row-value{font-size:14px;font-weight:700;font-family:var(--display);color:var(--text);}
.settings-row-unit{font-size:10px;color:var(--text-muted);}
.s-edit-btn{background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;cursor:pointer;}
.s-edit-btn:hover{border-color:var(--frost);background:var(--bg3);}
.resort-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);}
.resort-row:last-child{border-bottom:none;}
.resort-name-s{font-size:12px;color:var(--text-dim);}
.resort-name-s.inactive{color:var(--text-muted);}
.resort-sub-s{font-size:9px;color:var(--text-muted);}
.resort-row-right{display:flex;align-items:center;gap:8px;}
.toggle{width:32px;height:18px;border-radius:9px;cursor:pointer;transition:background 0.2s;position:relative;border:none;outline:none;flex-shrink:0;}
.toggle-on{background:var(--go);}
.toggle-off{background:var(--border2);}
.toggle-knob{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left 0.2s;box-shadow:0 1px 2px rgba(0,0,0,0.2);}
.toggle-on .toggle-knob{left:16px;}
.toggle-off .toggle-knob{left:2px;}
.toggle-lbl{font-size:10px;}
.toggle-lbl-on{color:var(--go);}
.toggle-lbl-off{color:var(--text-muted);}
.remove-btn{background:none;border:none;color:var(--text-muted);font-size:14px;cursor:pointer;padding:2px 4px;line-height:1;}
.remove-btn:hover{color:var(--danger);}
.add-resort-row{display:flex;gap:8px;padding:10px 14px;}
.add-resort-input{flex:1;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:4px;outline:none;}
.add-resort-input:focus{border-color:var(--frost);}
.add-resort-input::placeholder{color:var(--text-muted);}
.add-resort-btn{background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;}
.add-resort-btn:hover{border-color:var(--frost);}
.settings-note{padding:6px 14px;font-size:9px;color:var(--text-muted);background:var(--bg2);border-top:1px solid var(--border);}
.trip-select{width:100%;background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:11px;padding:7px 10px;border-radius:4px;outline:none;margin:8px 14px;width:calc(100% - 28px);}
.trip-select:focus{border-color:var(--frost);}

/* RESPONSIVE */
@media(max-width:640px){
  .van-grid{grid-template-columns:repeat(2,1fr);}
  .grid{grid-template-columns:1fr;}
  .countdown-card,.drive-card{grid-column:span 1;}
  .master-status{min-width:110px;font-size:16px;}
  .header{padding:12px 14px 10px;}
  .weather-row{grid-template-columns:70px 1fr auto;}
}
@media(prefers-reduced-motion:reduce){
  .status-dot{animation:none;}
  .section-body,.section-chevron{transition:none;}
}

.cycling-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;}
.cycling-modal-overlay.open{display:flex;}
.cycling-modal{background:var(--bg);width:100%;max-height:92vh;border-radius:12px 12px 0 0;overflow-y:auto;}
.cycling-modal-head{padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.cycling-modal-title{font-family:var(--display);font-size:15px;font-weight:800;}
.cycling-modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;padding:0 4px;}
.cycling-upload{padding:20px 16px;text-align:center;border-bottom:1px solid var(--border);}
.cycling-upload-area{border:2px dashed var(--border2);border-radius:8px;padding:24px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;}
.cycling-upload-area:hover{border-color:var(--frost);background:var(--bg2);}
.cycling-upload-area.dragover{border-color:var(--frost);background:var(--bg2);}
.cycling-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.cycling-input-group{display:flex;flex-direction:column;gap:4px;}
.cycling-input-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
.cycling-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:4px;width:100%;outline:none;}
.cycling-input:focus{border-color:var(--frost);}
.cycling-analyse-btn{width:100%;padding:13px;background:var(--frost);color:#fff;border:none;border-radius:6px;font-family:var(--display);font-size:14px;font-weight:700;cursor:pointer;}
.cycling-analyse-btn:disabled{opacity:0.5;cursor:not-allowed;}
.cycling-results{padding:0;}
.cycling-route-header{padding:14px 16px;border-bottom:1px solid var(--border);}
.cycling-route-name{font-family:var(--display);font-size:16px;font-weight:800;margin-bottom:4px;}
.cycling-route-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;}
.cycling-stat-val{font-size:16px;font-weight:700;font-family:var(--display);color:var(--frost);}
.cycling-stat-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);}
.cycling-risk-banner{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.cycling-seg{border-bottom:1px solid var(--border);cursor:pointer;}
.cycling-seg:last-child{border-bottom:none;}
.cycling-seg:hover{background:var(--bg3);}
.cycling-seg-head{display:flex;align-items:center;padding:10px 16px;gap:8px;}
.cycling-seg-km{font-size:10px;color:var(--text-muted);min-width:38px;}
.cycling-seg-left{flex:1;}
.cycling-seg-name{font-size:13px;font-weight:700;font-family:var(--display);}
.cycling-seg-alt{font-size:10px;color:var(--text-muted);}
.cycling-seg-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.cycling-seg-eta{font-size:11px;color:var(--text-dim);}
.cycling-seg-body{padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);display:none;}
.cycling-seg-body.open{display:block;}
.cycling-wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.cycling-wx-item{text-align:center;}
.cycling-wx-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.cycling-wx-val{font-size:15px;font-weight:700;font-family:var(--display);}
.cycling-alert{padding:7px 10px;border-radius:4px;font-size:11px;margin-bottom:5px;line-height:1.4;}
.cycling-alert:last-child{margin-bottom:0;}
.c-alert-storm{background:#fdf0f0;color:#8b1a1a;border-left:3px solid #8b1a1a;}
.c-alert-wind{background:#eaf3fb;color:#1a5276;border-left:3px solid #1a5276;}
.c-alert-heat{background:#fdf8ee;color:#7d4e00;border-left:3px solid #7d4e00;}
.c-alert-cold{background:#eaf0fb;color:#1a3276;border-left:3px solid #1a3276;}
.c-alert-ok{background:#f0f8f2;color:var(--go);border-left:3px solid var(--go);}
.cycling-gpx-download{padding:14px 16px;border-top:1px solid var(--border);background:var(--bg2);}
.cycling-loading{padding:40px 16px;text-align:center;color:var(--text-muted);font-size:13px;}

</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="wordmark">Au<span>drey</span></div>
    <div class="header-tag">Mission Control</div>
  </div>
  <select class="trip-selector" id="tripSelector" onchange="loadTrip(this.value)">
    <option value="">Loading...</option>
  </select>
  <button class="refresh-btn" id="refreshBtn" onclick="refresh()">&#8635; Refresh</button>
</header>

<main id="main">
  <div class="state-message">
    <span class="icon">&#128656;</span>
    Connecting to Audrey...
  </div>
</main>

<footer class="footer">
  <div class="footer-wordmark">Au<span style="color:var(--gold)">drey</span></div>
  <div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">8M BAILEY AUTOGRAPH</div>
  <div class="last-updated" id="lastUpdated"></div>
  <button class="settings-toggle" id="settingsBtn" onclick="toggleSettings()">⚙️ Settings</button>
  <button class="settings-toggle" id="cyclingBtn" onclick="openCyclingModal()" style="margin-left:8px">🚴 Analyse ride</button>
  <div class="settings-panel" id="settingsPanel"></div>
</footer>

<!-- Cycling modal — outside footer -->
<div class="cycling-modal-overlay" id="cyclingModalOverlay" onclick="closeCyclingModalIfOutside(event)">
  <div class="cycling-modal" id="cyclingModal">
    <div class="cycling-modal-head">
      <span class="cycling-modal-title">🚴 Ride Weather Analysis</span>
      <button class="cycling-modal-close" onclick="closeCyclingModal()">✕</button>
    </div>
    <div id="cyclingModalBody">
      <!-- populated by JS -->
    </div>
  </div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbzkNIe9iFbh0DN4ApI07qv-6vqZlBuhGr_85ED0DpBnhIw1oq7Ubad00jJL4d73Ee36ew/exec';
var currentData=null,currentTrip=null;

// ── COLLAPSIBLE STATE ─────────────────────────────────────────
// Persisted in sessionStorage so state survives refresh but resets on new visit
var COLLAPSE_KEY='audrey_collapsed';
function getCollapsed(){
  try{return JSON.parse(sessionStorage.getItem(COLLAPSE_KEY)||'{}');}catch(e){return{};}
}
function setCollapsed(id,val){
  var s=getCollapsed();s[id]=val;
  try{sessionStorage.setItem(COLLAPSE_KEY,JSON.stringify(s));}catch(e){}
}
function toggleSection(id){
  var el=document.getElementById('sec-'+id);
  if(!el)return;
  var collapsed=el.classList.toggle('collapsed');
  setCollapsed(id,collapsed);
}
function applyCollapsed(){
  var s=getCollapsed();
  Object.keys(s).forEach(function(id){
    if(s[id]){
      var el=document.getElementById('sec-'+id);
      if(el)el.classList.add('collapsed');
    }
  });
  // Set max-height on all section bodies for smooth animation
  document.querySelectorAll('.section-body').forEach(function(b){
    if(!b.parentElement.classList.contains('collapsed')){
      b.style.maxHeight=b.scrollHeight+'px';
    }
  });
}

function makeSection(id,title,meta,rightHtml,bodyHtml){
  var chevron='<span class="section-chevron">&#8250;</span>';
  var metaSpan=meta?'<span class="section-meta">'+meta+'</span>':'';
  var right=rightHtml||'';
  return '<div class="section" id="sec-'+id+'">'
    +'<div class="section-head" onclick="toggleSection(\''+id+'\')">'
    +'<div class="section-left">'
    +'<span class="section-title">'+title+'</span>'
    +metaSpan
    +'</div>'
    +right
    +chevron
    +'</div>'
    +'<div class="section-body" style="max-height:4000px">'+bodyHtml+'</div>'
    +'</div>';
}

// ── FETCH ─────────────────────────────────────────────────────
async function fetchData(trip){
  var params=new URLSearchParams();
  if(trip)params.set('trip',trip);
  params.set('_',Date.now());
  var url=API_URL+'?'+params.toString();
  var r;
  try{r=await fetch(url,{redirect:'follow',headers:{'Accept':'application/json'}});}
  catch(e){r=await fetch(url,{mode:'cors',credentials:'omit',redirect:'follow'});}
  if(!r.ok)throw new Error('HTTP '+r.status);
  var text=await r.text();
  try{return JSON.parse(text);}catch(e){throw new Error('Invalid response from server');}
}

async function loadTrip(name){currentTrip=name||null;await refresh();}

async function refresh(){
  var btn=document.getElementById('refreshBtn');
  btn.classList.add('loading');btn.textContent='Loading...';
  try{
    var d=await fetchData(currentTrip);
    if(d.error)throw new Error(d.error);
    currentData=d;render(d);
  }catch(e){renderError(e.message);}
  finally{btn.classList.remove('loading');btn.textContent='\u21BB Refresh';}
}

function getSmartDefaults(meta) {
  var status   = meta.tripStatus   || 'PRE_TRIP';
  var dayType  = meta.todayType    || null;
  var isWinter = meta.season       === 'winter';
  var isDrive  = dayType && ['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(dayType) >= 0;
  var isStay   = dayType === 'STAY';

  // Base defaults — most things collapsed
  var d = {
    vehicle:   true,
    lpg:       true,
    running: true,
    weather:   false,
    snow:      true,
    budget:    true,
    itinerary: true,
    prices:    true
  };

  if (status === 'PRE_TRIP') {
    d.itinerary = false; // show itinerary so you can plan
    d.budget    = true;  // budget collapsed until needed
    d.weather   = false; // weather always useful
  }

  if (status === 'ACTIVE') {
    if (isDrive) {
      d.vehicle   = false; // battery/temps matter on road
      d.weather   = false; // conditions for today
      d.itinerary = true;  // don't need full itinerary while driving
      d.snow      = isWinter ? false : true; // snow open on winter drive days
    }
    if (isStay) {
      d.lpg       = false; // heating tonight
      d.weather   = false; // conditions today
      d.snow      = isWinter ? false : true; // snow open on stay days in winter
      d.vehicle   = true;  // less critical on stay days
      d.itinerary = true;  // don't need itinerary on stay days
    }
  }

  if (status === 'POST_TRIP') {
    d.budget    = false; // reconcile actuals
    d.vehicle   = true;
    d.weather   = true;
    d.itinerary = true;
    d.snow      = true;
  }

  return d;
}

function render(d){
  populateTripSelector(d.trips, d.meta.tripName);

  // Reset collapsed state when trip changes
  var lastTrip = sessionStorage.getItem('audrey_trip');
  if (lastTrip !== d.meta.tripName) {
    sessionStorage.removeItem(COLLAPSE_KEY);
    sessionStorage.setItem('audrey_trip', d.meta.tripName);
  }

  // Apply smart defaults only if no user preferences stored yet
  var existing = getCollapsed();
  if (Object.keys(existing).length === 0) {
    var defaults = getSmartDefaults(d.meta);
    Object.keys(defaults).forEach(function(id) {
      setCollapsed(id, defaults[id]);
    });
  }

  document.getElementById('main').innerHTML = buildMain(d);
  var ts = new Date(d.timestamp);
  document.getElementById('lastUpdated').textContent =
    'Last updated ' + ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  applyCollapsed();
}

function renderError(msg){
  document.getElementById('main').innerHTML=
    '<div class="state-message"><span class="icon">&#9888;</span>Could not reach Audrey.<br>'
    +'<span style="color:#555;font-size:11px">'+msg+'</span><br><br>Check your connection and try again.</div>';
}

function populateTripSelector(trips,active){
  var sel=document.getElementById('tripSelector');
  if(!trips||!trips.length)return;
  sel.innerHTML=trips.map(function(t){
    var label=t.name+(t.status==='ACTIVE'?' &#9679;':t.status==='UPCOMING'?' &#9675;':'');
    return '<option value="'+t.name+'"'+(t.name===active?' selected':'')+'>'+label+'</option>';
  }).join('');
}

// ── MAIN BUILDER ──────────────────────────────────────────────
function buildMain(d){
  var fc=d.fuelConfig||{pricePerLitre:1.182,mpg:27};
  var parts=[];
  parts.push(buildMasterBar(d.master,d.vehicle));
  parts.push(buildCountdown(d.meta,d.meta&&d.meta.nextDrive?buildNextDrive(d.meta,fc):''));
  if(d.runningTotal)parts.push(buildRunningTotalSection(d.runningTotal));
  parts.push(buildVehicleSection(d.vehicle));
  if(d.lpg&&d.lpg.current)parts.push(buildLpgSection(d.lpg));
  if(d.weather&&d.weather.length)parts.push(buildWeatherSection(d.weather));
  if(d.snowStatus&&d.meta&&d.meta.season==='winter')parts.push(buildSnowSection(d.snowStatus,d.meta,d.itinerary));
  if(d.itinerary&&d.itinerary.length)parts.push(buildItinerarySection(d.itinerary,fc));
  if(d.budget)parts.push(buildBudgetSection(d.budget));
  return parts.join('');
}

// ── MASTER BAR ────────────────────────────────────────────────
function buildMasterBar(master,vehicle){
  if(!master)return'';
  var c=master.color||'#888';
  var alert=vehicle&&vehicle.systemAlert&&!vehicle.systemAlert.includes('VAN SYSTEMS OK')?vehicle.systemAlert:'';
  return'<div class="master-bar">'
    +'<div class="master-status" style="color:'+c+'">'
    +'<span class="status-dot" style="background:'+c+'"></span>'+master.status
    +'</div>'
    +'<div class="master-advice">'+(alert?'<span style="color:'+c+';margin-right:8px">'+alert+'</span>':master.advice)+'</div>'
    +'</div>';
}

// ── COUNTDOWN + NEXT DRIVE ────────────────────────────────────
function buildCountdown(meta,driveHtml){
  if(!meta)return'';
  var number='&mdash;',label='Trip status',badgeClass='',badgeText='';
  if(meta.tripStatus==='PRE_TRIP'&&meta.daysToDepart!==null){
    number=meta.daysToDepart;label='Days to departure';badgeClass='type-DRIVE';badgeText='Upcoming';
  }else if(meta.tripStatus==='ACTIVE'){
    number=meta.daysIntoTrip!==null?meta.daysIntoTrip:'&#9679;';
    label=meta.daysIntoTrip!==null?'Days into trip':'Active trip';
    badgeClass='type-DEPART';badgeText='On the road';
  }else if(meta.tripStatus==='POST_TRIP'){
    number='&#10003;';label='Trip complete';badgeClass='type-RETURN';badgeText='Returned';
  }
  var dateRange=(meta.departDate&&meta.returnDate)
    ?fmtDate(meta.departDate)+' &mdash; '+fmtDate(meta.returnDate)
    :meta.departDate?'From '+fmtDate(meta.departDate):'';
  var countdown='<div class="grid"><div class="countdown-card">'
    +'<div class="countdown-number">'+number+'</div>'
    +'<div class="countdown-detail">'
    +'<div class="countdown-label">'+label+'</div>'
    +'<div class="countdown-trip">'+(meta.tripName||'')+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +(badgeText?'<span class="trip-status-badge '+badgeClass+'">'+badgeText+'</span>':'')
    +(dateRange?'<span style="font-size:10px;color:var(--text-muted)">'+dateRange+'</span>':'')
    +'</div></div></div>'
    +driveHtml
    +'</div>';
  return countdown;
}


function buildNextDrive(meta,fc){
  var nd=meta.nextDrive;if(!nd)return'';
  var fuel=calcFuel(nd.distanceKm,fc);
 
  // Pass strip — winter trips, drive days only
  var passHtml='';
  if(currentData&&currentData.snowStatus&&currentData.snowStatus.passes&&currentData.meta&&currentData.meta.season==='winter'){
    var isDrive=['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(meta.todayType)>=0;
    var isTmrw=nd.date===fmtDateISO(new Date(Date.now()+86400000));
    if(isDrive||isTmrw){
      var passes=currentData.snowStatus.passes;
      if(passes.length){
        passHtml='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)">'
          +'<div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Passes on route</div>'
          +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
          +passes.map(function(p){
            var c=p.status.includes('Open')?'var(--go)':p.status.includes('Closed')?'var(--danger)':'var(--caution)';
            var icon=p.status.includes('Open')?'✅':p.status.includes('Closed')?'❌':'⚠️';
            return'<span style="font-size:11px">'
              +icon+' <span style="color:var(--text-dim)">'+p.name.replace(' Pass','')+'</span>'
              +' <strong style="color:'+c+'">'+p.status.replace('✅ ','').replace('❌ ','').replace('⚠️ ','')+'</strong>'
              +'</span>';
          }).join('<span style="color:var(--border2)">&nbsp;·&nbsp;</span>')
          +'</div></div>';
      }
    }
  }
 
  return'<div class="drive-card">'
    +'<div class="card-label" style="color:var(--frost);margin-bottom:10px">Next drive &middot; '+fmtDate(nd.date)+'</div>'
    +'<div class="drive-route">'
    +'<span class="drive-origin" style="color:var(--text-dim)">'+(meta.currentLocation||'&mdash;')+'</span>'
    +'<span class="drive-arrow">&rarr;</span>'
    +'<span class="drive-dest">'+nd.destination+'</span>'
    +'</div>'
    +'<div class="drive-meta">'
    +'<div class="drive-stat"><span class="drive-stat-label">Distance</span><span class="drive-stat-value">'+(nd.distanceKm?nd.distanceKm+' km':'&mdash;')+'</span></div>'
    +'<div class="drive-stat"><span class="drive-stat-label">Drive time</span><span class="drive-stat-value">'+(nd.durationMin?fmtDuration(nd.durationMin):'&mdash;')+'</span></div>'
    +(fuel?'<div class="drive-stat"><span class="drive-stat-label">Fuel est</span><span class="drive-stat-value">~'+fuel.litres+'L &middot; &pound;'+fuel.cost+'</span></div>':'')
    +(nd.notes?'<div class="drive-stat"><span class="drive-stat-label">Notes</span><span class="drive-stat-value" style="color:var(--text-dim)">'+nd.notes+'</span></div>':'')
    +'</div>'
    +passHtml
    +'</div>';
}
 
// helper — format date as yyyy-MM-dd for comparison
function fmtDateISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── VEHICLE ───────────────────────────────────────────────────
function buildVehicleSection(v){
  if(!v)return'';
  var bc=v.batteryV?(v.batteryV>=13?'var(--go)':v.batteryV>=12.4?'var(--caution)':'var(--danger)'):'var(--text-dim)';
  var gc=v.garageTempC!==null?(v.garageTempC<=2?'var(--danger)':v.garageTempC<=5?'var(--frost)':'var(--text)'):'var(--text-dim)';
  var cc=v.cabinTempC!==null?(v.cabinTempC<15?'var(--frost)':v.cabinTempC>26?'var(--caution)':'var(--go)'):'var(--text-dim)';
  var oc=v.odometerMiles?'var(--text)':'var(--text-dim)';
  var locationLink='';
  if(v.lat&&v.lon){

  }
  var statusMeta=locationLink;
  var body='<div class="van-grid">'
    +'<div class="van-card"><span class="van-card-icon">&#128267;</span>'

    +'<div class="van-card-label">Battery</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#127968;</span>'
    +'<div class="van-card-value" style="color:'+cc+'">'+(v.cabinTempC!==null?v.cabinTempC+'&deg;':'&mdash;')+'</div>'
    +'<div class="van-card-label">Cabin</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#128656;</span>'
    +'<div class="van-card-value" style="color:'+gc+'">'+(v.garageTempC!==null?v.garageTempC+'&deg;':'&mdash;')+'</div>'
    +'<div class="van-card-label">Garage</div></div>'

// ── WEATHER ───────────────────────────────────────────────────
function buildWeatherSection(weather){
  if(!weather||!weather.length)return'';

  // Limit display to today + 3 days
  var now=new Date();now.setHours(0,0,0,0);
  var cutoff=new Date(now.getTime()+3*86400000);
  weather=weather.filter(function(w){
    var d=new Date(w.date+'T00:00:00');
    return d<=cutoff;
  });
  if(!weather.length)return'';

  // Group by location preserving first-appearance order
  var groups={},order=[];
  weather.forEach(function(w){
    if(!groups[w.location]){groups[w.location]=[];order.push(w.location);}
    groups[w.location].push(w);
  });
  var now=new Date();now.setHours(0,0,0,0);
  var tom=new Date(now.getTime()+86400000);
  var dat=new Date(now.getTime()+2*86400000);
  function dayLabel(ds){
    var d=new Date(ds+'T00:00:00');d.setHours(0,0,0,0);
    if(d.getTime()===now.getTime())return'Today';
    if(d.getTime()===tom.getTime())return'Tomorrow';
    if(d.getTime()===dat.getTime())return d.toLocaleDateString('en-GB',{weekday:'long'});
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  }
  var body='<div class="weather-list">';
  order.forEach(function(loc){
    var rows=groups[loc];
    body+='<div class="weather-loc-head">'+loc+'</div>';
    rows.forEach(function(w){
      var rc=riskColor(w.risk);
      body+='<div class="weather-row'+(w.isToday?' today':'')+'">'
        +'<div class="weather-date"><strong>'+dayLabel(w.date)+'</strong></div>'
        +'<div class="weather-middle"><div class="weather-condition">'+w.condition+'</div></div>'
        +'<div class="weather-stats">'
        +'<div class="weather-risk" style="color:'+rc+'">'+w.risk+'</div>'
        +'<div class="weather-nums">'
        +(w.minTempC!==null?w.minTempC+'&deg;':'')
+(w.maxTempC!==null?' &mdash; '+w.maxTempC+'&deg; &middot; ':' &middot; ')
+(w.gustKmh?w.gustKmh+' km/h':'')
+(w.windDir?' '+w.windDir.replace(/\s*\(\d+°\)/,''):'')
        +(w.snowMm&&w.snowMm>0?' &middot; '+w.snowMm+'mm':'')
        +'</div></div></div>';
    });
  });
  body+='</div>';
  return makeSection('weather','Weather','Today + 3 days','',body);
}

// ── ITINERARY ─────────────────────────────────────────────────
function buildItinerarySection(itin,fc){
  var rows=itin.map(function(r){
    var d=new Date(r.date+'T00:00:00');
    var day=d.toLocaleDateString('en-GB',{weekday:'short'});
    var dt=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    var cls=r.isToday?' today':r.isPast?' past':'';
    var fuel=['DRIVE','DEPART','STOPOVER','ARRIVE','RETURN'].indexOf(r.type)>=0?calcFuel(r.distanceKm,fc):null;
    var fuelStr=fuel?' &middot; ~'+fuel.litres+'L/&pound;'+fuel.cost:'';
    var meta=[
      r.distanceKm?r.distanceKm+' km':'',
      r.durationMin?fmtDuration(r.durationMin):'',
      r.notes
    ].filter(Boolean).join(' &middot; ')+fuelStr;
    var mapsUrl=r.address
      ?'https://maps.apple.com/?address='+encodeURIComponent(r.address)
      :'https://maps.apple.com/?q='+encodeURIComponent(r.location);
    var ehuIcon=r.ehu?' <span style="font-size:11px;color:var(--frost)">&#128268;</span>':'';
    var riskHtml=(r.routeRisk&&r.routeRisk.snowRisk&&r.type!=='STAY')
      ?'<div style="font-size:11px;margin-top:3px;color:'+riskColor(r.routeRisk.snowRisk)+';font-weight:500">'+r.routeRisk.snowRisk+'</div>'
      :'';
    var contactHtml='';
    if(r.contact||r.bookingRef){
      var cp=[];
      if(r.contact)cp.push('<a href="tel:'+r.contact.replace(/[^0-9+]/g,'')+'" style="color:var(--frost);text-decoration:none">&#128222; '+r.contact+'</a>');
      if(r.bookingRef)cp.push('<span style="color:var(--text-muted)">REF: '+r.bookingRef+'</span>');
      contactHtml='<div style="font-size:11px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">'+cp.join('')+'</div>';
    }
    return'<div class="itin-row'+cls+'">'
      +'<div class="itin-date"><strong>'+(r.isToday?'Today':day)+'</strong>'+dt+'</div>'
      +'<div>'
      +'<div class="itin-location">'+r.location+ehuIcon+'</div>'
      +(meta?'<div class="itin-notes">'+meta+'</div>':'')
      +contactHtml
      +riskHtml
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
      +'<span class="itin-badge type-'+r.type+'">'+r.type+'</span>'
      +(r.type!=='STAY'?'<a href="'+mapsUrl+'" target="_blank" style="font-size:10px;color:var(--frost);text-decoration:none">&#128205; Maps</a>':'')
      +'</div></div>';
  }).join('');
  return makeSection('itinerary','Itinerary',itin.length+' days','','<div>'+rows+'</div>');
}

// ── UTILITIES ─────────────────────────────────────────────────
function calcFuel(distanceKm,fc){
  if(!distanceKm||!fc)return null;
  var miles=distanceKm/1.60934;
  var litres=miles/fc.mpg*4.54609;
  var cost=litres*fc.pricePerLitre;
  return{litres:Math.round(litres),cost:cost.toFixed(0)};
}
function fmtDate(iso){
  if(!iso)return'';
  return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}
function fmtDuration(mins){
  var h=Math.floor(mins/60),m=mins%60;
  return h>0?h+'h'+(m>0?' '+m+'m':''):m+'m';
}
function riskColor(risk){
  if(!risk)return'var(--text-dim)';
  if(risk.indexOf('DANGER')>=0||risk.indexOf('ICE')>=0||risk.indexOf('EXTREME')>=0)return'var(--danger)';
  if(risk.indexOf('CAUTION')>=0||risk.indexOf('WIND')>=0||risk.indexOf('High')>=0||risk.indexOf('Moderate')>=0)return'var(--caution)';
  if(risk.indexOf('Clear')>=0||risk.indexOf('OK')>=0)return'var(--go)';
  return'var(--text-dim)';
}

// ── LPG REFILL ────────────────────────────────────────────────
async function lpgRefill(){
  var btn=document.getElementById('refillBtn');
  if(!btn)return;
  btn.textContent='Logging...';btn.style.opacity='0.5';
  try{
    var params=new URLSearchParams();
    params.set('action','lpg_refill');
    if(currentTrip)params.set('trip',currentTrip);
    params.set('_',Date.now());
    var r=await fetch(API_URL+'?'+params.toString(),{redirect:'follow',headers:{'Accept':'application/json'}});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    btn.textContent='&#10003; Refilled';btn.style.color='var(--go)';btn.style.opacity='1';
    setTimeout(function(){refresh();},1500);
  }catch(e){
    btn.textContent='Error';btn.style.color='var(--danger)';btn.style.opacity='1';
    setTimeout(function(){btn.textContent='&#9981; Refill';btn.style.color='var(--frost)';},3000);
  }
}

function buildSnowSection(snow, meta, itin) {
  if (!snow || !snow.resorts || !snow.resorts.length) return '';
  if (meta.season !== 'winter') return '';
 
  var todayRow  = itin ? itin.find(function(r){ return r.isToday; }) : null;
  var todayType = todayRow ? todayRow.type : null;
  var isDrive   = todayType && ['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(todayType) >= 0;
 
  // ── Section meta ─────────────────────────────────────────────
  var summaryParts = [];
  if (snow.hasPowder)   summaryParts.push('❄️ Powder');
  if (snow.hasBluebird) summaryParts.push('☀️ Bluebird');
  if (snow.passBlocked) summaryParts.push('🚫 Pass closed');
  var sectionMeta = summaryParts.join(' · ') || snow.resorts.length + ' resorts';
 
  // ── Resort summary strip ─────────────────────────────────────
  var resortStrip = '<div style="display:grid;grid-template-columns:repeat('+Math.min(snow.resorts.length,4)+',1fr);border-bottom:1px solid var(--border)">'
    + snow.resorts.slice(0,4).map(function(r, idx) {
        var scoreColor = r.ssScore >= 80 ? 'var(--frost)'
                       : r.ssScore >= 60 ? 'var(--go)'
                       : r.ssScore >= 40 ? 'var(--caution)'
                       : r.ssScore > 0   ? 'var(--danger)'
                       : 'var(--text-muted)';
        var snowNum = r.snowDepthCm > 0
          ? '<div style="font-size:16px;font-weight:700;font-family:var(--display);color:var(--frost);line-height:1;margin-bottom:2px">'+r.snowDepthCm+'cm</div>'
          : '<div style="font-size:16px;font-weight:700;font-family:var(--display);color:var(--text-muted);line-height:1;margin-bottom:2px">—</div>';
        var badge = r.isPowder
          ? '<span style="font-size:8px;padding:1px 5px;border-radius:3px;background:#ddeeff;color:#185fa5;font-weight:600">❄️</span>'
          : r.isBluebird
          ? '<span style="font-size:8px;padding:1px 5px;border-radius:3px;background:#fdf0d8;color:#7a4800;font-weight:600">☀️</span>'
          : '<span style="height:14px;display:inline-block"></span>';
        return '<div style="padding:10px 6px;text-align:center;border-right:'+(idx<snow.resorts.length-1?'1px solid var(--border)':'none')+';cursor:pointer" onclick="toggleResortCard(\'rc-'+idx+'\')">'
          +'<div style="font-size:9px;color:var(--text-muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+r.name+'</div>'
          + snowNum
          +'<div style="display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:3px">'
          +'<div style="width:6px;height:6px;border-radius:50%;background:'+scoreColor+'"></div>'
          +'<span style="font-size:10px;color:var(--text-muted)">'+(r.ssScore>0?r.ssScore:'—')+'</span>'
          +'</div>'
          + badge
          +'</div>';
      }).join('')
    + '</div>';
 
  // ── Van context strip ────────────────────────────────────────
  var r0 = snow.resorts[0];
  var vanAlert = r0 && r0.snowAtVanLevel
    ? '<span style="font-size:10px;font-weight:600;color:var(--caution);background:#fcf8e3;padding:2px 8px;border-radius:4px">❄️ Snow at van level</span>'
    : '';
  var vanStrip = '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px">'
    +(function(){
      var vanElev = currentData&&currentData.vehicle&&currentData.vehicle.vanElevationM;
      return '<span style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)">🚐 Van · '+(vanElev?vanElev.toLocaleString()+'m':'—')+'</span>';
    })()
    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'
    +(r0&&r0.botTempC!==null?'<span style="font-size:11px;color:var(--text-dim)">🌡️ <strong style="color:var(--text)">'+r0.botTempC+'°C</strong></span>':'')
    +(r0&&r0.freezeM?'<span style="font-size:11px;color:var(--text-dim)">↑ Freeze <strong style="color:var(--text)">'+Math.round(r0.freezeM).toLocaleString()+'m</strong></span>':'')
    +(r0&&r0.botWindKh?'<span style="font-size:11px;color:var(--text-dim)">💨 <strong style="color:var(--text)">'+r0.botWindKh+' km/h</strong></span>':'')
    + vanAlert
    +'</div></div>';
 
  // ── Drive day road risk banner ───────────────────────────────
  var roadRiskHtml = '';
  if (isDrive && r0) {
    roadRiskHtml = r0.snowAtVanLevel
      ? '<div style="padding:9px 14px;background:#fdf8ee;border-bottom:1px solid var(--border);font-size:12px;color:var(--caution);font-weight:600">⚠️ Snow possible at van level — freeze level '+Math.round(r0.freezeM).toLocaleString()+'m</div>'
      : '<div style="padding:9px 14px;background:#f0f8f0;border-bottom:1px solid var(--border);font-size:12px;color:var(--go)">✅ Freeze level above route — rain not snow at van level</div>';
  }
 
  // ── Per-resort collapsible cards ─────────────────────────────
  var resortsHtml = snow.resorts.map(function(r, idx) {
 
    // Score colour
    var scoreColor = r.ssScore >= 80 ? 'var(--frost)'
                   : r.ssScore >= 60 ? 'var(--go)'
                   : r.ssScore >= 40 ? 'var(--caution)'
                   : r.ssScore > 0   ? 'var(--danger)'
                   : 'var(--text-muted)';
 
    // Badges
    var badges = '';
    if (r.isPowder)   badges += ' <span style="font-size:9px;background:#ddeeff;color:#185fa5;padding:1px 5px;border-radius:3px;font-weight:600">❄️ Powder</span>';
    if (r.isBluebird) badges += ' <span style="font-size:9px;background:#fdf0d8;color:#7a4800;padding:1px 5px;border-radius:3px;font-weight:600">☀️ Bluebird</span>';
 
    // Base depth bar colour
    var depthColor = r.snowDepthCm >= 100 ? 'var(--frost)'
                   : r.snowDepthCm >= 60  ? 'var(--go)'
                   : r.snowDepthCm >= 30  ? 'var(--caution)'
                   : r.snowDepthCm > 0    ? 'var(--danger)'
                   : 'var(--border2)';
    var depthPct = Math.min(100, Math.round((r.snowDepthCm / 150) * 100));
 
    // Elevation temps — use WWO if available, fall back to Open-Meteo
    var botTemp = r.botTempC !== null ? r.botTempC + '°' : '—';
    var midTemp = r.midTempC !== null ? r.midTempC + '°' : '—';
    var topTemp = r.topTempC !== null ? r.topTempC + '°' : '—';
    var botWind = r.botWindKh || r.windKmh || 0;
    var midWind = r.midWindKh || 0;
    var topWind = r.topWindKh || 0;
 
    // Wind colour
    function windColor(w) {
      return w > 50 ? 'var(--danger)' : w > 30 ? 'var(--caution)' : 'var(--go)';
    }
 
    // Fitment colour
    var fitColor = r.fitment && r.fitment.includes('Chains') ? 'var(--danger)'
                 : r.fitment && r.fitment.includes('3PMSF')  ? 'var(--caution)'
                 : 'var(--go)';
 
    // Collapsed by default except first resort
    var cardId  = 'rc-' + idx;
 
    return '<div style="border-top:1px solid var(--border)" id="'+cardId+'">'
      // Card header — always visible
      +'<div style="display:flex;align-items:center;padding:11px 14px;cursor:pointer;gap:8px" onclick="toggleResortCard(\''+cardId+'\')">'
      +'<div style="flex:1;min-width:0">'
      +'<div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">'
      +'<span style="font-size:13px;font-weight:700;font-family:var(--display);color:var(--text)">'+r.name+'</span>'
      + badges
      +'</div>'
      +'<div style="font-size:11px;color:var(--text-dim)">'
      +(r.elevationM?r.elevationM.toLocaleString()+'m':'')
      +(r.snowDepthCm?' &middot; '+r.snowDepthCm+'cm base':'')
      +(r.ssRating?' &middot; '+r.ssRating:'')
      +'</div></div>'
      // Score chip
      +'<div style="display:flex;align-items:center;gap:5px;flex-shrink:0">'
      +'<span style="font-size:15px;font-weight:700;font-family:var(--display);color:'+scoreColor+'">'+(r.ssScore>0?r.ssScore:'—')+'</span>'
      +'<div style="width:36px;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden">'
      +'<div style="height:100%;width:'+(r.ssScore||0)+'%;background:'+scoreColor+';border-radius:2px"></div>'
      +'</div></div>'
      +'<span class="rc-chev-'+cardId+'" style="font-size:12px;color:var(--gold);transition:transform 0.2s;display:inline-block;transform:rotate(-90deg)">›</span>'
      +'</div>'
      // Card body — collapsible
      +'<div class="rc-body-'+cardId+'" style="border-top:1px solid var(--border);display:none">'
 
      // Base depth bar
      +'<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border)">'
      +'<span style="font-size:20px;font-weight:700;font-family:var(--display);color:'+depthColor+';min-width:58px">'+(r.snowDepthCm?r.snowDepthCm+'cm':'—')+'</span>'
      +'<div style="flex:1">'
      +'<div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;margin-bottom:3px">'
      +'<div style="height:100%;width:'+depthPct+'%;background:'+depthColor+';border-radius:4px"></div>'
      +'</div>'
      +'<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--text-muted)">'
      +'<span>0</span><span>Base depth</span><span>150cm</span>'
      +'</div></div></div>'

      // Snow history strip
      +(r.snow24hCm||r.snow7dCm||r.seasonTotalCm
        ?'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)">'
          +[
            {label:'24h snow',  val:r.snow24hCm,     unit:'cm'},
            {label:'7d snow',   val:r.snow7dCm,      unit:'cm'},
            {label:'Season',    val:r.seasonTotalCm, unit:'cm'}
          ].map(function(s){
            return '<div style="padding:7px 10px;text-align:center;border-right:1px solid var(--border)">'
              +'<div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px">'+s.label+'</div>'
              +'<div style="font-size:15px;font-weight:700;font-family:var(--display);color:'+(s.val>0?'var(--frost)':'var(--text-muted)')+'">'+s.val+s.unit+'</div>'
              +'</div>';
          }).join('')
          +'</div>'
        :'')
 
      // Elevation strip — bottom / mid / top
      +'<div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-bottom:1px solid var(--border)">'
      +[
        {label:'Valley', temp:botTemp, wind:botWind, alt:r.elevationM},
        {label:'Piste',  temp:midTemp, wind:midWind, alt:r.elevationM?Math.round(r.elevationM*1.3):null},
        {label:'Summit', temp:topTemp, wind:topWind, alt:null}
      ].map(function(e, ei) {
        return '<div style="padding:8px 10px;text-align:center;border-right:'+(ei<2?'1px solid var(--border)':'none')+'">'
          +'<div style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:3px">'+e.label+'</div>'
          +'<div style="font-size:17px;font-weight:700;font-family:var(--display);line-height:1;margin-bottom:2px">'+e.temp+'</div>'
          +'<div style="font-size:9px;color:'+windColor(e.wind)+'">💨 '+e.wind+' km/h</div>'
          +(e.alt?'<div style="font-size:9px;color:var(--text-muted)">'+e.alt.toLocaleString()+'m</div>':'')
          +'</div>';
      }).join('')
      +'</div>'
 
      // Condition + fitment + trend row
      +'<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px">'
      +'<span style="font-size:12px;color:var(--text);font-weight:600">'+r.condition+'</span>'
      +'<div style="display:flex;gap:8px;align-items:center;font-size:11px">'
      +(r.fitment?'<span style="color:'+fitColor+';font-weight:600">'+r.fitment+'</span>':'')
      +(r.trend?'<span style="color:var(--text-muted)">'+r.trend+'</span>':'')
      +(r.chanceSnow>0?'<span style="color:var(--frost)">'+r.chanceSnow+'% snow</span>':'')
      +'</div></div>'
 
      // SnowSure tagline if available
      +(r.ssTagline?'<div style="padding:8px 14px;font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--border);background:var(--bg2)">'+r.ssTagline+'</div>':'')
// Lifts and runs
      +(r.liftsTotal>0
        ?'<div style="padding:8px 14px;border-bottom:1px solid var(--border)">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">'
          +'<span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)">Lifts &amp; runs</span>'
          +'<div style="display:flex;gap:10px;font-size:11px;color:var(--text-dim)">'
          +'<span><strong style="color:var(--text)">'+r.liftsOpen+'</strong>/'+r.liftsTotal+' lifts</span>'
          +(r.runsTotal>0?'<span><strong style="color:var(--text)">'+r.runsOpen+'</strong>/'+r.runsTotal+' runs</span>':'')
          +(r.surfaceCondition?'<span style="color:var(--text-muted)">'+r.surfaceCondition+'</span>':'')
          +'</div></div>'
          +'<div style="height:5px;background:var(--bg3);border-radius:3px;overflow:hidden">'
          +'<div style="height:100%;width:'+Math.min(100,Math.round((r.liftsOpen/r.liftsTotal)*100))+'%;background:var(--frost);border-radius:3px"></div>'
          +'</div></div>'
        :'')
      // 3-day forecast strip
      +(r.forecast3d&&r.forecast3d.length
        ?'<div>'
          +r.forecast3d.map(function(d){
            var isSnow  = d.snowfall>0;
            var dateObj = new Date(d.date+'T00:00:00');
            var dayLbl  = dateObj.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
            var snowCol = isSnow?'var(--frost)':'var(--text-muted)';
            var icon    = d.snowfall>=5?'❄️':d.snowfall>0?'🌨️':d.precipProb>60?'🌧️':d.precipProb>30?'⛅':'☀️';
            return'<div style="display:grid;grid-template-columns:80px 36px 1fr auto;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--border)">'
              +'<span style="font-size:11px;color:var(--text-dim)">'+dayLbl+'</span>'
              +'<span style="font-size:12px;font-weight:600;color:'+snowCol+'">'+(isSnow?d.snowfall.toFixed(1)+'cm':'0cm')+'</span>'
              +'<span style="font-size:11px;color:var(--text-dim)">'+icon+' '+d.desc+'</span>'
              +'<span style="font-size:10px;color:var(--text-muted)">'+Math.round(d.tempMin)+'–'+Math.round(d.tempMax)+'°</span>'
              +'</div>';
          }).join('')
          +'</div>'
        :'')

      +'</div></div>';
 
  }).join('');
 
  var body = roadRiskHtml + resortStrip + vanStrip + resortsHtml;
  return makeSection('snow', 'Snow &middot; Conditions', sectionMeta, '', body);
}
 
// Toggle individual resort card
function toggleResortCard(id) {
  var body = document.querySelector('.rc-body-' + id);
  var chev = document.querySelector('.rc-chev-' + id);
  if (!body) return;
  var open = body.style.display === 'none';

  // Close all other cards first
  document.querySelectorAll('[class^="rc-body-"]').forEach(function(el) {
    el.style.display = 'none';
  });
  document.querySelectorAll('[class^="rc-chev-"]').forEach(function(el) {
    el.style.transform = 'rotate(-90deg)';
  });

  // Open clicked card if it was closed
  if (open) {
    body.style.display = 'block';
    if (chev) chev.style.transform = '';
  }
}



function buildBudgetSection(budget) {
  if (!budget) return '';

  var total    = budget.estimateTotal;
  var actual   = budget.actualTotal;
  var hasActual = Object.values(budget.manual).some(function(m){ return m.actual !== null; });
  var rateNote = budget.rate ? '1€ = £' + budget.rate.toFixed(4) : '';

  // Section meta — headline figure
  var sectionMeta = hasActual
    ? 'Est £' + total.toLocaleString() + ' · Act £' + actual.toLocaleString()
    : 'Est £' + total.toLocaleString();

  // Table helper
  function row(label, est, act, notes, isEur) {
    var actStr = act !== null ? '£' + Math.round(act).toLocaleString() : '—';
    var estStr = '£' + Math.round(est).toLocaleString();
    var origStr = isEur && est ? ' <span style="font-size:10px;color:var(--text-muted)">(' + Math.round(est / (budget.rate||0.85)) + '€)</span>' : '';
    return '<tr style="border-bottom:1px solid var(--border)">'
      + '<td style="padding:6px 0;color:var(--text-dim);font-size:13px">' + label
      + (notes ? '<div style="font-size:10px;color:var(--text-muted)">' + notes + '</div>' : '')
      + '</td>'
      + '<td style="padding:6px 0;text-align:right;font-size:13px;color:var(--text)">' + estStr + origStr + '</td>'
      + '<td style="padding:6px 0;text-align:right;font-size:13px;color:'
      + (act !== null ? 'var(--go)' : 'var(--text-muted)') + '">' + actStr + '</td>'
      + '</tr>';
  }

  var body = '<div style="padding:0 18px 12px">'
    // Column headers
    + '<table style="width:100%;border-collapse:collapse;margin-top:12px">'
    + '<thead><tr>'
    + '<th style="text-align:left;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Category</th>'
    + '<th style="text-align:right;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Estimate</th>'
    + '<th style="text-align:right;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Actual</th>'
    + '</tr></thead><tbody>';

  // Auto-calculated rows
  if (budget.auto) {
    if (budget.auto.fuel)      body += row('Fuel',      budget.auto.fuel.estimate,      null, '', false);
    if (budget.auto.lpg)       body += row('LPG',       budget.auto.lpg.estimate,       null, '', false);
    if (budget.auto.campsites) body += row('Campsites', budget.auto.campsites.estimate, null, '', false);
  }

  // Manual rows from trip sheet budget block
  Object.keys(budget.manual).forEach(function(label) {
    var m = budget.manual[label];
    body += row(label, m.estimate, m.actual, m.notes, m.isEur);
  });

  // Total row
  body += '<tr>'
    + '<td style="padding:10px 0 4px;font-weight:700;font-family:var(--display);font-size:14px">Total</td>'
    + '<td style="padding:10px 0 4px;text-align:right;font-weight:700;font-family:var(--display);font-size:14px;color:var(--gold)">£' + total.toLocaleString() + '</td>'
    + '<td style="padding:10px 0 4px;text-align:right;font-weight:700;font-family:var(--display);font-size:14px;color:'
    + (hasActual ? 'var(--go)' : 'var(--text-muted)') + '">'
    + (hasActual ? '£' + actual.toLocaleString() : '—') + '</td>'
    + '</tr>'
    + '</tbody></table>'
    + (rateNote ? '<div style="font-size:10px;color:var(--text-muted);margin-top:6px">' + rateNote + '</div>' : '')
    + '</div>';

  // Collapsed by default — pass 'true' as 5th arg to makeSection
  var section = makeSection('budget', 'Budget', sectionMeta, '', body);
  return section;
}

async function editPrice(type,current){
  var newVal=prompt((type==='diesel'?'Diesel':'LPG')+' price per litre (\u00a3):',current);
  if(!newVal||isNaN(parseFloat(newVal)))return;
  try{
    var params=new URLSearchParams();
    params.set('action','update_price');
    params.set('type',type);
    params.set('value',parseFloat(newVal));
    params.set('_',Date.now());
    var r=await fetch(API_URL+'?'+params.toString(),{redirect:'follow',headers:{'Accept':'application/json'}});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    setTimeout(function(){refresh();},500);
  }catch(e){
    alert('Failed to update: '+e.message);
  }
}

// ── SETTINGS PANEL ────────────────────────────────────────────
function toggleSettings(){
  var panel=document.getElementById('settingsPanel');
  var btn=document.getElementById('settingsBtn');
  var open=panel.classList.toggle('open');
  btn.textContent=open?'✕ Close':'⚙️ Settings';
  if(open&&currentData)renderSettings(currentData);
}

function renderSettings(d){
  var fc=d.fuelConfig||{};

// ── GPX PARSER MODULE — paste into index.html ────────────────
// Handles both namespaced (Strava) and non-namespaced GPX files
// Works with <trk>/<trkpt> and <rte>/<rtept> formats

// ── Main parse function ───────────────────────────────────────
function parseGPX(xmlText) {
  var parser = new DOMParser();
  var doc    = parser.parseFromString(xmlText, 'text/xml');

  // Handle namespace — Strava uses http://www.topografix.com/GPX/1/1
  // Try namespaced first, fall back to non-namespaced
  var NS = 'http://www.topografix.com/GPX/1/1';

  function getPoints(tag) {
    var pts = doc.getElementsByTagNameNS(NS, tag);
    if (!pts.length) pts = doc.getElementsByTagName(tag);
    return Array.from(pts);
  }

  function getText(el, tag) {
    var found = el.getElementsByTagNameNS(NS, tag);
    if (!found.length) found = el.getElementsByTagName(tag);
    return found.length ? found[0].textContent.trim() : '';
  }

  // Get track points (recorded) or route points (planned)
  var points = getPoints('trkpt');
  if (!points.length) points = getPoints('rtept');
  if (!points.length) return null;

  // Extract lat/lon/elevation per point
  var trackPoints = [];
  var cumKm = 0;
  var prevLat, prevLon;

  points.forEach(function(pt, i) {
    var lat = parseFloat(pt.getAttribute('lat'));
    var lon = parseFloat(pt.getAttribute('lon'));
    var ele = parseFloat(getText(pt, 'ele')) || 0;

    if (isNaN(lat) || isNaN(lon)) return;

    if (i > 0 && prevLat !== undefined) {
      cumKm += haversineKm(prevLat, prevLon, lat, lon);
    }

    trackPoints.push({
      lat:        lat,
      lon:        lon,
      ele:        ele,
      distanceKm: Math.round(cumKm * 10) / 10
    });

    prevLat = lat;
    prevLon = lon;
  });

  if (!trackPoints.length) return null;

  // Route name
  var nameEl = doc.getElementsByTagNameNS(NS, 'name');
  if (!nameEl.length) nameEl = doc.getElementsByTagName('name');
  var routeName = nameEl.length ? nameEl[0].textContent.trim() : 'Route';

  // Total elevation gain
  var totalEleGain = 0;
  for (var i = 1; i < trackPoints.length; i++) {
    var gain = trackPoints[i].ele - trackPoints[i-1].ele;
    if (gain > 0) totalEleGain += gain;
  }

  return {
    name:        routeName,
    totalKm:     Math.round(trackPoints[trackPoints.length-1].distanceKm * 10) / 10,
    totalEleM:   Math.round(totalEleGain),
    minEle:      Math.round(Math.min.apply(null, trackPoints.map(function(p){ return p.ele; }))),
    maxEle:      Math.round(Math.max.apply(null, trackPoints.map(function(p){ return p.ele; }))),
    points:      trackPoints
  };
}

// ── Haversine distance ────────────────────────────────────────
function haversineKm(lat1, lon1, lat2, lon2) {
  var R    = 6371;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLon = (lon2-lon1) * Math.PI/180;
  var a    = Math.sin(dLat/2)*Math.sin(dLat/2)
           + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
           * Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Wind bearing calculation ──────────────────────────────────
function calcBearing(lat1, lon1, lat2, lon2) {
  var dLon  = (lon2-lon1) * Math.PI/180;
  var lat1r = lat1 * Math.PI/180;
  var lat2r = lat2 * Math.PI/180;
  var y     = Math.sin(dLon) * Math.cos(lat2r);
  var x     = Math.cos(lat1r)*Math.sin(lat2r) - Math.sin(lat1r)*Math.cos(lat2r)*Math.cos(dLon);
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}

// ── Segment detection — finds key climbs and cols ─────────────
function detectSegments(gpx, startTime, flatSpeedKmh, climbSpeedKmh) {
  var points = gpx.points;
  flatSpeedKmh  = flatSpeedKmh  || 35;
  climbSpeedKmh = climbSpeedKmh || 10;
  var paceMinPerKm = 60 / flatSpeedKmh;
  console.log('detectSegments — maxEle:', gpx.maxEle, 'points:', points.length, 'flatSpeed:', flatSpeedKmh);

  // Sample every Nth point for performance
  // More samples for shorter routes — better resolution
  var targetSamples = gpx.totalKm > 100 ? 150 : gpx.totalKm > 50 ? 200 : 300;
  var SAMPLE = Math.max(1, Math.floor(points.length / targetSamples));
  var sampled = [];
  for (var i = 0; i < points.length; i += SAMPLE) {
    sampled.push(points[i]);
  }

  // Find local elevation maxima (col summits)
  var rawSummits = [];
  var WIN = 3; // window either side

  for (var i = WIN; i < sampled.length - WIN; i++) {
    var pt  = sampled[i];
    var ele = pt.ele;

    // Check if local maximum
    var isMax = true;
    for (var j = i-WIN; j <= i+WIN; j++) {
      if (j !== i && sampled[j].ele >= ele) { isMax = false; break; }
    }

    // Auto threshold — adaptive based on route max elevation
    // Alpine: 60% of max ele (e.g. 2000m route → 1200m threshold)
    // Yorkshire: much lower — 20% of max ele or 100m minimum
    var eleThreshold = gpx.maxEle > 1000
      ? Math.max(800,  gpx.maxEle * 0.6)   // Alpine — high cols only
      : Math.max(50,   gpx.maxEle * 0.2);  // Local — any meaningful summit

    if (!isMax || ele < eleThreshold) continue;

    // Calculate elevation gain approaching summit
    var lookbackEle = sampled[Math.max(0, i-10)].ele;
    var gain = ele - lookbackEle;

    // Gain threshold — also adaptive
    var gainThreshold = gpx.maxEle > 1000 ? 80 : 30;
    if (gain < gainThreshold) continue;

    // Calculate ETA at this point
    var etaMins = calcETA(pt.distanceKm, flatSpeedKmh, gain, climbSpeedKmh);
    var eta     = new Date(startTime.getTime() + etaMins * 60000);

    // Route bearing at this segment (for crosswind calculation)
    var prevPt = sampled[Math.max(0, i-5)];
    var bearing = calcBearing(prevPt.lat, prevPt.lon, pt.lat, pt.lon);

    rawSummits.push({
      lat:        pt.lat,
      lon:        pt.lon,
      ele:        Math.round(ele),
      distanceKm: pt.distanceKm,
      etaISO:     eta.toISOString(),
      etaStr:     formatTime_(eta),
      elevGain:   Math.round(gain),
      bearing:    Math.round(bearing),
      type:       'summit'
    });
  }

  // Deduplicate summits within 1km of each other — keep highest
  var summits = [];
  rawSummits.forEach(function(s) {
    // Smaller dedup window for local routes — 0.5km, 2km for Alpine
    var dedupKm = gpx.maxEle > 1000 ? 2.0 : 0.5;
    var nearby = summits.findIndex(function(existing) {
      return Math.abs(existing.distanceKm - s.distanceKm) < dedupKm;
    });
    if (nearby >= 0) {
      if (s.ele > summits[nearby].ele) summits[nearby] = s;
    } else {
      summits.push(s);
    }
  });

  // Add start
  var startPt = points[0];
  var startEta = new Date(startTime.getTime());
  summits.unshift({
    lat: startPt.lat, lon: startPt.lon, ele: Math.round(startPt.ele),
    distanceKm: 0, etaISO: startEta.toISOString(),
    etaStr: formatTime_(startEta), elevGain: 0,
    bearing: 0, type: 'start', name: 'Start'
  });

  // Add finish
  var finishPt  = points[points.length-1];
  var totalMins = calcETA(finishPt.distanceKm, flatSpeedKmh, 0, climbSpeedKmh);
  var finishEta = new Date(startTime.getTime() + totalMins * 60000);
  summits.push({
    lat: finishPt.lat, lon: finishPt.lon, ele: Math.round(finishPt.ele),
    distanceKm: finishPt.distanceKm, etaISO: finishEta.toISOString(),
    etaStr: formatTime_(finishEta), elevGain: 0,
    bearing: 0, type: 'finish', name: 'Finish'
  });

  return summits;
}

// ── ETA calculation — pace adjusted for gradient ──────────────
function calcETA(distanceKm, flatSpeedKmh, elevGain, climbSpeedKmh) {
  climbSpeedKmh = climbSpeedKmh || flatSpeedKmh * 0.35;
  if (distanceKm <= 0) return 0;
  var gradientPct  = elevGain > 0 ? (elevGain / (distanceKm * 1000)) * 100 : 0;
  var blendFactor  = Math.min(gradientPct / 8, 1);
  var effectiveSpd = flatSpeedKmh * (1 - blendFactor) + climbSpeedKmh * blendFactor;
  return (distanceKm / effectiveSpd) * 60;
}

function windDegToArrow(deg) {
  var arrows = ['↓','↙','←','↖','↑','↗','→','↘'];
  return arrows[Math.round((deg || 0) / 45) % 8];
}

// ── Format time helper ────────────────────────────────────────
function formatTime_(date) {
  return date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

// ── Generate alert GPX for Garmin ────────────────────────────
function generateAlertGPX(routeName, segments) {
  var wpts = segments.filter(function(s) {
    return s.overallRisk && s.overallRisk !== 'ok' && s.type !== 'start';
  });

  if (!wpts.length) return null;

  var xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<gpx version="1.1" creator="Audrey · Cima">\n'
    + '  <metadata><name>' + routeName + ' · Cima Alerts</name></metadata>\n';

  wpts.forEach(function(s) {
    var alertLabel = s.risks && s.risks.length ? s.risks[0].label.substring(0,30) : '⚠️ Check conditions';
    xml += '  <wpt lat="' + s.lat + '" lon="' + s.lon + '">\n'
        +  '    <ele>' + s.ele + '</ele>\n'
        +  '    <name>' + alertLabel + '</name>\n'
        +  '    <desc>km ' + s.distanceKm + ' · ETA ' + s.etaStr
        +  ' · ' + (s.tempC !== undefined ? s.tempC + '°C' : '') + '</desc>\n'
        +  '  </wpt>\n';
  });

  xml += '</gpx>';
  return xml;
}

async function runGPXAnalysis() {
  if (!cyclingGPX) return;
 
  var startTimeStr = document.getElementById('cyclingStartTime').value || '06:30';
  var flatSpeed  = parseFloat(document.getElementById('cyclingFlatSpeed').value)  || 35;
  var climbSpeed = parseFloat(document.getElementById('cyclingClimbSpeed').value) || 10;
  var pace       = 60 / flatSpeed; // kept for compatibility
 
  // Build start datetime — use date picker if set, else today/tomorrow
  var now      = new Date();
  var parts    = startTimeStr.split(':');
  var dateInput = document.getElementById('cyclingDate').value;
  var startDt;
  if (dateInput) {
    var dp = dateInput.split('-');
    startDt = new Date(parseInt(dp[0]), parseInt(dp[1])-1, parseInt(dp[2]),
                       parseInt(parts[0]), parseInt(parts[1]), 0);
  } else {
    startDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                       parseInt(parts[0]), parseInt(parts[1]), 0);
    if (startDt <= now) startDt.setDate(startDt.getDate() + 1);
  }
 
  // Detect segments
  cyclingSegments = detectSegments(cyclingGPX, startDt, flatSpeed, climbSpeed);
 // Cap at 10 segments to avoid URL length issues
  if (cyclingSegments.length > 10) {
    var start  = cyclingSegments[0];
    var finish = cyclingSegments[cyclingSegments.length - 1];
    var middle = cyclingSegments.slice(1, -1)
      .sort(function(a,b){ return b.ele - a.ele; }) // highest first
      .slice(0, 8);
    middle.sort(function(a,b){ return a.distanceKm - b.distanceKm; }); // restore order
    cyclingSegments = [start].concat(middle).concat([finish]);
  }
  console.log('Segments to analyse:', JSON.stringify(cyclingSegments).substring(0, 500));
  console.log('Segment count:', cyclingSegments ? cyclingSegments.length : 'null');
  // Show loading
  document.getElementById('cyclingModalBody').innerHTML =
    '<div class="cycling-loading">🌤️ Fetching weather for ' + cyclingSegments.length + ' segments...<br>'
    + '<span style="font-size:11px;color:var(--text-muted)">This takes a few seconds</span></div>';
 
  try {
    // Trim segments to key fields only for GET request
    var trimmedSegs = cyclingSegments.map(function(s) {
      return {
        lat: s.lat, lon: s.lon, ele: s.ele,
        distanceKm: s.distanceKm, etaISO: s.etaISO,
        etaStr: s.etaStr, type: s.type, bearing: s.bearing || 0
      };
    });

    var params = new URLSearchParams();
    params.set('action',    'analyse_gpx');
    params.set('segments',  JSON.stringify(trimmedSegs));
    params.set('routeName', cyclingGPX.name);
    params.set('totalKm',   cyclingGPX.totalKm);
    params.set('totalEleM', cyclingGPX.totalEleM);
    params.set('_',         Date.now());

    var r = await fetch(API_URL + '?' + params.toString(), {
      redirect: 'follow',
      headers: { 'Accept': 'application/json' }
    });
    var data = await r.json();
 
    console.log('API response:', JSON.stringify(data).substring(0, 500));
    if (data.error) throw new Error(data.error);
    if (!data.success) throw new Error('Analysis failed — ' + JSON.stringify(data).substring(0, 200));
 
    cyclingResults = data;
    renderCyclingResults(data);
 
  } catch(err) {
    document.getElementById('cyclingModalBody').innerHTML =
      '<div class="cycling-loading" style="color:var(--danger)">❌ Analysis failed: ' + err.message + '</div>';
  }
}
 
function renderCyclingResults(data) {
  var segs = data.segments || [];
 
  // Overall risk colour
  var riskColor = data.routeRisk === 'danger'  ? 'var(--danger)'
                : data.routeRisk === 'caution' ? 'var(--caution)'
                : 'var(--go)';
  var riskLabel = data.routeRisk === 'danger'  ? '🔴 High risk'
                : data.routeRisk === 'caution' ? '🟡 Caution'
                : '🟢 All clear';
 
  // Check if any alerts for GPX download
  var hasAlerts = segs.some(function(s){ return s.overallRisk && s.overallRisk !== 'ok'; });
 
  var html = ''
    // Route header
    + '<div class="cycling-route-header">'
    + '<div class="cycling-route-name">' + (data.routeName || 'Route') + '</div>'
    + '<div class="cycling-route-stats">'
    + '<div class="cycling-stat"><div class="cycling-stat-val">' + data.totalKm + '</div><div class="cycling-stat-label">km</div></div>'
    + '<div class="cycling-stat"><div class="cycling-stat-val">' + (data.totalEleM||0).toLocaleString() + '</div><div class="cycling-stat-label">metres</div></div>'
    + '<div class="cycling-stat"><div class="cycling-stat-val">' + segs.length + '</div><div class="cycling-stat-label">segments</div></div>'
    + '</div></div>'
    // Risk banner
    + '<div class="cycling-risk-banner">'
    + '<span style="font-family:var(--display);font-size:13px;font-weight:700;color:' + riskColor + '">' + riskLabel + '</span>'
    + '<button onclick="openCyclingModal()" style="background:none;border:none;font-size:11px;color:var(--frost);cursor:pointer">← New route</button>'
    + '</div>'
    // Segments
    + '<div>';
 
  segs.forEach(function(seg, idx) {
    var riskIcon = seg.overallRisk === 'danger'  ? '🔴'
                 : seg.overallRisk === 'caution' ? '⚠️'
                 : seg.type === 'finish'         ? '🏁'
                 : seg.type === 'start'          ? '🚴'
                 : '✅';
 
    var segName = seg.type === 'start'  ? 'Start'
                : seg.type === 'finish' ? 'Finish'
                : seg.ele + 'm col';
 
    html += '<div class="cycling-seg" onclick="toggleCyclingSeg(\'cs' + idx + '\')">'
      + '<div class="cycling-seg-head">'
      + '<div class="cycling-seg-km">km ' + seg.distanceKm + '</div>'
      + '<div class="cycling-seg-left">'
      + '<div class="cycling-seg-name">' + segName + '</div>'
      +'<div class="cycling-seg-alt">' + seg.ele + 'm · ETA ' + seg.etaStr
      +(seg.crosswindAngle > 45 && seg.crosswindAngle < 135 && seg.windKmh > 25 ? ' · ⚠️ Crosswind' : '')
      +'</div>'
      + '</div>'
      + '<div class="cycling-seg-right">'
      + '<span style="font-size:11px;color:var(--text-dim)">'
      + (seg.tempC !== null && seg.tempC !== undefined ? seg.tempC + '°' : '') + '</span>'
      + '<span style="font-size:18px">' + riskIcon + '</span>'
      + '</div></div>'
      // Expanded body
      + '<div class="cycling-seg-body" id="cs' + idx + '">';
 
    if (seg.error) {
      html += '<div class="cycling-alert c-alert-ok">⚠️ Could not fetch weather: ' + seg.error + '</div>';
    } else {
      html += '<div class="cycling-wx-grid">'
        + '<div class="cycling-wx-item"><div class="cycling-wx-label">Temp</div>'
        + '<div class="cycling-wx-val" style="color:' + (seg.tempC > 28 ? 'var(--caution)' : seg.tempC < 5 ? 'var(--frost)' : 'var(--text)') + '">'
        + (seg.tempC !== null ? seg.tempC + '°C' : '—') + '</div></div>'
        +'<div class="cycling-wx-item"><div class="cycling-wx-label">Wind</div>'
      +'<div class="cycling-wx-val" style="color:'+( seg.windKmh > 35 ? 'var(--danger)' : seg.windKmh > 20 ? 'var(--caution)' : 'var(--go)')+'">'
      + seg.windKmh + 'km/h</div>'
      +'<div style="font-size:9px;color:var(--text-muted)">'
      + windDegToArrow(seg.windDeg) + ' ' + (seg.windDeg||0) + '°</div></div>'
        + '<div class="cycling-wx-item"><div class="cycling-wx-label">Rain</div>'
        + '<div class="cycling-wx-val" style="color:' + (seg.precipProb > 60 ? 'var(--danger)' : seg.precipProb > 30 ? 'var(--caution)' : 'var(--go)') + '">'
        + seg.precipProb + '%</div></div>'
        + '</div>'
        + '<div style="font-size:12px;color:var(--text-dim);margin-bottom:8px">' + (seg.condition || '') + '</div>';
 
      if (seg.risks && seg.risks.length) {
        seg.risks.forEach(function(r) {
          var cls = r.type === 'storm' ? 'c-alert-storm'
                  : r.type === 'wind'  ? 'c-alert-wind'
                  : r.type === 'heat'  ? 'c-alert-heat'
                  : 'c-alert-cold';
          html += '<div class="cycling-alert ' + cls + '">' + r.label + '</div>';
        });
      } else {
        html += '<div class="cycling-alert c-alert-ok">✅ Clear conditions at this segment</div>';
      }
    }
 
    html += '</div></div>';
  });
 
  html += '</div>';
 
  // Alert GPX download
  if (hasAlerts) {
    html += '<div class="cycling-gpx-download">'
      + '<div style="font-size:12px;font-weight:600;color:var(--go);margin-bottom:4px">📎 Alert GPX ready</div>'
      + '<div style="font-size:11px;color:var(--text-dim);margin-bottom:10px">'
      + 'Waypoint alerts at risk segments — load to Garmin Connect tonight, syncs overnight.</div>'
      + '<button onclick="downloadAlertGPX()" style="width:100%;padding:11px;background:var(--go);color:#fff;border:none;border-radius:6px;font-family:var(--display);font-size:13px;font-weight:700;cursor:pointer">'
      + '⬇️ Download alert GPX</button>'
      + '</div>';
  }
 
  document.getElementById('cyclingModalBody').innerHTML = html;
}
 
function toggleCyclingSeg(id) {
  var body = document.getElementById(id);
  if (!body) return;
  var open = body.classList.contains('open');
  document.querySelectorAll('.cycling-seg-body').forEach(function(b){ b.classList.remove('open'); });
  if (!open) body.classList.add('open');
}
 
function downloadAlertGPX() {
  if (!cyclingResults || !cyclingSegments) return;
 
  // Merge weather results back into segments for GPX generation
  var enriched = cyclingSegments.map(function(seg, i) {
    return Object.assign({}, seg, cyclingResults.segments[i] || {});
  });
 
  var gpxContent = generateAlertGPX(cyclingResults.routeName, enriched);
  if (!gpxContent) {
    alert('No risk alerts detected — no GPX needed!');
    return;
  }
 
  // Download the file
  var blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = (cyclingResults.routeName || 'route').replace(/\s+/g,'-') + '-cima-alerts.gpx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
 
refresh();
</script>
</body>
</html>
