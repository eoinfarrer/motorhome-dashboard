<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Audrey - Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--bg2:#eceae4;--bg3:#e4e2db;
  --border:#d4d0c8;--border2:#c8c4ba;
  --text:#1a1a18;--text-dim:#555;--text-muted:#999;
  --go:#1a8a4a;--caution:#c07800;--danger:#c0392b;
  --frost:#2471a3;--gold:#9a7040;
  --mono:'DM Mono',monospace;--display:'Syne',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{background:var(--bg);}
body{background:var(--bg);color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.5;min-height:100vh;padding-top:var(--safe-top);-webkit-font-smoothing:antialiased;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border);background:var(--bg);position:sticky;top:0;z-index:100;gap:12px;box-shadow:0 1px 8px rgba(0,0,0,0.06);}
.header-left{display:flex;align-items:baseline;gap:10px;flex-shrink:0;}
.wordmark{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-0.5px;color:var(--text);}
.wordmark span{color:var(--gold);}
.header-tag{font-size:9px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;}
.trip-selector{background:white;border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:4px;outline:none;cursor:pointer;max-width:180px;flex-shrink:1;min-width:0;}
.refresh-btn{background:none;border:1px solid var(--border2);color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
.refresh-btn.loading{opacity:0.5;pointer-events:none;}

/* MASTER BAR */
.master-bar{display:flex;align-items:stretch;border-bottom:1px solid var(--border);min-height:56px;}
.master-status{display:flex;align-items:center;gap:10px;padding:14px 20px;font-family:var(--display);font-size:18px;font-weight:700;flex-shrink:0;min-width:140px;background:var(--bg2);border-right:1px solid var(--border);}
.master-advice{display:flex;align-items:center;padding:14px 20px;font-size:13px;color:var(--text-dim);flex:1;line-height:1.5;}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* COUNTDOWN / NEXT DRIVE GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.countdown-card{grid-column:span 2;background:var(--bg2);padding:20px;display:flex;align-items:center;gap:20px;}
.countdown-number{font-family:var(--display);font-size:clamp(36px,8vw,56px);font-weight:800;line-height:1;color:var(--gold);flex-shrink:0;}
.countdown-detail{flex:1;}
.countdown-label{font-size:10px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;}
.countdown-trip{font-family:var(--display);font-size:clamp(16px,4vw,22px);font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.2;}
.trip-status-badge{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:20px;font-family:var(--mono);}
.drive-card{grid-column:span 2;background:var(--bg3);padding:16px 18px;border-top:2px solid var(--frost);}
.drive-route{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.drive-origin,.drive-dest{font-family:var(--display);font-size:clamp(14px,3.5vw,18px);font-weight:600;}
.drive-arrow{color:var(--frost);font-size:16px;flex-shrink:0;}
.drive-meta{display:flex;gap:16px;flex-wrap:wrap;}
.drive-stat{display:flex;flex-direction:column;gap:2px;}
.drive-stat-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.drive-stat-value{font-size:13px;color:var(--frost);font-weight:500;}
.card-label{font-size:9px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}

/* COLLAPSIBLE SECTIONS */
.section{border-bottom:1px solid var(--border);}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;background:var(--bg2);cursor:pointer;user-select:none;-webkit-user-select:none;}
.section-head:hover{background:var(--bg3);}
.section-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.section-title{font-size:11px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;font-weight:600;}
.section-meta{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.section-chevron{font-size:14px;color:var(--gold);transition:transform 0.2s;flex-shrink:0;margin-left:8px;}
.section-body{overflow:hidden;transition:max-height 0.25s ease;}
.section.collapsed .section-body{max-height:0!important;}
.section.collapsed .section-chevron{transform:rotate(-90deg);}

/* VEHICLE GRID */
.van-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);}
.van-card{background:var(--bg);padding:14px 16px;text-align:center;}
.van-card-icon{font-size:20px;margin-bottom:4px;display:block;}
.van-card-value{font-family:var(--display);font-size:clamp(14px,3.5vw,20px);font-weight:700;line-height:1;margin-bottom:3px;}
.van-card-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}

/* WEATHER */
.weather-list{}
.weather-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);}
.weather-row:last-child{border-bottom:none;}
.weather-row.today{background:#fdf8ee;}
.weather-date{font-size:12px;color:var(--text-dim);}
.weather-date strong{display:block;font-size:13px;color:var(--text);font-weight:600;}
.weather-middle{min-width:0;}
.weather-condition{font-size:13px;color:var(--text-dim);}
.weather-stats{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.weather-risk{font-size:12px;font-weight:600;text-align:right;}
.weather-nums{font-size:11px;color:var(--text-dim);text-align:right;}
.weather-loc-head{padding:7px 18px 4px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;letter-spacing:1px;color:var(--text-dim);font-weight:600;text-transform:uppercase;}

/* ITINERARY */
.itin-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;padding:12px 18px;border-bottom:1px solid var(--border);}
.itin-row:last-child{border-bottom:none;}
.itin-row.today{background:#fdf8ee;border-left:3px solid var(--gold);}
.itin-row.past{opacity:0.45;}
.itin-date{font-size:11px;color:var(--text-muted);padding-top:2px;line-height:1.4;}
.itin-date strong{display:block;font-size:13px;color:var(--text-dim);font-weight:600;}
.itin-location{font-size:15px;color:var(--text);font-weight:600;margin-bottom:3px;}
.itin-notes{font-size:12px;color:var(--text-dim);margin-top:1px;}
.itin-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:3px;align-self:start;font-weight:600;}
.type-DEPART  {background:#e8f5ee;color:var(--go);border:1px solid #b8dfc8;}
.type-DRIVE   {background:#e8f0f8;color:var(--frost);border:1px solid #b8cce8;}
.type-STOPOVER{background:#f8f0e0;color:var(--gold);border:1px solid #e0c890;}
.type-STAY    {background:#eeece8;color:var(--text-dim);border:1px solid var(--border2);}
.type-ARRIVE  {background:#f0e8f8;color:#7d3c98;border:1px solid #d8b8e8;}
.type-RETURN  {background:#fde8e8;color:var(--danger);border:1px solid #f0b8b8;}

/* LPG */
.refill-btn{background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.refill-btn:hover{border-color:var(--frost);background:var(--bg3);}

/* MISC */
.state-message{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.8;}
.state-message .icon{font-size:32px;display:block;margin-bottom:12px;}
.footer{padding:20px;text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:1px;border-top:1px solid var(--border);}
.last-updated{color:var(--text-muted);margin-top:4px;font-size:11px;}

/* RESPONSIVE */
@media(max-width:640px){
  .van-grid{grid-template-columns:repeat(2,1fr);}
  .grid{grid-template-columns:1fr;}
  .countdown-card,.drive-card{grid-column:span 1;}
  .master-status{min-width:110px;font-size:16px;}
  .header{padding:12px 14px 10px;}
  .weather-row{grid-template-columns:70px 1fr auto;}
}
@media(prefers-reduced-motion:reduce){
  .status-dot{animation:none;}
  .section-body,.section-chevron{transition:none;}
}
</style>
</head>
<body>

<header class="header">
  <div class="header-left">
    <div class="wordmark">Au<span>drey</span></div>
    <div class="header-tag">Mission Control</div>
  </div>
  <select class="trip-selector" id="tripSelector" onchange="loadTrip(this.value)">
    <option value="">Loading...</option>
  </select>
  <button class="refresh-btn" id="refreshBtn" onclick="refresh()">&#8635; Refresh</button>
</header>

<main id="main">
  <div class="state-message">
    <span class="icon">&#128656;</span>
    Connecting to Audrey...
  </div>
</main>

<footer class="footer">
  AUDREY &middot; 8M BAILEY AUTOGRAPH
  <div class="last-updated" id="lastUpdated"></div>
</footer>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbyrSj4d_ZA6IMnIfD5ZhT3DHY4_o0THKORntyf3C0rYsRwqRIuQTaTGQkqthQaJho8DHQ/exec';
var currentData=null,currentTrip=null;

// ── COLLAPSIBLE STATE ─────────────────────────────────────────
// Persisted in sessionStorage so state survives refresh but resets on new visit
var COLLAPSE_KEY='audrey_collapsed';
function getCollapsed(){
  try{return JSON.parse(sessionStorage.getItem(COLLAPSE_KEY)||'{}');}catch(e){return{};}
}
function setCollapsed(id,val){
  var s=getCollapsed();s[id]=val;
  try{sessionStorage.setItem(COLLAPSE_KEY,JSON.stringify(s));}catch(e){}
}
function toggleSection(id){
  var el=document.getElementById('sec-'+id);
  if(!el)return;
  var collapsed=el.classList.toggle('collapsed');
  setCollapsed(id,collapsed);
}
function applyCollapsed(){
  var s=getCollapsed();
  Object.keys(s).forEach(function(id){
    if(s[id]){
      var el=document.getElementById('sec-'+id);
      if(el)el.classList.add('collapsed');
    }
  });
  // Set max-height on all section bodies for smooth animation
  document.querySelectorAll('.section-body').forEach(function(b){
    if(!b.parentElement.classList.contains('collapsed')){
      b.style.maxHeight=b.scrollHeight+'px';
    }
  });
}

function makeSection(id,title,meta,rightHtml,bodyHtml){
  var chevron='<span class="section-chevron">&#8250;</span>';
  var metaSpan=meta?'<span class="section-meta">'+meta+'</span>':'';
  var right=rightHtml||'';
  return '<div class="section" id="sec-'+id+'">'
    +'<div class="section-head" onclick="toggleSection(\''+id+'\')">'
    +'<div class="section-left">'
    +'<span class="section-title">'+title+'</span>'
    +metaSpan
    +'</div>'
    +right
    +chevron
    +'</div>'
    +'<div class="section-body" style="max-height:4000px">'+bodyHtml+'</div>'
    +'</div>';
}

// ── FETCH ─────────────────────────────────────────────────────
async function fetchData(trip){
  var params=new URLSearchParams();
  if(trip)params.set('trip',trip);
  params.set('_',Date.now());
  var url=API_URL+'?'+params.toString();
  var r;
  try{r=await fetch(url,{redirect:'follow',headers:{'Accept':'application/json'}});}
  catch(e){r=await fetch(url,{mode:'cors',credentials:'omit',redirect:'follow'});}
  if(!r.ok)throw new Error('HTTP '+r.status);
  var text=await r.text();
  try{return JSON.parse(text);}catch(e){throw new Error('Invalid response from server');}
}

async function loadTrip(name){currentTrip=name||null;await refresh();}

async function refresh(){
  var btn=document.getElementById('refreshBtn');
  btn.classList.add('loading');btn.textContent='Loading...';
  try{
    var d=await fetchData(currentTrip);
    if(d.error)throw new Error(d.error);
    currentData=d;render(d);
  }catch(e){renderError(e.message);}
  finally{btn.classList.remove('loading');btn.textContent='\u21BB Refresh';}
}

function render(d){
  populateTripSelector(d.trips,d.meta.tripName);
  // Set budget collapsed by default BEFORE rendering
  var c=getCollapsed();
  if(!('budget' in c))setCollapsed('budget',true);
  document.getElementById('main').innerHTML=buildMain(d);
  var ts=new Date(d.timestamp);
  document.getElementById('lastUpdated').textContent=
    'Last updated '+ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  applyCollapsed();
}

function renderError(msg){
  document.getElementById('main').innerHTML=
    '<div class="state-message"><span class="icon">&#9888;</span>Could not reach Audrey.<br>'
    +'<span style="color:#555;font-size:11px">'+msg+'</span><br><br>Check your connection and try again.</div>';
}

function populateTripSelector(trips,active){
  var sel=document.getElementById('tripSelector');
  if(!trips||!trips.length)return;
  sel.innerHTML=trips.map(function(t){
    var label=t.name+(t.status==='ACTIVE'?' &#9679;':t.status==='UPCOMING'?' &#9675;':'');
    return '<option value="'+t.name+'"'+(t.name===active?' selected':'')+'>'+label+'</option>';
  }).join('');
}

// ── MAIN BUILDER ──────────────────────────────────────────────
function buildMain(d){
  var fc=d.fuelConfig||{pricePerLitre:1.182,mpg:27};
  var parts=[];
  parts.push(buildMasterBar(d.master,d.vehicle));
  parts.push(buildCountdown(d.meta,d.meta&&d.meta.nextDrive?buildNextDrive(d.meta,fc):''));
  parts.push(buildVehicleSection(d.vehicle));
  if(d.lpg&&d.lpg.current)parts.push(buildLpgSection(d.lpg));
  if(d.fuelConfig)parts.push(buildPricesSection(d.fuelConfig));
  if(d.weather&&d.weather.length)parts.push(buildWeatherSection(d.weather));
  if(d.snowStatus&&d.meta&&d.meta.season==='winter')parts.push(buildSnowSection(d.snowStatus,d.meta,d.itinerary));
  if(d.budget)parts.push(buildBudgetSection(d.budget));
  if(d.itinerary&&d.itinerary.length)parts.push(buildItinerarySection(d.itinerary,fc));
  return parts.join('');
}

// ── MASTER BAR ────────────────────────────────────────────────
function buildMasterBar(master,vehicle){
  if(!master)return'';
  var c=master.color||'#888';
  var alert=vehicle&&vehicle.systemAlert&&!vehicle.systemAlert.includes('VAN SYSTEMS OK')?vehicle.systemAlert:'';
  return'<div class="master-bar">'
    +'<div class="master-status" style="color:'+c+'">'
    +'<span class="status-dot" style="background:'+c+'"></span>'+master.status
    +'</div>'
    +'<div class="master-advice">'+(alert?'<span style="color:'+c+';margin-right:8px">'+alert+'</span>':master.advice)+'</div>'
    +'</div>';
}

// ── COUNTDOWN + NEXT DRIVE ────────────────────────────────────
function buildCountdown(meta,driveHtml){
  if(!meta)return'';
  var number='&mdash;',label='Trip status',badgeClass='',badgeText='';
  if(meta.tripStatus==='PRE_TRIP'&&meta.daysToDepart!==null){
    number=meta.daysToDepart;label='Days to departure';badgeClass='type-DRIVE';badgeText='Upcoming';
  }else if(meta.tripStatus==='ACTIVE'){
    number=meta.daysIntoTrip!==null?meta.daysIntoTrip:'&#9679;';
    label=meta.daysIntoTrip!==null?'Days into trip':'Active trip';
    badgeClass='type-DEPART';badgeText='On the road';
  }else if(meta.tripStatus==='POST_TRIP'){
    number='&#10003;';label='Trip complete';badgeClass='type-RETURN';badgeText='Returned';
  }
  var dateRange=(meta.departDate&&meta.returnDate)
    ?fmtDate(meta.departDate)+' &mdash; '+fmtDate(meta.returnDate)
    :meta.departDate?'From '+fmtDate(meta.departDate):'';
  var countdown='<div class="grid"><div class="countdown-card">'
    +'<div class="countdown-number">'+number+'</div>'
    +'<div class="countdown-detail">'
    +'<div class="countdown-label">'+label+'</div>'
    +'<div class="countdown-trip">'+(meta.tripName||'')+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +(badgeText?'<span class="trip-status-badge '+badgeClass+'">'+badgeText+'</span>':'')
    +(dateRange?'<span style="font-size:10px;color:var(--text-muted)">'+dateRange+'</span>':'')
    +'</div></div></div>'
    +driveHtml
    +'</div>';
  return countdown;
}

function buildNextDrive(meta,fc){
  var nd=meta.nextDrive;if(!nd)return'';
  var fuel=calcFuel(nd.distanceKm,fc);
  return'<div class="drive-card">'
    +'<div class="card-label" style="color:var(--frost);margin-bottom:10px">Next drive &middot; '+fmtDate(nd.date)+'</div>'
    +'<div class="drive-route">'
    +'<span class="drive-origin" style="color:var(--text-dim)">'+(meta.currentLocation||'&mdash;')+'</span>'
    +'<span class="drive-arrow">&rarr;</span>'
    +'<span class="drive-dest">'+nd.destination+'</span>'
    +'</div>'
    +'<div class="drive-meta">'
    +'<div class="drive-stat"><span class="drive-stat-label">Distance</span><span class="drive-stat-value">'+(nd.distanceKm?nd.distanceKm+' km':'&mdash;')+'</span></div>'
    +'<div class="drive-stat"><span class="drive-stat-label">Drive time</span><span class="drive-stat-value">'+(nd.durationMin?fmtDuration(nd.durationMin):'&mdash;')+'</span></div>'
    +(fuel?'<div class="drive-stat"><span class="drive-stat-label">Fuel est</span><span class="drive-stat-value">~'+fuel.litres+'L &middot; &pound;'+fuel.cost+'</span></div>':'')
    +(nd.notes?'<div class="drive-stat"><span class="drive-stat-label">Notes</span><span class="drive-stat-value" style="color:var(--text-dim)">'+nd.notes+'</span></div>':'')
    +'</div></div>';
}

// ── VEHICLE ───────────────────────────────────────────────────
function buildVehicleSection(v){
  if(!v)return'';
  var bc=v.batteryV?(v.batteryV>=13?'var(--go)':v.batteryV>=12.4?'var(--caution)':'var(--danger)'):'var(--text-dim)';
  var gc=v.garageTempC!==null?(v.garageTempC<=2?'var(--danger)':v.garageTempC<=5?'var(--frost)':'var(--text)'):'var(--text-dim)';
  var cc=v.cabinTempC!==null?(v.cabinTempC<15?'var(--frost)':v.cabinTempC>26?'var(--caution)':'var(--go)'):'var(--text-dim)';
  var oc=v.odometerMiles?'var(--text)':'var(--text-dim)';
  var locationLink='';
  if(v.lat&&v.lon){
    var mapsUrl='https://maps.apple.com/?ll='+v.lat+','+v.lon+'&q=Audrey';
    var staleStr='';
    if(v.locationTimestamp){
      var mins=Math.round((Date.now()-new Date(v.locationTimestamp).getTime())/60000);
      var hrs=Math.floor(mins/60);
      staleStr=hrs>0?' ('+hrs+'h ago)':mins>1?' ('+mins+'m ago)':'';
    }
    locationLink='<a href="'+mapsUrl+'" target="_blank" style="font-size:11px;color:var(--frost);text-decoration:none" onclick="event.stopPropagation()">&#128205; Current location'+staleStr+'</a>';
  }
  var statusMeta=locationLink;
  var body='<div class="van-grid">'
    +'<div class="van-card"><span class="van-card-icon">&#128267;</span>'
    +'<div class="van-card-value" style="color:'+bc+'">'+(v.batteryV!==null?v.batteryV+'V':'&mdash;')+'</div>'
    +'<div class="van-card-label">Battery</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#127968;</span>'
    +'<div class="van-card-value" style="color:'+cc+'">'+(v.cabinTempC!==null?v.cabinTempC+'&deg;':'&mdash;')+'</div>'
    +'<div class="van-card-label">Cabin</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#128656;</span>'
    +'<div class="van-card-value" style="color:'+gc+'">'+(v.garageTempC!==null?v.garageTempC+'&deg;':'&mdash;')+'</div>'
    +'<div class="van-card-label">Garage</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#128739;</span>'
    +'<div class="van-card-value" style="color:'+oc+';font-size:clamp(12px,3vw,17px)">'+(v.odometerMiles?v.odometerMiles.toLocaleString()+' mi':'&mdash;')+'</div>'
    +'<div class="van-card-label">Odometer</div></div>'
    +'</div>';
  return makeSection('vehicle','Vehicle &middot; Audrey','',statusMeta,body);
}

// ── LPG ───────────────────────────────────────────────────────
function buildLpgSection(lpg){
  if(!lpg||!lpg.current)return'';
  var c=lpg.current;
  var pct=Math.min(100,Math.round((c.litres/12)*100));
  var barColor=c.alert==='CRITICAL'?'var(--danger)':c.alert==='LOW'?'var(--caution)':'var(--go)';
  var totals=lpg.totalLitres?lpg.totalLitres.toFixed(1)+'L trip total':'';
  var refillBtn='<button class="refill-btn" id="refillBtn" onclick="event.stopPropagation();lpgRefill()">&#9981; Refill</button>';
  var metaRight='<div style="display:flex;align-items:center;gap:10px">'
    +'<span style="font-size:12px;color:var(--text-muted)">'+totals+'</span>'
    +refillBtn+'</div>';
  var body='<div style="padding:16px 18px">'
    +'<div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">'
    +'<div style="font-family:var(--display);font-size:clamp(24px,6vw,36px);font-weight:700;color:'+barColor+'">'+c.litres.toFixed(1)+'L</div>'
    +'<div>'
    +'<div style="font-size:13px;color:var(--text);font-weight:500">'+c.statusMsg+'</div>'
    +'<div style="font-size:12px;color:var(--text-dim)">'+c.heatSource+'</div>'
    +'</div></div>'
    +'<div style="background:var(--bg3);border-radius:4px;height:8px;overflow:hidden">'
    +'<div style="height:100%;width:'+pct+'%;background:'+barColor+';border-radius:4px"></div>'
    +'</div>'
    +'<div style="display:flex;justify-content:space-between;margin-top:4px">'
    +'<span style="font-size:10px;color:var(--text-muted)">0L</span>'
    +'<span style="font-size:10px;color:var(--text-muted)">'+pct+'% &middot; 12L tank</span>'
    +'</div></div>';
  return makeSection('lpg','LPG &middot; Heating','',metaRight,body);
}

// ── WEATHER ───────────────────────────────────────────────────
function buildWeatherSection(weather){
  if(!weather||!weather.length)return'';

  // Limit display to today + 3 days
  var now=new Date();now.setHours(0,0,0,0);
  var cutoff=new Date(now.getTime()+3*86400000);
  weather=weather.filter(function(w){
    var d=new Date(w.date+'T00:00:00');
    return d<=cutoff;
  });
  if(!weather.length)return'';

  // Group by location preserving first-appearance order
  var groups={},order=[];
  weather.forEach(function(w){
    if(!groups[w.location]){groups[w.location]=[];order.push(w.location);}
    groups[w.location].push(w);
  });
  var now=new Date();now.setHours(0,0,0,0);
  var tom=new Date(now.getTime()+86400000);
  var dat=new Date(now.getTime()+2*86400000);
  function dayLabel(ds){
    var d=new Date(ds+'T00:00:00');d.setHours(0,0,0,0);
    if(d.getTime()===now.getTime())return'Today';
    if(d.getTime()===tom.getTime())return'Tomorrow';
    if(d.getTime()===dat.getTime())return d.toLocaleDateString('en-GB',{weekday:'long'});
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  }
  var body='<div class="weather-list">';
  order.forEach(function(loc){
    var rows=groups[loc];
    body+='<div class="weather-loc-head">'+loc+'</div>';
    rows.forEach(function(w){
      var rc=riskColor(w.risk);
      body+='<div class="weather-row'+(w.isToday?' today':'')+'">'
        +'<div class="weather-date"><strong>'+dayLabel(w.date)+'</strong></div>'
        +'<div class="weather-middle"><div class="weather-condition">'+w.condition+'</div></div>'
        +'<div class="weather-stats">'
        +'<div class="weather-risk" style="color:'+rc+'">'+w.risk+'</div>'
        +'<div class="weather-nums">'
        +(w.minTempC!==null?w.minTempC+'&deg;':'')
+(w.maxTempC!==null?' &mdash; '+w.maxTempC+'&deg; &middot; ':' &middot; ')
+(w.gustKmh?w.gustKmh+' km/h':'')
+(w.windDir?' '+w.windDir.replace(/\s*\(\d+°\)/,''):'')
        +(w.snowMm&&w.snowMm>0?' &middot; '+w.snowMm+'mm':'')
        +'</div></div></div>';
    });
  });
  body+='</div>';
  return makeSection('weather','Weather','Today + 3 days','',body);
}

// ── ITINERARY ─────────────────────────────────────────────────
function buildItinerarySection(itin,fc){
  var rows=itin.map(function(r){
    var d=new Date(r.date+'T00:00:00');
    var day=d.toLocaleDateString('en-GB',{weekday:'short'});
    var dt=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    var cls=r.isToday?' today':r.isPast?' past':'';
    var fuel=['DRIVE','DEPART','STOPOVER','ARRIVE','RETURN'].indexOf(r.type)>=0?calcFuel(r.distanceKm,fc):null;
    var fuelStr=fuel?' &middot; ~'+fuel.litres+'L/&pound;'+fuel.cost:'';
    var meta=[
      r.distanceKm?r.distanceKm+' km':'',
      r.durationMin?fmtDuration(r.durationMin):'',
      r.notes
    ].filter(Boolean).join(' &middot; ')+fuelStr;
    var mapsUrl=r.address
      ?'https://maps.apple.com/?address='+encodeURIComponent(r.address)
      :'https://maps.apple.com/?q='+encodeURIComponent(r.location);
    var ehuIcon=r.ehu?' <span style="font-size:11px;color:var(--frost)">&#128268;</span>':'';
    var riskHtml=(r.routeRisk&&r.routeRisk.snowRisk&&r.type!=='STAY')
      ?'<div style="font-size:11px;margin-top:3px;color:'+riskColor(r.routeRisk.snowRisk)+';font-weight:500">'+r.routeRisk.snowRisk+'</div>'
      :'';
    var contactHtml='';
    if(r.contact||r.bookingRef){
      var cp=[];
      if(r.contact)cp.push('<a href="tel:'+r.contact.replace(/[^0-9+]/g,'')+'" style="color:var(--frost);text-decoration:none">&#128222; '+r.contact+'</a>');
      if(r.bookingRef)cp.push('<span style="color:var(--text-muted)">REF: '+r.bookingRef+'</span>');
      contactHtml='<div style="font-size:11px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">'+cp.join('')+'</div>';
    }
    return'<div class="itin-row'+cls+'">'
      +'<div class="itin-date"><strong>'+(r.isToday?'Today':day)+'</strong>'+dt+'</div>'
      +'<div>'
      +'<div class="itin-location">'+r.location+ehuIcon+'</div>'
      +(meta?'<div class="itin-notes">'+meta+'</div>':'')
      +contactHtml
      +riskHtml
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
      +'<span class="itin-badge type-'+r.type+'">'+r.type+'</span>'
      +(r.type!=='STAY'?'<a href="'+mapsUrl+'" target="_blank" style="font-size:10px;color:var(--frost);text-decoration:none">&#128205; Maps</a>':'')
      +'</div></div>';
  }).join('');
  return makeSection('itinerary','Itinerary',itin.length+' days','','<div>'+rows+'</div>');
}

// ── UTILITIES ─────────────────────────────────────────────────
function calcFuel(distanceKm,fc){
  if(!distanceKm||!fc)return null;
  var miles=distanceKm/1.60934;
  var litres=miles/fc.mpg*4.54609;
  var cost=litres*fc.pricePerLitre;
  return{litres:Math.round(litres),cost:cost.toFixed(0)};
}
function fmtDate(iso){
  if(!iso)return'';
  return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}
function fmtDuration(mins){
  var h=Math.floor(mins/60),m=mins%60;
  return h>0?h+'h'+(m>0?' '+m+'m':''):m+'m';
}
function riskColor(risk){
  if(!risk)return'var(--text-dim)';
  if(risk.indexOf('DANGER')>=0||risk.indexOf('ICE')>=0||risk.indexOf('EXTREME')>=0)return'var(--danger)';
  if(risk.indexOf('CAUTION')>=0||risk.indexOf('WIND')>=0||risk.indexOf('High')>=0||risk.indexOf('Moderate')>=0)return'var(--caution)';
  if(risk.indexOf('Clear')>=0||risk.indexOf('OK')>=0)return'var(--go)';
  return'var(--text-dim)';
}

// ── LPG REFILL ────────────────────────────────────────────────
async function lpgRefill(){
  var btn=document.getElementById('refillBtn');
  if(!btn)return;
  btn.textContent='Logging...';btn.style.opacity='0.5';
  try{
    var params=new URLSearchParams();
    params.set('action','lpg_refill');
    if(currentTrip)params.set('trip',currentTrip);
    params.set('_',Date.now());
    var r=await fetch(API_URL+'?'+params.toString(),{redirect:'follow',headers:{'Accept':'application/json'}});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    btn.textContent='&#10003; Refilled';btn.style.color='var(--go)';btn.style.opacity='1';
    setTimeout(function(){refresh();},1500);
  }catch(e){
    btn.textContent='Error';btn.style.color='var(--danger)';btn.style.opacity='1';
    setTimeout(function(){btn.textContent='&#9981; Refill';btn.style.color='var(--frost)';},3000);
  }
}

// ── ADD to index.html before refresh() ────────────────────────

function buildSnowSection(snow, meta, itin) {
  if (!snow || !snow.resorts || !snow.resorts.length) return '';
  if (meta.season !== 'winter') return '';

  var todayRow  = itin ? itin.find(function(r){ return r.isToday; }) : null;
  var todayType = todayRow ? todayRow.type : null;
  var isDrive   = todayType && ['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(todayType) >= 0;

  // Section meta
  var summaryParts = [];
  if (snow.hasPowder)   summaryParts.push('❄️ Powder');
  if (snow.hasBluebird) summaryParts.push('☀️ Bluebird');
  if (snow.passBlocked) summaryParts.push('🚫 Pass closed');
  var sectionMeta = summaryParts.join(' · ') || snow.resorts.length + ' resorts';

  // Pass status block
  var passHtml = '';
  if (snow.passes && snow.passes.length) {
    passHtml = '<div style="padding:10px 18px;border-bottom:1px solid var(--border);background:var(--bg2)">'
      + '<div style="font-size:10px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px">Pass Status</div>'
      + '<div style="display:flex;flex-wrap:wrap;gap:8px">'
      + snow.passes.map(function(p){
          var c = p.status.includes('Open') ? 'var(--go)'
                : p.status.includes('Closed') ? 'var(--danger)'
                : 'var(--caution)';
          return '<span style="font-size:12px;color:var(--text-dim)">'
            + p.name + ' <strong style="color:' + c + '">' + p.status + '</strong></span>';
        }).join(' &middot; ')
      + '</div></div>';
  }

  // Drive day road risk banner
  var roadRiskHtml = '';
  if (isDrive && snow.resorts.length) {
    var r0 = snow.resorts[0];
    roadRiskHtml = r0.snowAtVanLevel
      ? '<div style="padding:10px 18px;background:#fdf8ee;border-bottom:1px solid var(--border);font-size:12px;color:var(--caution);font-weight:600">⚠️ Snow possible at van level — freeze level ' + r0.freezeM + 'm</div>'
      : '<div style="padding:10px 18px;background:#f0f8f0;border-bottom:1px solid var(--border);font-size:12px;color:var(--go)">✅ Freeze level above route — rain not snow at van level</div>';
  }

  // Resort cards
  var resortsHtml = snow.resorts.map(function(r) {
    var snowColor = r.snowCm >= 10 ? 'var(--frost)'
                  : r.snowCm >= 3  ? 'var(--go)'
                  : 'var(--text-muted)';
    var windColor = r.windKmh > 50 ? 'var(--danger)'
                  : r.windKmh > 30 ? 'var(--caution)'
                  : 'var(--go)';
    var fitColor  = r.fitment.includes('Chains') ? 'var(--danger)'
                  : r.fitment.includes('3PMSF')  ? 'var(--caution)'
                  : 'var(--go)';

    var badges = '';
    if (r.isPowder)   badges += ' <span style="font-size:10px;background:#e8f0f8;color:var(--frost);padding:2px 6px;border-radius:3px">❄️ Powder</span>';
    if (r.isBluebird) badges += ' <span style="font-size:10px;background:#fdf8ee;color:var(--gold);padding:2px 6px;border-radius:3px">☀️ Bluebird</span>';

    // Format freeze level as metres not km
    var freezeStr = r.freezeM ? Math.round(r.freezeM).toLocaleString() + 'm' : '—';

    return '<div style="padding:12px 18px;border-bottom:1px solid var(--border)">'
      // Header row — name · elevation · badges
      + '<div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:10px">'
      + '<span style="font-family:var(--display);font-size:14px;font-weight:700;color:var(--text)">' + r.name + '</span>'
      + '<span style="font-size:11px;color:var(--text-muted);background:var(--bg3);padding:2px 6px;border-radius:3px">' + r.elevationM.toLocaleString() + 'm</span>'
      + badges
      + '</div>'
      // Stats row
      + '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:8px">'
      + '<div><div style="font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:2px">3-Day Snow</div>'
      + '<div style="font-size:18px;font-weight:700;color:' + snowColor + '">' + r.snowCm + 'cm</div></div>'
      + '<div><div style="font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:2px">Freeze Level</div>'
      + '<div style="font-size:18px;font-weight:700;color:var(--frost)">' + freezeStr + '</div></div>'
      + '<div><div style="font-size:9px;letter-spacing:1px;color:var(--text-muted);text-transform:uppercase;margin-bottom:2px">Wind</div>'
      + '<div style="font-size:18px;font-weight:700;color:' + windColor + '">' + r.windKmh + ' km/h</div></div>'
      + '</div>'
      // Bottom row — condition | fitment | trend
      + '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;font-size:12px">'
      + '<span style="color:var(--text-dim)">' + r.condition + '</span>'
      + '<div style="display:flex;gap:8px;align-items:center">'
      + '<span style="color:' + fitColor + ';font-weight:600">' + r.fitment + '</span>'
      + (r.trend ? '<span style="color:var(--text-muted)">' + r.trend + '</span>' : '')
      + '</div></div>'
      + '</div>';
  }).join('');

  var body = roadRiskHtml + passHtml + resortsHtml;
  return makeSection('snow', 'Snow &middot; Conditions', sectionMeta, '', body);
}

function buildBudgetSection(budget) {
  if (!budget) return '';

  var total    = budget.estimateTotal;
  var actual   = budget.actualTotal;
  var hasActual = Object.values(budget.manual).some(function(m){ return m.actual !== null; });
  var rateNote = budget.rate ? '1€ = £' + budget.rate.toFixed(4) : '';

  // Section meta — headline figure
  var sectionMeta = hasActual
    ? 'Est £' + total.toLocaleString() + ' · Act £' + actual.toLocaleString()
    : 'Est £' + total.toLocaleString();

  // Table helper
  function row(label, est, act, notes, isEur) {
    var actStr = act !== null ? '£' + Math.round(act).toLocaleString() : '—';
    var estStr = '£' + Math.round(est).toLocaleString();
    var origStr = isEur && est ? ' <span style="font-size:10px;color:var(--text-muted)">(' + Math.round(est / (budget.rate||0.85)) + '€)</span>' : '';
    return '<tr style="border-bottom:1px solid var(--border)">'
      + '<td style="padding:6px 0;color:var(--text-dim);font-size:13px">' + label
      + (notes ? '<div style="font-size:10px;color:var(--text-muted)">' + notes + '</div>' : '')
      + '</td>'
      + '<td style="padding:6px 0;text-align:right;font-size:13px;color:var(--text)">' + estStr + origStr + '</td>'
      + '<td style="padding:6px 0;text-align:right;font-size:13px;color:'
      + (act !== null ? 'var(--go)' : 'var(--text-muted)') + '">' + actStr + '</td>'
      + '</tr>';
  }

  var body = '<div style="padding:0 18px 12px">'
    // Column headers
    + '<table style="width:100%;border-collapse:collapse;margin-top:12px">'
    + '<thead><tr>'
    + '<th style="text-align:left;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Category</th>'
    + '<th style="text-align:right;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Estimate</th>'
    + '<th style="text-align:right;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Actual</th>'
    + '</tr></thead><tbody>';

  // Auto-calculated rows
  if (budget.auto) {
    if (budget.auto.fuel)      body += row('Fuel',      budget.auto.fuel.estimate,      null, '', false);
    if (budget.auto.lpg)       body += row('LPG',       budget.auto.lpg.estimate,       null, '', false);
    if (budget.auto.campsites) body += row('Campsites', budget.auto.campsites.estimate, null, '', false);
  }

  // Manual rows from trip sheet budget block
  Object.keys(budget.manual).forEach(function(label) {
    var m = budget.manual[label];
    body += row(label, m.estimate, m.actual, m.notes, m.isEur);
  });

  // Total row
  body += '<tr>'
    + '<td style="padding:10px 0 4px;font-weight:700;font-family:var(--display);font-size:14px">Total</td>'
    + '<td style="padding:10px 0 4px;text-align:right;font-weight:700;font-family:var(--display);font-size:14px;color:var(--gold)">£' + total.toLocaleString() + '</td>'
    + '<td style="padding:10px 0 4px;text-align:right;font-weight:700;font-family:var(--display);font-size:14px;color:'
    + (hasActual ? 'var(--go)' : 'var(--text-muted)') + '">'
    + (hasActual ? '£' + actual.toLocaleString() : '—') + '</td>'
    + '</tr>'
    + '</tbody></table>'
    + (rateNote ? '<div style="font-size:10px;color:var(--text-muted);margin-top:6px">' + rateNote + '</div>' : '')
    + '</div>';

  // Collapsed by default — pass 'true' as 5th arg to makeSection
  var section = makeSection('budget', 'Budget', sectionMeta, '', body);
  return section;
}

function buildPricesSection(fc){

    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">'
    +'<div>'
    +'<div style="font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px">Diesel</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="font-family:var(--display);font-size:20px;font-weight:700">&pound;'+( fc.pricePerLitre?fc.pricePerLitre.toFixed(2):'—')+'</span>'
    +'<span style="font-size:11px;color:var(--text-muted)">/L</span>'
    +'<button onclick="event.stopPropagation();editPrice(\'diesel\',\''+( fc.pricePerLitre||1.182)+'\')" style="background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;cursor:pointer">Edit</button>'
    +'</div></div>'
    +'<div>'
    +'<div style="font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;margin-bottom:6px">LPG</div>'
    +'<div style="display:flex;align-items:center;gap:8px">'
    +'<span style="font-family:var(--display);font-size:20px;font-weight:700">&pound;'+(fc.lpgPrice?fc.lpgPrice.toFixed(2):'—')+'</span>'
    +'<span style="font-size:11px;color:var(--text-muted)">/L</span>'
    +'<button onclick="event.stopPropagation();editPrice(\'lpg\',\''+(fc.lpgPrice||0.95)+'\')" style="background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;cursor:pointer">Edit</button>'
    +'</div></div>'

  return makeSection('prices','Prices &middot; Settings','','',body);

async function editPrice(type,current){
  var newVal=prompt((type==='diesel'?'Diesel':'LPG')+' price per litre (\u00a3):',current);
  if(!newVal||isNaN(parseFloat(newVal)))return;
  try{
    var params=new URLSearchParams();
    params.set('action','update_price');
    params.set('type',type);
    params.set('value',parseFloat(newVal));
    params.set('_',Date.now());
    var r=await fetch(API_URL+'?'+params.toString(),{redirect:'follow',headers:{'Accept':'application/json'}});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    setTimeout(function(){refresh();},500);
  }catch(e){
    alert('Failed to update: '+e.message);
  }
}
