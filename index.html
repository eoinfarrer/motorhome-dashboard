<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#171918">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Audrey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f0;--bg2:#eceae4;--bg3:#e4e2db;
  --border:#d4d0c8;--border2:#c8c4ba;
  --text:#1a1a18;--text-dim:#555;--text-muted:#999;
  --go:#1a8a4a;--caution:#c07800;--danger:#c0392b;
  --frost:#2471a3;--gold:#9a7040;
  --mono:'DM Mono',monospace;--display:'Syne',sans-serif;--ui:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --safe-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
/* Match Safari safe areas and overscroll to the Audrey shell on every screen. */
html{background:#171918;}
body{background:#171918;color:var(--text);font-family:var(--mono);font-size:15px;line-height:1.5;min-height:100vh;padding-top:var(--safe-top);-webkit-font-smoothing:antialiased;}

/* ── AUDREY 2.0 APP SHELL ────────────────────────────────────
   The existing feature builders remain below. The shell only decides which
   composed view is visible, allowing the app to grow without new page loads. */
.app-shell{min-height:calc(100vh - var(--safe-top));}
.app-main{min-height:calc(100vh - 74px);padding-bottom:calc(78px + env(safe-area-inset-bottom,0px));}
.app-main[data-active-view="home"]{background:#1b1d1a;}
.app-view{display:none;animation:view-in .18s ease-out;}
.app-view.is-active{display:block;}
@keyframes view-in{from{opacity:.65;transform:translateY(3px)}to{opacity:1;transform:none}}
.primary-nav{position:fixed;left:0;right:0;bottom:0;z-index:150;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 8px calc(7px + env(safe-area-inset-bottom,0px));background:rgba(18,20,18,.94);border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -8px 24px rgba(20,20,18,.22);backdrop-filter:blur(18px);}
.primary-nav-btn{appearance:none;border:0;background:transparent;color:#a9aaa3;min-height:52px;padding:5px 2px;border-radius:7px;font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;}
.primary-nav-btn::before{display:block;margin-bottom:3px;font-size:16px;line-height:1;}
.primary-nav-btn[data-view="home"]::before{content:'⌂';}
.primary-nav-btn[data-view="journey"]::before{content:'↗';}
.primary-nav-btn[data-view="do"]::before{content:'◌';}
.primary-nav-btn[data-view="van"]::before{content:'▣';}
.primary-nav-btn[data-view="more"]::before{content:'•••';letter-spacing:-1px;}
.primary-nav-btn.is-active{background:rgba(255,255,255,.1);color:#f7f5ee;}
/* ── AUDREY 2.0 HOME ─────────────────────────────────────────
   Home is a context-aware briefing. Detailed feature builders stay in their
   dedicated views, so this surface can stay calm and decision-focused. */
.home-experience{--home-scene-image:none;--home-scene-position:center;--home-scene-position-tablet:center;--home-scene-position-wide:center;--home-scene-glow:rgba(178,143,88,.18);--home-scene-horizon:rgba(86,112,102,.16);--home-scene-base:#1b1e1b;--home-glass-primary:rgba(23,27,25,.78);--home-glass-secondary:rgba(31,35,32,.68);--home-glass-inset:rgba(255,255,255,.075);--home-glass-border:rgba(255,255,255,.1);--home-glass-text:#f4f3ed;--home-glass-muted:#b7b9b0;--home-glass-shadow:0 12px 28px rgba(0,0,0,.22);min-height:calc(100vh - 74px);padding:14px;background-image:linear-gradient(180deg,rgba(11,13,12,.1),rgba(11,13,12,.56)),var(--home-scene-image),radial-gradient(ellipse 85% 55% at 15% -10%,var(--home-scene-glow),transparent 70%),radial-gradient(ellipse 60% 45% at 100% 25%,var(--home-scene-horizon),transparent 72%),linear-gradient(155deg,#171917 0%,#252720 52%,var(--home-scene-base) 100%);background-size:cover,cover,auto,auto,cover;background-position:center,var(--home-scene-position),center,center,center;}
.home-experience[data-scene="home"]{--home-scene-glow:rgba(187,151,91,.2);--home-scene-horizon:rgba(92,119,99,.13);}
.home-experience[data-scene="mountains"]{--home-scene-glow:rgba(151,177,185,.18);--home-scene-horizon:rgba(77,111,103,.22);--home-scene-base:#18201f;}
.home-experience[data-scene="alpine"]{--home-scene-glow:rgba(185,205,220,.22);--home-scene-horizon:rgba(80,124,139,.2);--home-scene-base:#172023;}
.home-experience[data-scene="coast"]{--home-scene-glow:rgba(122,171,188,.2);--home-scene-horizon:rgba(38,101,120,.24);--home-scene-base:#152126;}
.home-experience[data-scene="highlands"]{--home-scene-glow:rgba(166,149,98,.18);--home-scene-horizon:rgba(85,118,86,.23);--home-scene-base:#1c211a;}
.home-experience[data-scene="travelling"]{--home-scene-glow:rgba(159,191,194,.17);--home-scene-horizon:rgba(84,117,98,.2);--home-scene-base:#18221f;}
.home-experience[data-scene-time="evening"]{--home-scene-glow:rgba(196,128,73,.23);--home-scene-horizon:rgba(86,69,89,.16);}
.home-experience[data-scene-time="night"]{--home-scene-glow:rgba(84,105,135,.16);--home-scene-horizon:rgba(32,56,68,.18);--home-scene-base:#111513;}
.home-canvas{width:min(100%,1120px);margin:0 auto;}
.home-hero{position:relative;overflow:hidden;padding:27px 22px 25px;border-radius:22px;color:#f8f6ef;background:linear-gradient(118deg,rgba(44,47,40,.96),rgba(35,37,32,.82));box-shadow:0 18px 38px rgba(0,0,0,.2);backdrop-filter:blur(14px);}
.home-hero::after{content:'';position:absolute;width:230px;height:230px;right:-102px;top:-140px;border:1px solid rgba(220,191,135,.18);border-radius:50%;box-shadow:0 0 0 32px rgba(220,191,135,.04),0 0 0 70px rgba(220,191,135,.025);pointer-events:none;}
.home-hero.home-tone-attention{background:linear-gradient(135deg,#382824,#27231f);}
.home-hero.home-tone-drive{background:linear-gradient(135deg,#172a32,#29312b);}
.home-eyebrow{position:relative;z-index:1;margin-bottom:8px;color:#cbb88f;font-size:9px;font-weight:500;letter-spacing:2.3px;text-transform:uppercase;}
.home-trip-name{position:relative;z-index:1;max-width:88%;font-family:var(--ui);font-size:clamp(24px,5.8vw,32px);font-weight:700;letter-spacing:-.7px;line-height:1.12;}
.home-state-line{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin:13px 0 9px;font-family:var(--ui);font-size:13px;font-weight:500;color:#deddd4;}
.home-state-dot{width:7px;height:7px;border-radius:50%;background:#77b78b;box-shadow:0 0 0 4px rgba(119,183,139,.12);}
.home-tone-attention .home-state-dot{background:#e59980;box-shadow:0 0 0 4px rgba(229,153,128,.12);}
.home-tone-drive .home-state-dot{background:#8bc6d6;box-shadow:0 0 0 4px rgba(139,198,214,.12);}
.home-message{position:relative;z-index:1;max-width:440px;color:#f7f5ee;font-family:var(--ui);font-size:15px;font-weight:500;line-height:1.45;}
.home-hero-meta{position:relative;z-index:1;margin-top:16px;color:#bdbdb3;font-size:10px;}
.home-stack{display:grid;gap:12px;margin-top:14px;}
.home-attention{padding:15px 16px;border:1px solid rgba(224,120,99,.23);border-radius:14px;background:rgba(58,35,31,.8);box-shadow:var(--home-glass-shadow);backdrop-filter:blur(12px);}
.home-attention-label{color:var(--danger);font-size:9px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;}
.home-attention-copy{margin-top:5px;color:#f5dfd8;font-family:var(--ui);font-size:14px;font-weight:650;line-height:1.4;}
/* Reusable Home glass system: primary panel, secondary panel, inset metrics. */
.home-decision,.home-vehicle-surface{padding:18px;border:1px solid var(--home-glass-border);border-radius:16px;background:var(--home-glass-primary);box-shadow:var(--home-glass-shadow);backdrop-filter:blur(12px);}
.home-opportunity,.home-condition{border:1px solid var(--home-glass-border);background:var(--home-glass-secondary);box-shadow:var(--home-glass-shadow);backdrop-filter:blur(12px);}
.home-decision-kicker,.home-section-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--home-glass-muted);}
.home-drive-route{display:flex;align-items:center;gap:9px;margin:8px 0 14px;color:var(--home-glass-text);font-family:var(--ui);font-size:clamp(19px,4.8vw,25px);font-weight:700;letter-spacing:-.45px;line-height:1.18;}
.home-drive-route span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.home-drive-arrow{flex:0 0 auto;color:#8ec4d5;}
.home-drive-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.home-drive-stat{padding:10px 11px;border:1px solid rgba(255,255,255,.05);border-radius:10px;background:var(--home-glass-inset);}
.home-drive-stat-label{font-size:8px;letter-spacing:1.4px;text-transform:uppercase;color:var(--home-glass-muted);}
.home-drive-stat-value{margin-top:3px;font-family:var(--ui);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--home-glass-text);}
.home-risk-row{display:flex;align-items:flex-start;gap:9px;margin-top:13px;padding-top:13px;border-top:1px solid rgba(255,255,255,.11);}
.home-risk-badge{flex:0 0 auto;padding:3px 7px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:1px;}
.home-risk-go{background:#e4f3e8;color:#187444;}.home-risk-caution{background:#fff0d9;color:#9b6000;}.home-risk-danger{background:#fbe5df;color:#ac3329;}
.home-risk-copy{font-size:11px;line-height:1.45;color:var(--home-glass-muted);}
.home-conditions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.home-condition{min-width:0;padding:13px;border-radius:13px;}
.home-condition-label{font-size:9px;letter-spacing:1.4px;text-transform:uppercase;color:var(--home-glass-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.home-condition-main{margin-top:6px;font-family:var(--ui);font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.home-condition-meta{margin-top:3px;font-size:10px;color:var(--home-glass-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.home-vehicle-surface{padding:16px;}
.home-vehicle-button{width:100%;color:inherit;text-align:left;cursor:pointer;transition:transform .15s ease,box-shadow .15s ease;}
.home-vehicle-button:hover{transform:translateY(-1px);box-shadow:0 15px 30px rgba(0,0,0,.28);}
.home-vehicle-button:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
.home-vehicle-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.home-vehicle-status-meta{display:flex;flex-direction:column;align-items:flex-end;gap:2px;}
.home-vehicle-health{font-size:9px;font-weight:600;color:#8ac59b;}
.home-telemetry-freshness{font-size:9px;color:var(--home-glass-muted);white-space:nowrap;}
.home-vehicle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.home-van-item{min-width:0;padding:10px 6px;border:1px solid rgba(255,255,255,.05);border-radius:10px;background:var(--home-glass-inset);text-align:center;}
.home-van-value{font-family:var(--ui);font-size:clamp(15px,4.2vw,19px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--home-glass-text);}
.home-van-label{margin-top:4px;font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--home-glass-muted);}
.home-opportunity{padding:16px 17px;border-radius:16px;}
.home-opportunity-title{margin-top:4px;color:var(--home-glass-text);font-family:var(--ui);font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.25;}
.home-opportunity-copy{margin-top:5px;color:var(--home-glass-muted);font-size:11px;line-height:1.5;}
.home-opportunity-action{display:inline-block;margin-top:10px;padding:0;border:0;background:none;color:#8ac59b;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.5px;cursor:pointer;}
.home-opportunity-action:hover{text-decoration:underline;}
.home-calm-status{display:flex;align-items:center;gap:9px;padding:16px 17px;border:1px solid var(--home-glass-border);border-radius:16px;background:var(--home-glass-secondary);box-shadow:var(--home-glass-shadow);backdrop-filter:blur(12px);color:var(--home-glass-text);}
.home-calm-status::before{content:'✓';display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:rgba(80,159,103,.2);color:#8ac59b;font-family:var(--display);font-weight:800;}
.home-calm-status-title{font-family:var(--ui);font-size:14px;font-weight:700;}
.home-calm-status-copy{margin-top:1px;font-size:10px;color:var(--home-glass-muted);}

/* ── AUDREY 2.0 JOURNEY ────────────────────────────────────── */
.journey-experience{--journey-scene-image:none;--journey-scene-position:center;--journey-scene-position-tablet:center;--journey-scene-position-wide:center;min-height:calc(100vh - 74px);padding:14px;background-image:linear-gradient(180deg,rgba(8,10,9,.44),rgba(8,10,9,.78)),var(--journey-scene-image),radial-gradient(ellipse 80% 45% at 15% -10%,rgba(164,143,94,.16),transparent 72%),radial-gradient(ellipse 60% 45% at 100% 25%,rgba(75,112,105,.16),transparent 70%),linear-gradient(155deg,#171917,#22251f 55%,#191c19);background-size:cover,cover,auto,auto,cover;background-position:center,var(--journey-scene-position),center,center,center;}
.journey-canvas{width:min(100%,1120px);margin:0 auto;}
.journey-head{padding:19px 6px 15px;color:#f4f3ed;}
.journey-eyebrow{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#cbb88f;}
.journey-title{margin-top:5px;font-family:var(--ui);font-size:clamp(25px,6vw,34px);font-weight:700;letter-spacing:-.7px;line-height:1.12;}
.journey-subtitle{margin-top:6px;font-family:var(--ui);font-size:13px;color:#b7b9b0;}
.journey-mode-switch{display:inline-grid;grid-template-columns:1fr 1fr;gap:3px;margin-top:17px;padding:3px;border-radius:10px;background:rgba(255,255,255,.08);}
.journey-mode-btn{min-width:86px;padding:8px 12px;border:0;border-radius:7px;background:transparent;color:#b9bbb2;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:1.2px;cursor:pointer;}
.journey-mode-btn.is-active{background:rgba(255,255,255,.13);color:#f6f4ed;}
.journey-mode-btn:disabled{opacity:.45;cursor:default;}
.journey-mode{display:none;}
.journey-mode.is-active{display:block;}
.journey-drive-brief,.journey-overview{padding:18px;border:1px solid rgba(255,255,255,.1);border-radius:17px;background:rgba(23,27,25,.78);box-shadow:0 12px 28px rgba(0,0,0,.22);backdrop-filter:blur(12px);}
.journey-overview{padding:12px 14px;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.16);}
.journey-kicker{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#b7b9b0;}
.journey-route{display:flex;align-items:center;gap:9px;margin:8px 0 16px;color:#f4f3ed;font-family:var(--ui);font-size:clamp(19px,4.8vw,25px);font-weight:700;letter-spacing:-.45px;line-height:1.18;}
.journey-route span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.journey-route-arrow{flex:0 0 auto;color:#8ec4d5;}
.journey-decision{margin:0 0 16px;padding:13px 14px;border:1px solid rgba(255,255,255,.09);border-left:3px solid #77b78b;border-radius:12px;background:rgba(255,255,255,.065);box-shadow:0 7px 18px rgba(0,0,0,.12);}
.journey-decision.journey-caution{border-left-color:#d49a45;}.journey-decision.journey-danger{border-left-color:#d87969;}
.journey-decision-status{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#88c99a;}.journey-caution .journey-decision-status{color:#e2b161;}.journey-danger .journey-decision-status{color:#e18d80;}
.journey-decision-heading{margin-top:3px;color:#f4f3ed;font-family:var(--ui);font-size:15px;font-weight:700;line-height:1.25;}
.journey-decision-copy{margin-top:4px;font-size:11px;line-height:1.45;color:#b7b9b0;}
.journey-facts{display:flex;flex-wrap:wrap;gap:10px 19px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}
.journey-fact{min-width:72px;}.journey-fact-label{font-size:8px;letter-spacing:1.35px;text-transform:uppercase;color:#b7b9b0;}.journey-fact-value{margin-top:3px;color:#f4f3ed;font-family:var(--ui);font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.journey-section-title{margin:23px 6px 10px;color:#d7d8d0;font-size:10px;font-weight:600;letter-spacing:1.8px;text-transform:uppercase;}
.journey-timeline{position:relative;padding-left:25px;}
.journey-timeline::before{content:'';position:absolute;top:11px;bottom:12px;left:8px;width:2px;background:linear-gradient(#c6a66d,rgba(255,255,255,.23) 11%,rgba(255,255,255,.14));}
.journey-point{position:relative;padding:0 0 17px 13px;}
.journey-point:last-child{padding-bottom:0;}
.journey-point::before{content:'';position:absolute;z-index:1;left:-21px;top:5px;width:10px;height:10px;border:2px solid #a8aaa0;border-radius:50%;background:#20231f;}
.journey-point.route-risk::before{border-color:#d49a45;background:#d49a45;}.journey-point.route-danger::before{border-color:#d87969;background:#d87969;}.journey-point.route-ok::before{border-color:#77b78b;background:#77b78b;}
.journey-point-card{padding:12px 13px;border:1px solid rgba(255,255,255,.09);border-radius:13px;background:rgba(31,35,32,.68);box-shadow:0 8px 20px rgba(0,0,0,.15);backdrop-filter:blur(10px);}
.journey-point-type{font-size:9px;letter-spacing:1.3px;text-transform:uppercase;color:#b7b9b0;}
.journey-point-title{margin-top:3px;color:#f4f3ed;font-family:var(--ui);font-size:14px;font-weight:700;line-height:1.3;}
.journey-point-meta{margin-top:3px;font-size:10px;color:#b7b9b0;line-height:1.45;}
.journey-details{margin:14px 0 0 25px;border:1px solid rgba(255,255,255,.1);border-radius:12px;background:rgba(22,25,23,.62);color:#d7d8d0;}
.journey-details summary{padding:10px 12px;cursor:pointer;font-size:10px;color:#b7b9b0;}
.journey-detail-row{display:flex;justify-content:space-between;gap:12px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.08);font-size:10px;}
.journey-detail-row span:last-child{text-align:right;color:#f4f3ed;}
.journey-overview-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px;}
.journey-overview-value{color:#f4f3ed;font-family:var(--ui);font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.journey-overview-label{margin-top:1px;font-size:7px;letter-spacing:1px;text-transform:uppercase;color:#b7b9b0;}
.journey-trip-point{padding-bottom:13px;}
.journey-trip-point::before{border-color:#8d9086;background:#20231f;}.journey-trip-point.is-current::before{border-color:#c6a66d;background:#c6a66d;}.journey-trip-point.is-complete::before{border-color:#77b78b;background:#77b78b;}
.journey-trip-card{display:grid;grid-template-columns:50px 1fr auto;gap:9px;align-items:start;padding:9px 10px;border-radius:11px;background:rgba(27,31,28,.42);}
.journey-trip-card.journey-place-card{border:1px solid rgba(255,255,255,.075);box-shadow:0 6px 17px rgba(0,0,0,.1);backdrop-filter:blur(8px);}
.journey-trip-card.journey-leg-card{padding-top:6px;padding-bottom:6px;background:transparent;}
.journey-trip-card.journey-leg-card .journey-type{background:rgba(142,196,213,.13);color:#a9d3df;}
.journey-date{padding-top:2px;font-size:9px;color:#9fa198;line-height:1.3;}.journey-date strong{display:block;color:#dedfd8;font-size:11px;font-weight:600;}
.journey-stop{color:#f4f3ed;font-family:var(--ui);font-size:13px;font-weight:700;line-height:1.25;}.journey-stop-meta{margin-top:2px;font-size:9px;color:#a8aaa1;line-height:1.4;}.journey-type{padding:3px 5px;border-radius:5px;background:rgba(255,255,255,.08);color:#b9bbb2;font-size:7px;letter-spacing:.9px;text-transform:uppercase;white-space:nowrap;}
.journey-trip-details{grid-column:2/-1;margin-top:1px;padding-top:2px;border-top:1px solid rgba(255,255,255,.055);}.journey-trip-details summary{font-size:9px;color:#83b9c7;cursor:pointer;}.journey-trip-detail{margin-top:5px;font-size:9px;color:#a8aaa1;line-height:1.45;}.journey-trip-detail a{color:#83b9c7;text-decoration:none;}
.more-intro{padding:14px 18px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-dim);}

/* ── AUDREY 2.0 MORE ─────────────────────────────────────────
   A quiet secondary control centre. Legacy detail builders inherit these
   scoped dark tokens without changing their data or behaviour elsewhere. */
.more-experience{--bg:#171a17;--bg2:#20251f;--bg3:#2a3029;--text:#f4f3ed;--text-dim:#c4c7be;--text-muted:#a4a9a0;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.17);min-height:calc(100vh - 74px);padding:14px;color:#f4f3ed;background:linear-gradient(155deg,#171917,#22251f 55%,#191c19);}.more-canvas{width:min(100%,820px);margin:0 auto;}.more-head{padding:19px 6px 16px;}.more-eyebrow,.more-group-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#cbb88f;}.more-title{margin-top:5px;font-family:var(--ui);font-size:clamp(24px,5.5vw,31px);font-weight:700;letter-spacing:-.65px;line-height:1.12;}.more-subtitle{margin-top:6px;color:#b9bcb3;font-family:var(--ui);font-size:13px;}.more-group{margin-top:22px;}.more-group:first-of-type{margin-top:0;}.more-group-label{margin:0 6px 9px;color:#b7b9b0;}.more-trip-content,.more-config-panel,.more-system-panel{display:grid;gap:10px;}.more-experience .section{overflow:hidden;margin:0;border:1px solid rgba(255,255,255,.1);border-radius:15px;background:rgba(23,27,25,.76);box-shadow:0 10px 24px rgba(0,0,0,.18);backdrop-filter:blur(12px);}.more-experience .section-head{padding:12px 14px;background:rgba(255,255,255,.055);}.more-experience .section-head:hover{background:rgba(255,255,255,.09);}.more-experience .section-title{color:#e4e5de;}.more-experience .section-meta{color:#aeb2a9;}.more-experience .section-chevron{color:#cbb88f;}.more-experience .weather-loc-head{background:rgba(8,11,9,.28);border-color:rgba(255,255,255,.08);color:#d7d8d0;}.more-experience .weather-row{border-color:rgba(255,255,255,.08);}.more-experience .weather-row.today{background:rgba(203,184,143,.09);}.more-experience .weather-date,.more-experience .weather-condition,.more-experience .weather-nums{color:#c4c7be;}.more-experience .weather-date strong{color:#f4f3ed;}.more-experience .settings-group{margin:0;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:13px;background:rgba(23,27,25,.76);}.more-experience .settings-group-head{background:rgba(255,255,255,.055);border-color:rgba(255,255,255,.08);}.more-experience .settings-group-title{color:#b7b9b0;}.more-experience .settings-row,.more-experience .resort-row{border-color:rgba(255,255,255,.08);}.more-experience .settings-row-label,.more-experience .resort-name-s{color:#e8e8e1;}.more-experience .settings-row-value{color:#f4f3ed;}.more-experience .settings-row-unit,.more-experience .resort-sub-s,.more-experience .settings-note{color:#aeb2a9;}.more-experience .settings-note{background:rgba(8,11,9,.25);border-color:rgba(255,255,255,.08);}.more-experience .trip-select,.more-experience .add-resort-input{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#f4f3ed;}.more-experience .s-edit-btn,.more-experience .add-resort-btn{border-color:rgba(255,255,255,.18);color:#a9d3df;}.more-experience .toggle{border-color:rgba(255,255,255,.2);}.more-system{overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(23,27,25,.7);box-shadow:0 8px 20px rgba(0,0,0,.15);}.more-system-summary{padding:13px 14px;color:#a9d3df;font-family:var(--mono);font-size:10px;cursor:pointer;}.more-system-body{padding:0 14px 14px;border-top:1px solid rgba(255,255,255,.08);}.more-system-copy{margin:11px 0;color:#b7b9b0;font-size:11px;line-height:1.45;}.more-system-btn{width:100%;padding:10px;border:1px solid rgba(255,255,255,.16);border-radius:9px;background:rgba(255,255,255,.06);color:#d9dad3;font-family:var(--ui);font-size:12px;font-weight:700;cursor:pointer;}.more-system-btn:hover{border-color:#cbb88f;color:#f4f3ed;}.more-system-status{min-height:16px;margin-top:7px;color:#aeb2a9;font-size:10px;text-align:center;}.more-data-note{padding:15px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(23,27,25,.65);color:#b7b9b0;font-size:11px;line-height:1.5;}.more-system-meta{padding:13px 14px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:rgba(23,27,25,.65);color:#b7b9b0;font-size:11px;line-height:1.5;}.more-system-meta strong{color:#f4f3ed;font-weight:600;}
.more-experience details.settings-group>.settings-group-head{display:block;padding:9px 14px;cursor:pointer;list-style:none;}.more-experience details.settings-group>.settings-group-head::-webkit-details-marker{display:none;}
.more-experience .weather-empty{padding:15px 14px;color:#b7b9b0;font-size:11px;line-height:1.5;}.more-experience .weather-empty strong{display:block;margin-bottom:3px;color:#e4e5de;font-family:var(--ui);font-size:13px;}

/* ── AUDREY 2.0 VAN ──────────────────────────────────────────
   VAN is an evidence surface: it only interprets existing telemetry and
   planner data, and keeps the existing LPG/fuel actions intact. */
.van-experience{--van-scene-image:none;--van-scene-position:center;--van-scene-position-tablet:center;--van-scene-position-wide:center;--van-text:#f4f3ed;--van-secondary:#c4c7be;--van-muted:#a4a9a0;--van-glass:rgba(22,26,23,.76);--van-glass-soft:rgba(31,35,32,.64);--van-border:rgba(255,255,255,.1);min-height:calc(100vh - 74px);padding:14px;color:var(--van-text);background-image:linear-gradient(180deg,rgba(8,10,9,.38),rgba(8,10,9,.75)),var(--van-scene-image),radial-gradient(ellipse 75% 50% at 14% -8%,rgba(164,143,94,.16),transparent 72%),linear-gradient(155deg,#171917,#22251f 55%,#191c19);background-size:cover,cover,auto,cover;background-position:center,var(--van-scene-position),center,center;}.van-canvas{width:min(100%,1020px);margin:0 auto;}.van-head{padding:19px 6px 15px;}.van-eyebrow,.van-section-label{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#cbb88f;}.van-title{margin-top:5px;font-family:var(--ui);font-size:clamp(25px,6vw,34px);font-weight:700;letter-spacing:-.7px;line-height:1.12;}.van-subtitle{margin-top:6px;color:var(--van-secondary);font-family:var(--ui);font-size:13px;}.van-health,.van-surface{border:1px solid var(--van-border);border-radius:17px;background:var(--van-glass);box-shadow:0 12px 28px rgba(0,0,0,.22);backdrop-filter:blur(12px);}.van-health{padding:17px;border-left:3px solid #77b78b;}.van-health.van-caution{border-left-color:#d49a45;}.van-health.van-danger{border-left-color:#d87969;}.van-health-state{font-size:10px;font-weight:700;letter-spacing:1.5px;color:#8ac59b;}.van-caution .van-health-state{color:#e2b161;}.van-danger .van-health-state{color:#e18d80;}.van-health-title{margin-top:4px;font-family:var(--ui);font-size:18px;font-weight:700;}.van-health-copy{margin-top:4px;color:var(--van-secondary);font-size:12px;line-height:1.5;}.van-alert-list{display:grid;gap:6px;margin-top:13px;padding-top:12px;border-top:1px solid rgba(255,255,255,.1);}.van-alert{padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.05);color:#e5e5dd;font-size:11px;line-height:1.45;}.van-alert.van-alert-danger{border-left:2px solid #dc8271;}.van-alert.van-alert-caution{border-left:2px solid #d7a453;}.van-layout{display:grid;gap:12px;margin-top:13px;}.van-support{display:grid;gap:12px;}.van-surface{padding:16px;}.van-surface-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}.van-surface-title{margin-top:3px;font-family:var(--ui);font-size:17px;font-weight:700;}.van-surface-meta{color:var(--van-muted);font-size:10px;text-align:right;}.van-power-value{margin-top:14px;font-family:var(--ui);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:#f4f3ed;}.van-power-status{margin-top:5px;color:var(--van-secondary);font-size:11px;}.van-metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;}.van-metric{padding:11px;border:1px solid rgba(255,255,255,.06);border-radius:11px;background:rgba(255,255,255,.06);}.van-metric-value{color:#f4f3ed;font-family:var(--ui);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;}.van-metric-label{margin-top:4px;color:var(--van-muted);font-size:8px;letter-spacing:1.1px;text-transform:uppercase;}.van-metric-status{margin-top:3px;color:var(--van-secondary);font-size:10px;}.van-lpg-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-top:13px;}.van-lpg-value{font-family:var(--ui);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}.van-lpg-status{margin-top:4px;color:var(--van-secondary);font-size:11px;}.van-refill-btn,.van-edit-btn{border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.06);color:#a9d3df;font-family:var(--mono);font-size:10px;cursor:pointer;}.van-refill-btn{min-height:34px;padding:0 11px;white-space:nowrap;}.van-refill-btn:hover,.van-edit-btn:hover{border-color:#a9d3df;background:rgba(169,211,223,.12);}.van-lpg-bar{height:8px;margin-top:13px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.1);}.van-lpg-fill{height:100%;border-radius:inherit;background:#77b78b;}.van-lpg-fill.van-caution{background:#d49a45;}.van-lpg-fill.van-danger{background:#d87969;}.van-runway{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:13px;}.van-runway-item{padding:10px;border-radius:10px;background:rgba(255,255,255,.045);}.van-runway-label{color:var(--van-muted);font-size:8px;letter-spacing:1.1px;text-transform:uppercase;}.van-runway-value{margin-top:3px;color:#f4f3ed;font-family:var(--ui);font-size:12px;font-weight:700;line-height:1.35;}.van-runway-meta{margin-top:3px;color:var(--van-secondary);font-size:10px;line-height:1.4;}.van-detail-list{display:grid;gap:9px;margin-top:13px;}.van-detail-row{display:flex;justify-content:space-between;gap:14px;color:var(--van-secondary);font-size:11px;line-height:1.4;}.van-detail-row strong{color:#f4f3ed;font-weight:600;text-align:right;}.van-map-link{color:#a9d3df;text-decoration:none;}.van-fuel-facts{display:flex;flex-wrap:wrap;gap:10px 19px;margin-top:13px;}.van-fuel-fact{min-width:76px;}.van-fuel-label{color:var(--van-muted);font-size:8px;letter-spacing:1.1px;text-transform:uppercase;}.van-fuel-value{margin-top:3px;color:#f4f3ed;font-family:var(--ui);font-size:14px;font-weight:700;}.van-details{margin-top:14px;border-top:1px solid rgba(255,255,255,.1);}.van-details summary{padding:12px 0 2px;color:#a9d3df;font-family:var(--mono);font-size:10px;cursor:pointer;}.van-price-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);color:var(--van-secondary);font-size:11px;}.van-price-row strong{color:#f4f3ed;font-family:var(--ui);font-size:14px;}.van-edit-btn{padding:4px 8px;}
@media(min-width:800px){.van-experience{min-height:calc(100vh - 63px);padding:clamp(22px,4vw,48px);background-position:center,var(--van-scene-position-wide),center,center;}.van-head{padding:6px 0 18px;}.van-support{grid-template-columns:repeat(2,minmax(0,1fr));}.van-surface.van-wide{grid-column:span 2;}.van-runway{grid-template-columns:repeat(2,minmax(0,1fr));}}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(20,22,20,.97);position:sticky;top:0;z-index:100;gap:12px;box-shadow:0 1px 12px rgba(0,0,0,.16);backdrop-filter:blur(18px);}
.header-left{display:flex;align-items:center;flex-shrink:0;}
.wordmark{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#f7f5ee;}
.wordmark span{color:var(--gold);}
.trip-selector{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#f7f5ee;font-family:var(--mono);font-size:12px;padding:6px 10px;border-radius:6px;outline:none;cursor:pointer;max-width:180px;flex-shrink:1;min-width:0;}
.refresh-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);color:#dcddd7;font-family:var(--mono);font-size:11px;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:all 0.15s;}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold);}
.refresh-btn.loading{opacity:0.5;pointer-events:none;}

/* MASTER BAR */
.master-bar{display:flex;align-items:stretch;border-bottom:1px solid var(--border);min-height:56px;}
.master-status{display:flex;align-items:center;gap:10px;padding:14px 20px;font-family:var(--display);font-size:18px;font-weight:700;flex-shrink:0;min-width:140px;background:var(--bg2);border-right:1px solid var(--border);}
.master-advice{display:flex;align-items:center;padding:14px 20px;font-size:13px;color:var(--text-dim);flex:1;line-height:1.5;}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* COUNTDOWN / NEXT DRIVE GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-bottom:1px solid var(--border);}
.countdown-card{grid-column:span 2;background:var(--bg2);padding:20px;display:flex;align-items:center;gap:20px;}
.countdown-number{font-family:var(--display);font-size:clamp(36px,8vw,56px);font-weight:800;line-height:1;color:var(--gold);flex-shrink:0;}
.countdown-detail{flex:1;}
.countdown-label{font-size:10px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:4px;}
.countdown-trip{font-family:var(--display);font-size:clamp(16px,4vw,22px);font-weight:600;color:var(--text);margin-bottom:6px;line-height:1.2;}
.trip-status-badge{display:inline-block;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 8px;border-radius:20px;font-family:var(--mono);}
.drive-card{grid-column:span 2;background:var(--bg3);padding:16px 18px;border-top:2px solid var(--frost);}
.drive-route{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap;}
.drive-origin,.drive-dest{font-family:var(--display);font-size:clamp(14px,3.5vw,18px);font-weight:600;}
.drive-arrow{color:var(--frost);font-size:16px;flex-shrink:0;}
.drive-meta{display:flex;gap:16px;flex-wrap:wrap;}
.drive-stat{display:flex;flex-direction:column;gap:2px;}
.drive-stat-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}
.drive-stat-value{font-size:13px;color:var(--frost);font-weight:500;}
.card-label{font-size:9px;letter-spacing:3px;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;}

/* COLLAPSIBLE SECTIONS */
.section{border-bottom:1px solid var(--border);}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px;background:var(--bg2);cursor:pointer;user-select:none;-webkit-user-select:none;}
.section-head:hover{background:var(--bg3);}
.section-left{display:flex;align-items:center;gap:10px;flex:1;min-width:0;}
.section-title{font-size:11px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;font-weight:600;}
.section-meta{font-size:12px;color:var(--text-muted);white-space:nowrap;}
.section-chevron{font-size:14px;color:var(--gold);transition:transform 0.2s;flex-shrink:0;margin-left:8px;}
.section-body{overflow:hidden;transition:max-height 0.25s ease;}
.section.collapsed .section-body{max-height:0!important;}
.section.collapsed .section-chevron{transform:rotate(-90deg);}

/* VEHICLE GRID */
.van-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border);}
.van-card{background:var(--bg);padding:14px 16px;text-align:center;}
.van-card-icon{font-size:20px;margin-bottom:4px;display:block;}
.van-card-value{font-family:var(--display);font-size:clamp(14px,3.5vw,20px);font-weight:700;line-height:1;margin-bottom:3px;}
.van-card-label{font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;}

/* WEATHER */
.weather-list{}
.weather-row{display:grid;grid-template-columns:90px 1fr auto;gap:12px;align-items:center;padding:11px 18px;border-bottom:1px solid var(--border);}
.weather-row:last-child{border-bottom:none;}
.weather-row.today{background:#fdf8ee;}
.weather-date{font-size:12px;color:var(--text-dim);}
.weather-date strong{display:block;font-size:13px;color:var(--text);font-weight:600;}
.weather-middle{min-width:0;}
.weather-condition{font-size:13px;color:var(--text-dim);}
.weather-stats{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0;}
.weather-risk{font-size:12px;font-weight:600;text-align:right;}
.weather-nums{font-size:11px;color:var(--text-dim);text-align:right;}
.weather-loc-head{padding:7px 18px 4px;background:var(--bg2);border-bottom:1px solid var(--border);font-size:11px;letter-spacing:1px;color:var(--text-dim);font-weight:600;text-transform:uppercase;}

/* ITINERARY */
.itin-row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:start;padding:12px 18px;border-bottom:1px solid var(--border);}
.itin-row:last-child{border-bottom:none;}
.itin-row.today{background:#fdf8ee;border-left:3px solid var(--gold);}
.itin-row.past{opacity:0.45;}
.itin-date{font-size:11px;color:var(--text-muted);padding-top:2px;line-height:1.4;}
.itin-date strong{display:block;font-size:13px;color:var(--text-dim);font-weight:600;}
.itin-location{font-size:15px;color:var(--text);font-weight:600;margin-bottom:3px;}
.itin-notes{font-size:12px;color:var(--text-dim);margin-top:1px;}
.itin-badge{font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:4px 9px;border-radius:3px;align-self:start;font-weight:600;}
.type-DEPART  {background:#e8f5ee;color:var(--go);border:1px solid #b8dfc8;}
.type-DRIVE   {background:#e8f0f8;color:var(--frost);border:1px solid #b8cce8;}
.type-STOPOVER{background:#f8f0e0;color:var(--gold);border:1px solid #e0c890;}
.type-STAY    {background:#eeece8;color:var(--text-dim);border:1px solid var(--border2);}
.type-ARRIVE  {background:#f0e8f8;color:#7d3c98;border:1px solid #d8b8e8;}
.type-RETURN  {background:#fde8e8;color:var(--danger);border:1px solid #f0b8b8;}

/* LPG */
.refill-btn{background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:3px 8px;border-radius:3px;cursor:pointer;white-space:nowrap;transition:all 0.15s;}
.refill-btn:hover{border-color:var(--frost);background:var(--bg3);}

/* MISC */
.state-message{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:12px;line-height:1.8;}
.state-message .icon{font-size:32px;display:block;margin-bottom:12px;}
.footer{padding:20px;text-align:center;font-size:10px;color:var(--text-muted);letter-spacing:1px;border-top:1px solid var(--border);}
.last-updated{color:var(--text-muted);margin-top:4px;font-size:11px;margin-bottom:12px;}
.footer-wordmark{font-family:var(--display);font-size:14px;font-weight:800;color:var(--text-dim);letter-spacing:-0.5px;margin-bottom:2px;}
.settings-toggle{background:none;border:1px solid var(--border2);color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:5px 12px;border-radius:4px;cursor:pointer;margin-top:8px;transition:all 0.15s;}
.settings-toggle:hover{border-color:var(--gold);color:var(--gold);}
.settings-panel{text-align:left;margin-top:12px;display:none;}
.settings-panel.open{display:block;}
.settings-group{border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:10px;background:var(--bg);}
.settings-group-head{padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);}
.settings-group-title{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:9px 14px;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.settings-row-label{font-size:12px;color:var(--text-dim);}
.settings-row-right{display:flex;align-items:center;gap:8px;}
.settings-row-value{font-size:14px;font-weight:700;font-family:var(--display);color:var(--text);}
.settings-row-unit{font-size:10px;color:var(--text-muted);}
.s-edit-btn{background:none;border:1px solid var(--border2);color:var(--frost);font-family:var(--mono);font-size:10px;padding:2px 8px;border-radius:3px;cursor:pointer;}
.s-edit-btn:hover{border-color:var(--frost);background:var(--bg3);}
.resort-row{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--border);}
.resort-row:last-child{border-bottom:none;}
.resort-name-s{font-size:12px;color:var(--text-dim);}

}

.cycling-modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;}
.cycling-modal-overlay.open{display:flex;}
.cycling-modal{background:var(--bg);width:100%;max-height:92vh;border-radius:12px 12px 0 0;overflow-y:auto;}
.cycling-modal-head{padding:14px 16px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10;}
.cycling-modal-title{font-family:var(--display);font-size:15px;font-weight:800;}
.cycling-modal-close{background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;padding:0 4px;}
.cycling-upload{padding:20px 16px;text-align:center;border-bottom:1px solid var(--border);}
.cycling-upload-area{border:2px dashed var(--border2);border-radius:8px;padding:24px;margin-bottom:12px;cursor:pointer;transition:all 0.2s;}
.cycling-upload-area:hover{border-color:var(--frost);background:var(--bg2);}
.cycling-upload-area.dragover{border-color:var(--frost);background:var(--bg2);}
.cycling-inputs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}
.cycling-input-group{display:flex;flex-direction:column;gap:4px;}
.cycling-input-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);}
.cycling-input{background:var(--bg3);border:1px solid var(--border2);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 10px;border-radius:4px;width:100%;outline:none;}
.cycling-input:focus{border-color:var(--frost);}
.cycling-analyse-btn{width:100%;padding:13px;background:var(--frost);color:#fff;border:none;border-radius:6px;font-family:var(--display);font-size:14px;font-weight:700;cursor:pointer;}
.cycling-analyse-btn:disabled{opacity:0.5;cursor:not-allowed;}
.cycling-results{padding:0;}
.cycling-route-header{padding:14px 16px;border-bottom:1px solid var(--border);}
.cycling-route-name{font-family:var(--display);font-size:16px;font-weight:800;margin-bottom:4px;}
.cycling-route-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0;}

.cycling-stat-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);}
.cycling-risk-banner{padding:8px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);}
.cycling-seg{border-bottom:1px solid var(--border);cursor:pointer;}
.cycling-seg:last-child{border-bottom:none;}
.cycling-seg:hover{background:var(--bg3);}
.cycling-seg-head{display:flex;align-items:center;padding:10px 16px;gap:8px;}
.cycling-seg-km{font-size:10px;color:var(--text-muted);min-width:38px;}
.cycling-seg-left{flex:1;}
.cycling-seg-name{font-size:13px;font-weight:700;font-family:var(--display);}
.cycling-seg-alt{font-size:10px;color:var(--text-muted);}
.cycling-seg-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.cycling-seg-eta{font-size:11px;color:var(--text-dim);}
.cycling-seg-body{padding:10px 16px;background:var(--bg2);border-top:1px solid var(--border);display:none;}
.cycling-seg-body.open{display:block;}
.cycling-wx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px;}
.cycling-wx-item{text-align:center;}
.cycling-wx-label{font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px;}
.cycling-wx-val{font-size:15px;font-weight:700;font-family:var(--display);}
.cycling-alert{padding:7px 10px;border-radius:4px;font-size:11px;margin-bottom:5px;line-height:1.4;}
.cycling-alert:last-child{margin-bottom:0;}
.c-alert-storm{background:#fdf0f0;color:#8b1a1a;border-left:3px solid #8b1a1a;}
.c-alert-wind{background:#eaf3fb;color:#1a5276;border-left:3px solid #1a5276;}
.c-alert-heat{background:#fdf8ee;color:#7d4e00;border-left:3px solid #7d4e00;}
.c-alert-cold{background:#eaf0fb;color:#1a3276;border-left:3px solid #1a3276;}
.c-alert-ok{background:#f0f8f2;color:var(--go);border-left:3px solid var(--go);}

.cycling-modal{--bg:#171a17;--bg2:#20251f;--bg3:#2a3029;--text:#f4f3ed;--text-dim:#c7c9c1;--text-muted:#a8ada4;--border:rgba(255,255,255,.1);--border2:rgba(255,255,255,.18);color:var(--text);box-shadow:0 -18px 40px rgba(0,0,0,.35);}.cycling-modal-title,.cycling-route-name,.cycling-stat-val,.cycling-seg-name,.cycling-wx-val{font-family:var(--ui);font-variant-numeric:tabular-nums;}.cycling-modal-title{font-size:15px;}.cycling-analyse-btn{font-family:var(--ui);border-radius:9px;}.cycling-upload-area,.cycling-input{border-radius:9px;}.cycling-alert{border-radius:8px;background:rgba(255,255,255,.055);}.cycling-alert.c-alert-storm{color:#efafa5;border-left-color:#dc8271;}.cycling-alert.c-alert-wind,.cycling-alert.c-alert-heat,.cycling-alert.c-alert-cold{color:#ead09e;border-left-color:#d7a453;}.cycling-alert.c-alert-ok{color:#b4ddbd;border-left-color:#79ba8a;}.cycling-gpx-download{background:rgba(10,13,11,.38);}.cycling-seg-head{padding-block:11px;}.cycling-seg-alt{font-size:11px;}.cycling-input-label,.cycling-stat-label,.cycling-wx-label{font-size:10px;letter-spacing:1px;}

/* Scene viewport safety: svh tracks Safari's smallest visible viewport, so
   browser chrome cannot crop the canvas or cause it to resize while scrolling.
   The preceding vh declarations remain the fallback for older browsers. */
@media (min-width:641px) and (max-width:799px){
  .home-experience{background-position:center,var(--home-scene-position-tablet),center,center,center;}
  .journey-experience{background-position:center,var(--journey-scene-position-tablet),center,center,center;}
  .do-experience{background-position:center,var(--do-scene-position-tablet),center,center;}
  .van-experience{background-position:center,var(--van-scene-position-tablet),center,center;}
}

  body{min-height:100svh;}

  .app-main,.home-experience,.journey-experience,.do-experience,.more-experience,.van-experience{min-height:calc(100svh - 74px);}
  @media(min-width:800px){
    .app-main,.home-experience,.journey-experience,.do-experience,.more-experience,.van-experience{min-height:calc(100svh - 63px);}
    .primary-nav{height:calc(100svh - 63px);}
  }
}

</style>
</head>
<body>
<div class="app-shell">

    Connecting to Audrey...

<!-- Audrey 2.0 primary navigation: view switching is entirely client-side. -->

</div>

<!-- Cycling modal — outside footer -->
<div class="cycling-modal-overlay" id="cyclingModalOverlay" onclick="closeCyclingModalIfOutside(event)">

      <span class="cycling-modal-title">🚴 Ride Weather Analysis</span>
      <button class="cycling-modal-close" onclick="closeCyclingModal()">✕</button>
    </div>

      <!-- populated by JS -->
    </div>
  </div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbzkNIe9iFbh0DN4ApI07qv-6vqZlBuhGr_85ED0DpBnhIw1oq7Ubad00jJL4d73Ee36ew/exec';
var currentData=null,currentTrip=null;

// ── AUDREY 2.0 VIEW STATE ─────────────────────────────────────
// This is intentionally separate from dashboard data state. Switching views
// never fetches again: every view is composed from the current API payload.
var currentAppView='home';
var APP_VIEW_LABELS={home:'Home',journey:'Journey',do:'Do',van:'Van',more:'More'};
var isSettingsPanelOpen=false;
var currentJourneyMode='today';

function switchAppView(view){
  if(!APP_VIEW_LABELS[view])return;
  currentAppView=view;
  applyAppView();
}

function applyAppView(){
  document.querySelectorAll('.app-view').forEach(function(el){
    el.classList.toggle('is-active',el.dataset.view===currentAppView);
  });
  document.querySelectorAll('.primary-nav-btn').forEach(function(btn){
    var active=btn.dataset.view===currentAppView;
    btn.classList.toggle('is-active',active);
    btn.setAttribute('aria-current',active?'page':'false');
  });
  var main=document.getElementById('main');
  if(main)main.dataset.activeView=currentAppView;
}

// ── JOURNEY VIEW STATE ───────────────────────────────────────
// TODAY/TRIP is local presentation state only; it never fetches dashboard data.
function switchJourneyMode(mode){
  if(mode!=='today'&&mode!=='trip')return;
  if(mode==='today'&&!hasJourneyDrive(currentData))return;
  currentJourneyMode=mode;
  applyJourneyMode();
}

function hasJourneyDrive(data){
  return !!(data&&data.meta&&data.meta.nextDrive&&data.meta.tripStatus!=='POST_TRIP');
}

function applyJourneyMode(){
  document.querySelectorAll('.journey-mode').forEach(function(el){
    el.classList.toggle('is-active',el.dataset.journeyMode===currentJourneyMode);
  });
  document.querySelectorAll('.journey-mode-btn').forEach(function(btn){
    var active=btn.dataset.journeyMode===currentJourneyMode;
    btn.classList.toggle('is-active',active);
    btn.setAttribute('aria-current',active?'page':'false');
  });
}

// ── COLLAPSIBLE STATE ─────────────────────────────────────────
// Persisted in sessionStorage so state survives refresh but resets on new visit
var COLLAPSE_KEY='audrey_collapsed';
function getCollapsed(){
  try{return JSON.parse(sessionStorage.getItem(COLLAPSE_KEY)||'{}');}catch(e){return{};}
}
function setCollapsed(id,val){
  var s=getCollapsed();s[id]=val;
  try{sessionStorage.setItem(COLLAPSE_KEY,JSON.stringify(s));}catch(e){}
}
function toggleSection(id){
  var el=document.getElementById('sec-'+id);
  if(!el)return;
  var collapsed=el.classList.toggle('collapsed');
  setCollapsed(id,collapsed);
}
function applyCollapsed(){
  var s=getCollapsed();
  Object.keys(s).forEach(function(id){
    if(s[id]){
      var el=document.getElementById('sec-'+id);
      if(el)el.classList.add('collapsed');
    }
  });
  // Set max-height on all section bodies for smooth animation
  document.querySelectorAll('.section-body').forEach(function(b){
    if(!b.parentElement.classList.contains('collapsed')){
      b.style.maxHeight=b.scrollHeight+'px';
    }
  });
}

function makeSection(id,title,meta,rightHtml,bodyHtml){
  var chevron='<span class="section-chevron">&#8250;</span>';
  var metaSpan=meta?'<span class="section-meta">'+meta+'</span>':'';
  var right=rightHtml||'';
  return '<div class="section" id="sec-'+id+'">'
    +'<div class="section-head" onclick="toggleSection(\''+id+'\')">'
    +'<div class="section-left">'
    +'<span class="section-title">'+title+'</span>'
    +metaSpan
    +'</div>'
    +right
    +chevron
    +'</div>'
    +'<div class="section-body" style="max-height:4000px">'+bodyHtml+'</div>'
    +'</div>';
}

// ── FETCH ─────────────────────────────────────────────────────
async function fetchData(trip){
  var params=new URLSearchParams();
  if(trip)params.set('trip',trip);
  params.set('_',Date.now());
  var url=API_URL+'?'+params.toString();
  var r;
  try{r=await fetch(url,{redirect:'follow',headers:{'Accept':'application/json'}});}
  catch(e){r=await fetch(url,{mode:'cors',credentials:'omit',redirect:'follow'});}
  if(!r.ok)throw new Error('HTTP '+r.status);
  var text=await r.text();
  try{return JSON.parse(text);}catch(e){throw new Error('Invalid response from server');}
}

async function loadTrip(name){currentTrip=name||null;await refresh();}

// Route-detail DOM is intentionally ephemeral. A dashboard reload can replace
// its backing lists, so return DO to its reliable decision surface first.
function resetDoForDataReload(){
  currentDoSubview='home';
  doCyclingOverview=null;
  actSelectedRoute=null;
  actAnalysisResults=null;
  actCurrentFilter='all';
  actCurrentFilters={trail:'all',cycle:'all'};
}

async function refresh(){
  resetDoForDataReload();
  var btn=document.getElementById('refreshBtn');
  btn.classList.add('loading');btn.textContent='Loading...';
  try{
    var d=await fetchData(currentTrip);
    if(d.error)throw new Error(d.error);
    currentData=d;render(d);
  }catch(e){renderError(e.message);}
  finally{btn.classList.remove('loading');btn.textContent='\u21BB Refresh';}
}

function getSmartDefaults(meta) {
  var status   = meta.tripStatus   || 'PRE_TRIP';
  var dayType  = meta.todayType    || null;
  var isWinter = meta.season       === 'winter';
  var isDrive  = dayType && ['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(dayType) >= 0;
  var isStay   = dayType === 'STAY';

  // Base defaults — most things collapsed
    var d = {
    vehicle:    true,
    lpg:        true,
    running:    true,
    weather:    false,
    snow:       true,
    budget:     true,
    itinerary:  true,
    prices:     true,
    activities: true
  };

  if (status === 'PRE_TRIP') {
    d.itinerary = false; // show itinerary so you can plan
    d.budget    = true;  // budget collapsed until needed
    d.weather   = false; // weather always useful
  }

  if (status === 'ACTIVE') {
    if (isDrive) {
      d.vehicle   = false; // battery/temps matter on road
      d.weather   = false; // conditions for today
      d.itinerary = true;  // don't need full itinerary while driving
      d.snow      = isWinter ? false : true; // snow open on winter drive days
    }
       if (isStay) {
      d.lpg        = false; // heating tonight
      d.weather    = false; // conditions today
      d.snow       = isWinter ? false : true; // snow open on stay days in winter
      d.vehicle    = true;  // less critical on stay days
      d.itinerary  = true;  // don't need itinerary on stay days
      d.activities = false; // open activities on stay days — plan what to do
    } 
  }

  if (status === 'POST_TRIP') {
    d.budget    = false; // reconcile actuals
    d.vehicle   = true;
    d.weather   = true;
    d.itinerary = true;
    d.snow      = true;
  }

  return d;
}

function render(d){
  populateTripSelector(d.trips, d.meta.tripName);

  // Reset collapsed state when trip changes
  var lastTrip = sessionStorage.getItem('audrey_trip');
  if (lastTrip !== d.meta.tripName) {
    sessionStorage.removeItem(COLLAPSE_KEY);
    sessionStorage.setItem('audrey_trip', d.meta.tripName);
  }

  // Apply smart defaults only if no user preferences stored yet
  var existing = getCollapsed();
  if (Object.keys(existing).length === 0) {
    var defaults = getSmartDefaults(d.meta);
    Object.keys(defaults).forEach(function(id) {
      setCollapsed(id, defaults[id]);
    });
  }

  // Completed/no-drive trips always open on the meaningful trip timeline.
  if(!hasJourneyDrive(d))currentJourneyMode='trip';

  document.getElementById('main').innerHTML = buildMain(d);
  var ts = new Date(d.timestamp);
  var lastUpdated=document.getElementById('lastUpdated');
  if(lastUpdated)lastUpdated.textContent=
    'Last updated ' + ts.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  applyCollapsed();
  applyAppView();
  applyJourneyMode();
  if(isSettingsPanelOpen&&currentAppView==='more'){
    var settingsPanel=document.getElementById('settingsPanel');
    var settingsBtn=document.getElementById('settingsBtn');
    if(settingsPanel)settingsPanel.classList.add('open');
    if(settingsBtn)settingsBtn.textContent='✕ Close';
    renderSettings(d);
  }

  // Saved routes are portable Audrey objects. `loadActRoutes` keeps only
  // coordinate-dependent nearby discovery behind its own location check.
  var activityLocation=d.meta&&d.meta.currentLocation?d.meta.currentLocation:'';
  setTimeout(function(){loadDoLocalPlaces(d);},350);
  setTimeout(function(){loadActRoutes(activityLocation,'trail');},500);
  setTimeout(function(){loadActRoutes(activityLocation,'cycle');},3000);
}

function renderError(msg){
  document.getElementById('main').innerHTML=
    '<div class="state-message"><span class="icon">&#9888;</span>Could not reach Audrey.<br>'
    +'<span style="color:#555;font-size:11px">'+msg+'</span><br><br>Check your connection and try again.</div>';
}

function populateTripSelector(trips,active){
  var sel=document.getElementById('tripSelector');
  if(!trips||!trips.length)return;
  sel.innerHTML=trips.map(function(t){
    var label=t.name+(t.status==='ACTIVE'?' &#9679;':t.status==='UPCOMING'?' &#9675;':'');
    return '<option value="'+t.name+'"'+(t.name===active?' selected':'')+'>'+label+'</option>';
  }).join('');
}

// ── MAIN BUILDER ──────────────────────────────────────────────
function buildMain(d){
  var fc=d.fuelConfig||{pricePerLitre:1.182,mpg:27};
  var home=[];
  home.push(buildHomeView(d,fc));

  var journey=[];
  journey.push(buildJourneyView(d,fc));

  var van=[];
  van.push(buildVanView(d,fc));

  var more=[];
  more.push(buildMoreView(d,fc));

  return buildAppView('home',home.join(''))
    +buildAppView('journey',journey.join(''))
    +buildAppView('do',buildDoView(d))
    +buildAppView('van',van.join(''))
    +buildAppView('more',more.join(''));
}

// View wrappers deliberately reuse existing builders; no feature engine or API
// behaviour is moved into the navigation layer.
function buildAppView(name,content){
  return '<section class="app-view" data-view="'+name+'" aria-label="'+APP_VIEW_LABELS[name]+'">'+content+'</section>';
}

// ── AUDREY 2.0 MORE ─────────────────────────────────────────-
// MORE owns deeper evidence, configuration and maintenance. Primary trip,
// activity and vehicle conclusions stay in their dedicated app views.
function buildMoreView(d,fc){
  var meta=d.meta||{},trip=[];
  // An array with no rows is an expected forecast-horizon absence, not a
  // broken Weather screen. An omitted weather payload remains distinguishable.
  if(Array.isArray(d.weather))trip.push(buildWeatherSection(d.weather,{allowUnavailable:true}));
  if(d.snowStatus&&meta.season==='winter')trip.push(buildSnowSection(d.snowStatus,meta,d.itinerary));
  if(d.budget)trip.push(buildBudgetSection(d.budget));
  if(!trip.length)trip.push('<div class="more-data-note">Detailed trip information will appear here when forecast, snow or budget data is available.</div>');
  var timestamp=d.timestamp&&!isNaN(new Date(d.timestamp).getTime())?new Date(d.timestamp).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Unavailable';
  return '<div class="more-experience"><div class="more-canvas">'
    +'<header class="more-head"><div class="more-eyebrow">Audrey · More</div><div class="more-title">Details and settings</div><div class="more-subtitle">Deeper trip evidence, configuration and maintenance.</div></header>'
    +'<section class="more-group"><div class="more-group-label">Trip detail</div><div class="more-trip-content">'+trip.join('')+'</div></section>'
    +'<section class="more-group"><div class="more-group-label">Configuration</div><div class="more-config-panel" id="settingsPanel">'+buildMoreSettingsHtml(d,fc)+'</div></section>'
    +'<section class="more-group"><div class="more-group-label">System</div><div class="more-system-meta"><strong>Data updated</strong><br>'+timestamp+' · Use the header Refresh for a normal update.</div><details class="more-system"><summary class="more-system-summary">Advanced system</summary><div class="more-system-body"><div class="more-system-copy">Run all backend modules only when you need a manual maintenance refresh.</div><button class="more-system-btn" type="button" onclick="runAllModulesNow()">Run all modules now</button><div class="more-system-status" id="runAllStatus"></div></div></details></section>'
    +'</div></div>';
}

function buildMoreSettingsHtml(d,fc){
  fc=fc||d.fuelConfig||{};
  var trips=d.trips||[],allResorts=d.allResorts||(d.snowStatus&&d.snowStatus.resorts)||[];
  var html='<div class="settings-group"><div class="settings-group-head"><span class="settings-group-title">Trip selection</span></div><div style="padding:10px 14px"><select class="trip-select" onchange="updateDefaultTrip(this.value)"><option value="">Choose a trip…</option>'+trips.map(function(trip){var selected=trip.name===(d.meta&&d.meta.tripName)?' selected':'';return'<option value="'+trip.name+'"'+selected+'>'+trip.name+'</option>';}).join('')+'</select></div></div>';
  html+='<div class="settings-group"><div class="settings-group-head"><span class="settings-group-title">Fuel &amp; LPG</span></div>'
    +settingsRow('Diesel',fc.pricePerLitre?fc.pricePerLitre.toFixed(2):'—','£/L','diesel')
    +settingsRow('LPG',fc.lpgPrice?fc.lpgPrice.toFixed(2):'—','£/L','lpg')
    +settingsRow('Motorhome MPG',fc.mpg?fc.mpg.toFixed(1):'—','mpg','mpg')
    +settingsRow('LPG tank',fc.tankLitres||'—','L','tank')+'</div>';
  html+='<section class="settings-group"><div class="settings-group-head"><span class="settings-group-title">Ski resorts</span></div><div id="resortList">';
  allResorts.forEach(function(resort){var active=resort.active!==false;html+='<div class="resort-row" id="rr-'+resort.name.replace(/\s/g,'_')+'"><div><div class="resort-name-s'+(active?'':' inactive')+'">'+resort.name+'</div><div class="resort-sub-s">'+(resort.elevationM?resort.elevationM+'m':'')+'</div></div><div class="resort-row-right"><button class="toggle '+(active?'toggle-on':'toggle-off')+'" onclick="toggleResortActive(this,\''+resort.name+'\')" aria-label="Toggle '+resort.name+'"><div class="toggle-knob"></div></button><span class="toggle-lbl '+(active?'toggle-lbl-on':'toggle-lbl-off')+'">'+(active?'Active':'Off')+'</span><button class="remove-btn" onclick="removeResort(\''+resort.name+'\')" title="Remove resort">✕</button></div></div>';});
  html+='</div><div class="add-resort-row"><input class="add-resort-input" id="resortInput" aria-label="Ski resort name or SnowSure slug" type="text" placeholder="Resort name or SnowSure slug…"><button class="add-resort-btn" onclick="addResort()">+ Add Ski Resort</button></div><div class="settings-note">Changes update the SnowStatus sheet and apply on the next refresh.</div></section>';
  return html;
}

// ── AUDREY 2.0 VAN ───────────────────────────────────────────
// This is deliberately a presentation layer over the existing vehicle, LPG
// and fuel payload. It does not claim hardware control or add new thresholds.
function getVanScene(d){
  var meta=d.meta||{};
  return getHomeScene(d,{mode:meta.tripStatus==='POST_TRIP'?'returned':meta.nextDrive?'drive':'unknown'});
}

function vanSceneStyle(scene){
  var style='--van-scene-position:'+scene.position+';--van-scene-position-tablet:'+scene.tabletPosition+';--van-scene-position-wide:'+scene.widePosition+';';
  if(scene.asset)style+='--van-scene-image:url(\''+scene.asset+'\');';
  return style;
}

function vanTelemetryInfo(v){
  var status=String(v.telStatus||'').toUpperCase();
  var timestamp=v.snapshotUpdatedAt?new Date(v.snapshotUpdatedAt):(v.locationTimestamp?new Date(v.locationTimestamp):null);
  var age='Telemetry timestamp unavailable';
  var mins=null;
  if(timestamp&&!isNaN(timestamp.getTime())){
    mins=Math.max(0,Math.round((Date.now()-timestamp.getTime())/60000));
    age=mins<2?'Checked just now':mins<60?'Checked '+mins+'m ago':'Last checked '+Math.floor(mins/60)+'h ago';
  }
  if(mins!==null&&mins>90)return{state:'STALE',age:age,level:'context'};
  if(status==='STALE')return{state:'STALE',age:age,level:'context'};
  if(status==='LIVE')return{state:'LIVE',age:age,level:'go'};
  return{state:status||'TELEMETRY',age:age,level:timestamp?'go':'caution'};
}

function vanReadingAge(value){
  if(!value)return'';
  var timestamp=new Date(value);
  if(isNaN(timestamp.getTime()))return'';
  var mins=Math.max(0,Math.round((Date.now()-timestamp.getTime())/60000));
  return mins<2?'just now':mins<60?mins+'m ago':Math.floor(mins/60)+'h ago';
}

function vanHumidityState(value){
  if(value===null||value===undefined||!isFinite(Number(value)))return{label:'No reading',color:'#a4a9a0'};
  var humidity=Number(value);
  if(humidity<30)return{label:'Dry',color:'#a9d3df'};
  if(humidity<=60)return{label:'Normal',color:'#8ac59b'};
  if(humidity<=70)return{label:'Humid',color:'#e2b161'};
  return{label:'High',color:'#e18d80'};
}

function vanTemperatureState(value,type){
  if(value===null||value===undefined)return{label:'No reading',color:'#a4a9a0',level:'caution'};
  if(type==='cabin'){
    if(value<15)return{label:'Cool',color:'#a9d3df',level:'context'};
    if(value>26)return{label:'Warm',color:'#e2b161',level:'caution'};
  }else{
    if(value<=2)return{label:'Cold concern',color:'#e18d80',level:'danger'};
    if(value<=5)return{label:'Cold',color:'#a9d3df',level:'caution'};
  }
  return{label:'Normal',color:'#8ac59b',level:'go'};
}

function getVanHealth(d){
  var v=d.vehicle||{},lpg=d.lpg&&d.lpg.current?d.lpg.current:null,issues=[];
  function add(level,message,key){issues.push({level:level,message:message,key:key});}
  var unavailable=homeTelemetryConfidence(v).state==='unavailable';
  if(v.systemAlert&&!v.systemAlert.includes('VAN SYSTEMS OK'))add('danger',v.systemAlert,'system');
  if(v.batteryV!==null&&v.batteryV!==undefined&&v.batteryV<12.4)add('danger','Battery is at '+v.batteryV+'V. Check the charging situation.','battery');
  var cabin=vanTemperatureState(v.cabinTempC,'cabin'),garage=vanTemperatureState(v.garageTempC,'garage');
  if(cabin.level==='caution'&&v.cabinTempC!==null&&v.cabinTempC!==undefined)add('caution','Cabin temperature is '+cabin.label.toLowerCase()+'.','cabin');
  if(garage.level!=='go'&&v.garageTempC!==null&&v.garageTempC!==undefined)add(garage.level,'Garage temperature is '+garage.label.toLowerCase()+'.','garage');
  if(lpg&&(lpg.alert==='CRITICAL'||lpg.alert==='LOW'))add(lpg.alert==='CRITICAL'?'danger':'caution',lpg.statusMsg||'LPG level is low. Consider a refill.','lpg');
  var level=issues.some(function(issue){return issue.level==='danger';})?'danger':issues.length?'caution':unavailable?'context':'go';
  var title=unavailable?'Vehicle telemetry unavailable':'Van&rsquo;s happy',copy=unavailable?'Current vehicle state cannot be confirmed.':'Everything looks normal.';
  if(issues.length===1){
    var issue=issues[0];
    if(issue.key==='battery'){title='Battery needs attention';copy=issue.message;}
    else if(issue.key==='lpg'){title='LPG needs attention';copy=issue.message;}
    else {title='Van needs attention';copy=issue.message;}
  }else if(issues.length>1){title=issues.length+' things need attention';copy='Review the items below before relying on the current vehicle state.';}
  return{level:level,title:title,copy:copy,issues:issues};
}

function buildVanView(d,fc){
  var v=d.vehicle||{},meta=d.meta||{},lpg=d.lpg&&d.lpg.current?d.lpg.current:null;
  var health=getVanHealth(d),telemetry=vanTelemetryInfo(v),scene=getVanScene(d);
  var battery=v.batteryV!==null&&v.batteryV!==undefined?v.batteryV+'V':'—';
  var cabin=vanTemperatureState(v.cabinTempC,'cabin'),garage=vanTemperatureState(v.garageTempC,'garage');
  var cabinHumidity=vanHumidityState(v.cabinHumidityPct),garageHumidity=vanHumidityState(v.garageHumidityPct);
  var tank=Number(fc&&fc.tankLitres),litres=lpg&&lpg.litres!==null&&lpg.litres!==undefined?Number(lpg.litres):null;
  var hasTank=isFinite(tank)&&tank>0,pct=hasTank&&litres!==null?Math.max(0,Math.min(100,Math.round(litres/tank*100))):null;
  var lpgLevel=lpg&&lpg.alert==='CRITICAL'?'danger':lpg&&lpg.alert==='LOW'?'caution':'go';
  var forecast=d.lpg&&d.lpg.forecast?d.lpg.forecast.filter(function(item){return item&&item.isFuture;}):[];
  var nextForecast=forecast[0],lastForecast=forecast[forecast.length-1];
  var location=meta.currentLocation||'Vehicle location';
  var map=v.lat&&v.lon?'https://maps.apple.com/?ll='+v.lat+','+v.lon+'&q=Audrey':'';
  var snapshotTimestamp=v.snapshotUpdatedAt||v.locationTimestamp;
  var timestamp=snapshotTimestamp&&!isNaN(new Date(snapshotTimestamp).getTime())?new Date(snapshotTimestamp).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Unavailable';
  var nextDrive=meta.nextDrive&&meta.nextDrive.distanceKm?calcFuel(meta.nextDrive.distanceKm,fc):null;
  var parts=[];

  parts.push('<div class="van-layout"><div class="van-support">');
