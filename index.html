// Audrey's European ski opportunity window runs from December through April.
function isSkiSeason(meta){
  meta=meta||{};
  var source=meta.tripStatus==='ACTIVE'?meta.updated:(meta.departDate||meta.updated);
  var date=source?new Date(source):new Date();
  var month=isNaN(date.getTime())?(new Date()).getMonth()+1:date.getUTCMonth()+1;
  return month===12||month<=4;
}

function getDoScene(d){
  var snow=d&&d.snowStatus;
  var mode=isSkiSeason(d&&d.meta)&&snow&&snow.resorts&&snow.resorts.length?'ski':'unknown';
  return getHomeScene(d||{},{mode:mode});
}

function doSceneStyle(scene){
  var style='--do-scene-position:'+scene.position+';--do-scene-position-tablet:'+scene.tabletPosition+';--do-scene-position-wide:'+scene.widePosition+';';
  if(scene.asset)style+='--do-scene-image:url(\''+scene.asset+'\');';
  return style;
}

function buildDoOpportunities(d){
  var meta=d&&d.meta||{},snow=d&&d.snowStatus,resorts=snow&&snow.resorts?snow.resorts:[];
  if(!isSkiSeason(meta))return '<div class="do-local-heading"><div class="do-ski-heading">Around your trip</div><div class="do-opportunity-status" id="do-local-context">PLANNING</div></div><div class="do-opportunities" id="do-local-opportunities"><div class="do-data-note"><strong>LOOKING NEARBY</strong><br>Finding a few worthwhile places around this trip’s main stop.</div></div><div class="do-local-attribution" id="do-local-attribution"></div>';
  if(!resorts.length)return '<div class="do-data-note"><strong>CHECK CONDITIONS</strong><br>Not enough current activity-specific data to rate an opportunity yet. Browse your saved routes or open an activity to analyse its GPX and route conditions.</div>';
  var groupOrder={go:0,possible:1,check:2,'not-today':3};
  // Stable sorting groups the existing configured collection without claiming
  // that snow depth or score creates an objective resort ranking.
  var assessed=resorts.map(function(resort,index){return{resort:resort,index:index,decision:getDoSkiDecision(resort)};});
  assessed.sort(function(a,b){return groupOrder[a.decision.level]-groupOrder[b.decision.level]||a.index-b.index;});
  return '<div class="do-ski-heading">Where to ski today</div><div class="do-opportunities">'
    +assessed.map(function(item){return buildDoSkiOpportunity(item.resort,item.index,item.decision);}).join('')+'</div>';
}

async function loadDoLocalPlaces(d){
  var meta=d&&d.meta||{};
  if(isSkiSeason(meta))return;
  var container=document.getElementById('do-local-opportunities');
  if(!container)return;
  var requestId=++doLocalPlacesRequest;
  try{
    var params=new URLSearchParams({action:'get_do_places',trip:meta.tripName||'',context:'now',_:Date.now()});
    var response=await fetch(API_URL+'?'+params.toString(),{redirect:'follow',headers:{'Accept':'application/json'}});
    if(!response.ok)throw new Error('HTTP '+response.status);
    var result=await response.json();
    if(requestId!==doLocalPlacesRequest||!document.getElementById('do-local-opportunities'))return;
    if(!result.success)throw new Error(result.error||'No local intelligence available');
    renderDoLocalPlaces(result);
  }catch(err){
    if(requestId!==doLocalPlacesRequest)return;
    container.innerHTML='<div class="do-data-note"><strong>LOCAL IDEAS UNAVAILABLE</strong><br>'+escapeDoHtml(err.message)+' Browse saved routes while Audrey tries again later.</div>';
  }
}

function renderDoLocalPlaces(result){
  var container=document.getElementById('do-local-opportunities');
  if(!container)return;
  var context=document.getElementById('do-local-context');
  if(context)context.textContent=(result.context&&result.context.mode==='planning'?'PLANNING · ':'NEAR · ')+(result.context&&result.context.label||'CURRENT STOP');
  var places=result.places||[];
  container.innerHTML=places.length?places.map(buildDoLocalPlace).join(''):'<div class="do-data-note"><strong>NOTHING STRONG ENOUGH YET</strong><br>Audrey found no well-supported local suggestions for this stop.</div>';
  var attribution=document.getElementById('do-local-attribution');

}

function buildDoLocalPlace(place){
  var category=String(place.category||'place');
  var group=String(place.group||'other');
  var groupLabels={mustSee:'MUST SEE',food:'FOOD & DRINK',outdoors:'OUTDOORS',practical:'PRACTICAL',other:'EXPLORE'};
  var labels={viewpoint:'VIEWPOINT',nature:'OUTDOORS',culture:'CULTURE',historic:'HISTORY',architecture:'SEE',food:'FOOD & DRINK',practical:'PRACTICAL',specialist:'SPECIALIST',place:'EXPLORE'};
  var evidence=[];
  if(place.distanceKm!==undefined&&place.distanceKm!==null)evidence.push(place.distanceKm+' km away');
  if(place.nearby&&place.nearby.walkingRoutes)evidence.push(place.nearby.walkingRoutes+' walking route'+(place.nearby.walkingRoutes===1?'':'s')+' nearby');
  if(place.nearby&&place.nearby.cyclingRoutes)evidence.push(place.nearby.cyclingRoutes+' cycle route'+(place.nearby.cyclingRoutes===1?'':'s')+' nearby');
  if(place.nearby&&place.nearby.parking)evidence.push('parking mapped nearby');
  if(place.nearby&&place.nearby.drinkingWater)evidence.push('drinking water mapped nearby');
  if(place.osm&&place.osm.cuisine)evidence.push(String(place.osm.cuisine).replace(/_/g,' '));
  var signals=[];
  if(place.sources&&place.sources.opentripmap)signals.push('Place detail');
  if(place.sources&&place.sources.osm)signals.push('OSM context');
  if(place.sources&&place.sources.wikimedia)signals.push('Wikimedia');
  if(place.access&&place.access.label)signals.unshift(place.access.label);
  var url=safeDoUrl(place.url||place.otmUrl||'');
  var image=safeDoUrl(place.image||'');
  var tag=url?'a':'div';
  var attrs=url?' href="'+escapeDoHtml(url)+'" target="_blank" rel="noopener"':'';
  return '<'+tag+' class="do-opportunity do-check do-local-place"'+attrs+' title="'+escapeDoHtml(place.access&&place.access.evidence||'')+'"><div class="do-local-place-main"><div class="do-opportunity-status">'+(groupLabels[group]||labels[category]||'EXPLORE')+'</div><div class="do-opportunity-title">'+escapeDoHtml(place.name||'Local place')+'</div>'
    +(place.summary?'<div class="do-opportunity-copy">'+escapeDoHtml(place.summary)+'</div>':'')
    +(evidence.length?'<div class="do-opportunity-when">'+escapeDoHtml(evidence.join(' · '))+(url?' · Open →':'')+'</div>':'')
    +(signals.length?'<div class="do-source-signals">'+signals.map(function(signal,index){var cls=index===0&&place.access?'do-access-signal do-access-'+escapeDoHtml(place.access.level||'unknown'):'do-source-signal';return '<span class="'+cls+'">'+escapeDoHtml(signal)+'</span>';}).join('')+'</div>':'')+'</div>'
    +(image?'<img class="do-local-place-image" src="'+escapeDoHtml(image)+'" alt="" loading="lazy" onerror="this.remove()">':'')+'</'+tag+'>';
}

function escapeDoHtml(value){
  return String(value===undefined||value===null?'':value).replace(/[&<>"']/g,function(char){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char];});
}

function safeDoUrl(value){
  try{var url=new URL(String(value||''));return url.protocol==='https:'?url.href:'';}catch(e){return '';}
}

// Only an explicit adverse resort signal can produce NOT TODAY. Missing or
// unparseable scores are deliberately neutral rather than treated as zero.
function getDoSkiDecision(resort){
  var text=[resort.status,resort.condition,resort.ssTagline,resort.fitment].filter(Boolean).join(' ').toLowerCase();
  var score=Number(resort.ssScore),hasScore=isFinite(score)&&score>0;
  var hasLiftStatus=resort.liftsOpen!==undefined&&resort.liftsOpen!==null&&resort.liftsOpen!=='';
  var liftsOpen=Number(resort.liftsOpen),hasOpenLifts=hasLiftStatus&&isFinite(liftsOpen)&&liftsOpen>0;
  var liftsTotal=Number(resort.liftsTotal),hasLiftTotal=isFinite(liftsTotal)&&liftsTotal>0;
  var hasRunStatus=resort.runsOpen!==undefined&&resort.runsOpen!==null&&resort.runsOpen!=='';
  var runsOpen=Number(resort.runsOpen),runsTotal=Number(resort.runsTotal);
  var noOpenLifts=hasLiftStatus&&hasLiftTotal&&isFinite(liftsOpen)&&liftsOpen===0;
  var noOpenRuns=hasRunStatus&&isFinite(runsTotal)&&runsTotal>0&&isFinite(runsOpen)&&runsOpen===0;
  var adverse=/\b(closed|closure|unsafe|storm|strong winds?|high winds?|not recommended|road closed|no skiing)\b/.test(text);
  var operationalText=/\b(resort|lifts?|skiing)\s+(?:is\s+)?open\b|\bopen\s+(?:resort|lifts?|skiing)\b/.test(text);
  var positive=/\b(clear|good|excellent|skiing conditions)\b/.test(text);
  var snowDepth=resort.snowDepthCm||resort.snowCm;
  var wind=Number(resort.topWindKh!==undefined?resort.topWindKh:resort.windKmh);
  var hasWind=isFinite(wind)&&wind>0;
  var defaultWhen='Open resort detail for the latest mountain conditions.';

  if(noOpenLifts||noOpenRuns)return{level:'not-today',status:'NOT TODAY',why:(snowDepth?snowDepth+'cm base, but ':'')+'the resort is not open for skiing yet.',when:defaultWhen};
  if(adverse)return{level:'not-today',status:'NOT TODAY',why:resort.ssTagline||resort.status||'An adverse resort condition is reported.',when:defaultWhen};
  if(!hasOpenLifts&&!operationalText)return{level:'check',status:'CHECK CONDITIONS',why:resort.ssTagline||'Operational resort status is not available in the current data.',when:defaultWhen};
  // These wind bands match the existing Snow detail's displayed wind semantics.
  if(hasWind&&wind>50)return{level:'not-today',status:'NOT TODAY',why:'Summit wind is '+wind+' km/h in the current resort data.',when:defaultWhen};
  if(hasWind&&wind>30)return{level:'possible',status:'POSSIBLE',why:(resort.ssTagline||'Resort conditions are available.')+' Summit wind is '+wind+' km/h.',when:defaultWhen};
  if(positive||hasScore&&score>=80)return{level:'go',status:'GO',why:resort.ssTagline||'Existing resort conditions look positive.',when:defaultWhen};
  if(hasScore&&score>=60)return{level:'possible',status:'POSSIBLE',why:resort.ssTagline||'Resort data supports skiing, with conditions to check.',when:defaultWhen};
  if(hasScore||snowDepth)return{level:'check',status:'CHECK CONDITIONS',why:resort.ssTagline||'Resort conditions look encouraging.',when:defaultWhen};
  return{level:'check',status:'CHECK CONDITIONS',why:'Current resort data is incomplete.',when:defaultWhen};
}

function buildDoSkiOpportunity(resort,index,decision){
  var evidence=[];
  if(resort.liftsOpen!==undefined&&resort.liftsOpen!==null&&resort.liftsTotal!==undefined&&resort.liftsTotal!==null)evidence.push(resort.liftsOpen+'/'+resort.liftsTotal+' lifts');
  if(resort.runsOpen!==undefined&&resort.runsOpen!==null&&resort.runsTotal!==undefined&&resort.runsTotal!==null)evidence.push(resort.runsOpen+'/'+resort.runsTotal+' runs');
  var depth=resort.snowDepthCm||resort.snowCm;
  if(depth)evidence.push(depth+'cm base');
  if(resort.ssScore!==undefined&&resort.ssScore!==null&&resort.ssScore!=='')evidence.push('Score '+resort.ssScore);
  if(resort.surfaceCondition)evidence.push(resort.surfaceCondition);
  return '<button class="do-opportunity do-'+decision.level+'" type="button" onclick="openDoSkiResort('+index+')"><div class="do-opportunity-status">'+decision.status+'</div><div class="do-opportunity-title">'+(resort.name||'Ski area')+'</div>'
    +(evidence.length?'<div class="do-opportunity-copy">'+evidence.join(' · ')+'</div>':'')
    +'<div class="do-opportunity-when">'+decision.why+' · View resort →</div></button>';
}

  }).join('');
}

function formatDoActivityType(type){
  if(!type)return'';
  var value=String(type).toLowerCase();
  if(value==='hiking'||value==='trail')return'Hiking';

}

function routeMatchesActivityFilter(route,filter,type){
  if(filter==='all')return true;
  var values=[route.type,route.activityType,route.activityTypes,route.difficulty,route.tags].filter(Boolean).join(' ').toLowerCase();
  if(filter==='easy'||filter==='moderate')return values.indexOf(filter)!==-1;
  if(filter==='hiking')return /hiking|walk|trail|foot/.test(values);
  if(filter==='mtb')return /\bmtb\b|mountain.?bik|cycling:mountain/.test(values);
  if(filter==='gravel')return /gravel/.test(values);
  if(filter==='cycling')return !/gravel|\bmtb\b|mountain.?bik|cycling:mountain/.test(values)&&/cycling|road.?cycl|road bike/.test(values);
  return type==='trail'?/hiking|walk|trail|foot/.test(values):/cycling|road|gravel|mtb|mountain.?bik/.test(values);
}

function activityFilterLabel(filter){
  return {hiking:'walking',mtb:'MTB',cycling:'road',gravel:'gravel',easy:'easy',moderate:'moderate'}[filter]||filter;
}
 
// ── Discover routes via Overpass ──────────────────────────
async function discoverOverpassRoutes(lat, lon, osmType) {
  try {
        var query = osmType === 'hiking'
      ? '[out:json][timeout:20];(relation["route"="hiking"](around:25000,' + lat + ',' + lon + ');relation["route"="foot"](around:25000,' + lat + ',' + lon + '););out body;'
      : '[out:json][timeout:20];relation["route"="' + osmType + '"](around:25000,' + lat + ',' + lon + ');out body;';
        // Try twice — Overpass occasionally times out
    var r;
    try {
      r = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        signal: AbortSignal.timeout(15000)
      });
    } catch(e) {
      // Retry once after 2 seconds
      await new Promise(function(res){ setTimeout(res, 2000); });
      r = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        signal: AbortSignal.timeout(15000)
      });
    }
    if (!r.ok) return [];
    var data = await r.json();
    return (data.elements || [])
      .filter(function(el){ return el.tags && (el.tags.name || el.tags.ref); })
      .map(function(el){
        return {
          id:         el.id,
          name:       el.tags.name || ('Route ' + el.tags.ref),
          network:    el.tags.network || '',
          distanceKm: el.tags.distance ? Math.round(parseFloat(el.tags.distance)) : null,
          source:     'overpass'
        };
      })
      .slice(0, 8);
  } catch(e) {
    return [];
  }
}

// ── Fetch + reconstruct GPX from Overpass ─────────────────
async function fetchOverpassGPX(osmId) {
  var r = await fetch('https://overpass-api.de/api/interpreter', {
    method: 'POST',
    body: 'data=' + encodeURIComponent('[out:json];relation(' + osmId + ');out geom;')
  });
  var data = await r.json();
  var el   = data.elements && data.elements[0];
  if (!el) return null;
 
  var members = (el.members || []).filter(function(m){
    return m.geometry && m.geometry.length > 0 && m.role !== 'guideposts';
  });
 
  var ordered = chainOrderWays(members);
 
  var seen = new Set();
  var points = [];
  ordered.forEach(function(p){
    var key = p.lat.toFixed(5) + ',' + p.lon.toFixed(5);
    if (!seen.has(key)){ seen.add(key); points.push(p); }
  });
 
  var name = el.tags && el.tags.name ? el.tags.name : 'Route ' + osmId;
  var gpx  = '<?xml version="1.0" encoding="UTF-8"?>'
    + '<gpx version="1.1" creator="Audrey" xmlns="http://www.topografix.com/GPX/1/1">'
    + '<trk><name>' + name + '</name><trkseg>';
  points.forEach(function(p){ gpx += '<trkpt lat="' + p.lat + '" lon="' + p.lon + '"></trkpt>'; });
  gpx += '</trkseg></trk></gpx>';
  return gpx;
}
 
// ── Chain-order Overpass ways into continuous track ───────
function chainOrderWays(members) {
  if (!members.length) return [];
  var remaining = members.slice();
  var ordered   = remaining.shift().geometry.slice();
  var max       = remaining.length * 2;
  var iter      = 0;
  while (remaining.length > 0 && iter < max) {
    iter++;
    var endPt   = ordered[ordered.length-1];
    var startPt = ordered[0];
    var found   = false;
    for (var i = 0; i < remaining.length; i++) {
      var way    = remaining[i];
      var wStart = way.geometry[0];
      var wEnd   = way.geometry[way.geometry.length-1];
      if (ptDist(endPt,wStart) < 0.001){ ordered = ordered.concat(way.geometry.slice(1)); remaining.splice(i,1); found=true; break; }
      if (ptDist(endPt,wEnd)   < 0.001){ ordered = ordered.concat(way.geometry.slice(0,-1).reverse()); remaining.splice(i,1); found=true; break; }
      if (ptDist(startPt,wEnd) < 0.001){ ordered = way.geometry.concat(ordered.slice(1)); remaining.splice(i,1); found=true; break; }
      if (ptDist(startPt,wStart) < 0.001){ ordered = way.geometry.slice().reverse().concat(ordered.slice(1)); remaining.splice(i,1); found=true; break; }
    }
    if (!found) ordered = ordered.concat(remaining.shift().geometry);
  }
  return ordered;
}
function ptDist(a,b){ return Math.sqrt(Math.pow(a.lat-b.lat,2)+Math.pow(a.lon-b.lon,2)); }
 
// ── Activity GPX analysis state ───────────────────────────
// Parse raw XML once, then retain the parsed geometry and selected timing.
// Reanalysis must never feed a parsed object back into parseGPX().
async function actAnalyseGPXContent(gpxText, routeName, type) {
  var gpx = parseGPX(gpxText);
  if (!gpx) { showActError(type, 'Could not parse GPX'); return; }
  var initialSettings=type==='cycle'&&doCyclingOverview&&doCyclingOverview.settings
    ?doCyclingOverview.settings:getActivityDefaultSettings(type);
  actSelectedRoute={
    name:routeName||gpx.name,type:type,gpx:gpx,rawGpx:gpxText,
    settings:initialSettings,segments:[]
  };
  return runActiveActivityAnalysis(type);
}

function getActivityDefaultSettings(type){
  var now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate(),7,0,0);
  if(start<=now)start.setDate(start.getDate()+1);
  return {
    startDate:start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0'),
    startTime:'07:00',flatSpeed:type==='cycle'?30:type==='mtb'?15:4,
    climbSpeed:type==='cycle'?10:type==='mtb'?8:2
  };
}

function getActivitySettingsFromControls(type){
  var route=actSelectedRoute,settings=Object.assign({},route&&route.settings||getActivityDefaultSettings(type));
  function value(id){var el=document.getElementById(id);return el?el.value:'';}
  if(type==='cycle'||type==='mtb'){
    settings.flatSpeed=parseFloat(value('act-flat-speed'))||settings.flatSpeed;
    settings.climbSpeed=parseFloat(value('act-climb-speed'))||settings.climbSpeed;
  }else{
    settings.flatSpeed=parseFloat(value('act-walk-speed'))||settings.flatSpeed;
  }
  settings.startDate=value('act-start-date')||settings.startDate;
  settings.startTime=value('act-start-time')||settings.startTime;
  return settings;
}

function activityStartDateTime(settings){
  var date=(settings.startDate||'').split('-'),time=(settings.startTime||'07:00').split(':');
  if(date.length===3)return new Date(Number(date[0]),Number(date[1])-1,Number(date[2]),Number(time[0])||0,Number(time[1])||0,0);
  return new Date();
}

function trimActivitySegments(segments){
  if(segments.length<=10)return segments;
  var start=segments[0],finish=segments[segments.length-1];
  var middle=segments.slice(1,-1).sort(function(a,b){return b.ele-a.ele;}).slice(0,8);
  middle.sort(function(a,b){return a.distanceKm-b.distanceKm;});
  return [start].concat(middle).concat([finish]);
}

async function runActiveActivityAnalysis(type){
  var route=actSelectedRoute;
  if(!route||!route.gpx)return;
  var settings=getActivitySettingsFromControls(type);
  var startDt=activityStartDateTime(settings);
  var segments=trimActivitySegments(detectSegments(route.gpx,startDt,settings.flatSpeed,settings.climbSpeed));
  route.settings=settings;
  route.segments=segments;
  showActLoading(type,'Fetching weather for '+segments.length+' segments...');
  try{
    var trimmed=segments.map(function(s){return{lat:s.lat,lon:s.lon,ele:s.ele,distanceKm:s.distanceKm,etaISO:s.etaISO,etaStr:s.etaStr,type:s.type,bearing:s.bearing||0};});
    var params=new URLSearchParams({action:'analyse_gpx',segments:JSON.stringify(trimmed),routeName:route.name,totalKm:route.gpx.totalKm,totalEleM:route.gpx.totalEleM,_:Date.now()});
    var r=await fetch(API_URL+'?'+params.toString(),{redirect:'follow'}),data=await r.json();
    if(!data.success)throw new Error(data.error||'Analysis failed');
    actAnalysisResults=data;
    renderActAnalysis(type,data,segments);
    enrichSegmentNames(segments);
  }catch(err){showActError(type,'Analysis failed: '+err.message);}
}
 
// ── Render analysis results ───────────────────────────────
function renderActAnalysis(type, data, segments) {
  var screen = document.getElementById('act-screen-' + type);
  if (!screen) return;
  // Modern Cycling Conditions owns timing and speed controls in its route
  // panel. Its embedded legacy analysis is evidence-only to avoid duplicate IDs.
  var detailOnly=type==='cycle'&&currentDoSubview==='detail';
  var settings=actSelectedRoute&&actSelectedRoute.settings?actSelectedRoute.settings:getActivityDefaultSettings(type);
 
  var segs      = data.segments || [];
  var riskColor = data.routeRisk === 'danger'  ? 'var(--danger)'
                : data.routeRisk === 'caution' ? 'var(--caution)'
                : 'var(--go)';
  var riskLabel = data.routeRisk === 'danger'  ? 'NOT IDEAL'
                : data.routeRisk === 'caution' ? 'CAUTION'
                : 'GO';
  var riskLevel = data.routeRisk === 'danger' ? 'danger' : data.routeRisk === 'caution' ? 'caution' : 'go';
  var accentColor = type === 'cycle' ? 'var(--frost)' : '#4a7c3f';
  var analyseBtn  = type === 'cycle' ? 'act-btn-cycle' : 'act-btn-trail';
 
  var html = '<div class="act-analysis-back" onclick="actBackToDiscovery(\'' + type + '\')">'
    + '<span style="color:var(--frost)">←</span>'
    + '<span class="act-analysis-back-lbl">Back to routes</span>'
    + '</div>'
    // Route header
    + '<div class="act-analysis-header">'
    + '<div class="act-analysis-title">' + data.routeName + '</div>'
    + '<div class="act-analysis-facts">'
    + '<div class="act-analysis-fact"><strong style="color:' + accentColor + '">' + data.totalKm + '</strong>km</div>'
    + '<div class="act-analysis-fact"><strong style="color:' + accentColor + '">' + (data.totalEleM||0).toLocaleString() + '</strong>metres</div>'
    + '<div class="act-analysis-fact"><strong style="color:' + accentColor + '">' + segs.length + '</strong>segments</div>'
    + '</div></div>'
    // Risk banner
    + '<div class="act-analysis-decision ' + riskLevel + '">' + riskLabel + '</div>';
 
  // Settings row
  if (!detailOnly && type === 'cycle') {
    html += '<div class="act-settings-row">'
      + '<div class="act-setting"><span class="act-setting-lbl">Flat speed (km/h)</span>'
      + '<input class="act-setting-input" type="number" id="act-flat-speed" value="'+settings.flatSpeed+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '<div class="act-setting"><span class="act-setting-lbl">Climb speed (km/h)</span>'
      + '<input class="act-setting-input" type="number" id="act-climb-speed" value="'+settings.climbSpeed+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '<div class="act-setting"><span class="act-setting-lbl">Start date</span>'
      + '<input class="act-setting-input" type="date" id="act-start-date" value="'+settings.startDate+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '<div class="act-setting"><span class="act-setting-lbl">Start time</span>'
      + '<input class="act-setting-input" type="time" id="act-start-time" value="'+settings.startTime+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '</div>';
  } else if (!detailOnly) {
    html += '<div class="act-settings-row">'
      + '<div class="act-setting"><span class="act-setting-lbl">Walking pace (km/h)</span>'
      + '<input class="act-setting-input" type="number" id="act-walk-speed" value="'+settings.flatSpeed+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '<div class="act-setting"><span class="act-setting-lbl">Start date</span>'
      + '<input class="act-setting-input" type="date" id="act-start-date" value="'+settings.startDate+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '<div class="act-setting"><span class="act-setting-lbl">Start time</span>'
      + '<input class="act-setting-input" type="time" id="act-start-time" value="'+settings.startTime+'" onchange="actReanalyse(\'' + type + '\')"></div>'
      + '</div>';
  }
 
  // Segments
  html += '<div>';
  segs.forEach(function(seg, idx) {
    var riskIcon = seg.overallRisk === 'danger'  ? '!'
                 : seg.overallRisk === 'caution' ? '•'
                 : seg.type === 'finish'         ? '🏁'
                 : seg.type === 'start'          ? (type==='cycle'?'🚴':'🥾')
                 : '•';
    var segName  = seg.segName || (seg.type === 'start' ? 'Start' : seg.type === 'finish' ? 'Finish' : seg.ele + 'm');
 
    html += '<div class="act-seg" onclick="toggleActSeg(\'as' + idx + '\')">'
      + '<div class="act-seg-head">'
      + '<div class="act-seg-km">km ' + seg.distanceKm + '</div>'
      + '<div class="act-seg-left">'
      + '<div class="act-seg-name" data-seg-idx="' + idx + '">' + segName + '</div>'
      + '<div class="act-seg-alt">' + seg.ele + 'm · ETA ' + seg.etaStr
      + (seg.crosswindAngle > 45 && seg.crosswindAngle < 135 && seg.windKmh > 25 ? ' · Crosswind' : '')
      + '</div>'
      + '</div>'
      + '<div class="act-seg-right">'
      + '<span style="font-size:11px;color:var(--text-dim)">' + (seg.tempC !== null ? seg.tempC + '°' : '') + '</span>'
      + '<span style="font-size:17px">' + riskIcon + '</span>'
      + '</div></div>'
      + '<div class="act-seg-body" id="as' + idx + '">';
 
    if (seg.error) {
        html += '<div class="act-alert act-a-warn">Weather is not available for this point.</div>';
    } else {
      html += '<div class="act-wx-grid">'
        + '<div class="act-wx-item"><div class="act-wx-lbl">Temp</div>'
        + '<div class="act-wx-val" style="color:' + (seg.tempC > 28 ? 'var(--caution)' : seg.tempC < 5 ? 'var(--frost)' : 'var(--text)') + '">'
        + (seg.tempC !== null ? seg.tempC + '°C' : '—') + '</div></div>'
        + '<div class="act-wx-item"><div class="act-wx-lbl">Wind</div>'
        + '<div class="act-wx-val" style="color:' + (seg.windKmh > 35 ? 'var(--danger)' : seg.windKmh > 20 ? 'var(--caution)' : 'var(--go)') + '">'
        + seg.windKmh + 'km/h</div>'
        + '<div style="font-size:9px;color:var(--text-muted)">' + windDegToArrow(seg.windDeg) + ' ' + (seg.windDeg||0) + '°</div></div>'
        + '<div class="act-wx-item"><div class="act-wx-lbl">Rain</div>'
        + '<div class="act-wx-val" style="color:' + (seg.precipProb > 60 ? 'var(--danger)' : seg.precipProb > 30 ? 'var(--caution)' : 'var(--go)') + '">'
        + seg.precipProb + '%</div></div>'
        + '</div>'
        + '<div style="font-size:11px;color:var(--text-dim);margin-bottom:7px">' + (seg.condition||'') + '</div>';
 
      if (seg.risks && seg.risks.length) {
        seg.risks.forEach(function(r){
          var cls = r.type === 'storm' ? 'act-a-danger'
                  : r.type === 'wind'  ? 'act-a-warn'
                  : r.type === 'heat'  ? 'act-a-warn'
                  : 'act-a-warn';
          html += '<div class="act-alert ' + cls + '">' + r.label + '</div>';
        });
      } else {
        html += '<div class="act-alert act-a-ok">Clear conditions</div>';
      }
    }
    html += '</div></div>';
  });
  html += '</div>';
 
    // Hiking intelligence
  if (type === 'trail') {
    // Exposed time — time above 600m
    var exposedMins = 0;
    if (segs.length > 1) {
      for (var ei = 0; ei < segs.length - 1; ei++) {
        if (segs[ei].ele > 600) {
          var etaA = new Date(actSelectedRoute.segments[ei].etaISO);
          var etaB = new Date(actSelectedRoute.segments[ei+1].etaISO);
          exposedMins += (etaB - etaA) / 60000;
        }
      }
    }
    var exposedStr = exposedMins > 0
      ? Math.floor(exposedMins/60) + 'h ' + Math.round(exposedMins%60) + 'm'
      : '—';

    html += '<div class="act-intel-grid">'
    + '<div class="act-intel-cell"><div class="act-intel-val">' + (segs[0]&&segs[0].sunrise||'—') + '</div><div class="act-intel-lbl">Sunrise</div></div>'
    + '<div class="act-intel-cell"><div class="act-intel-val">' + (segs[0]&&segs[0].sunset||'—') + '</div><div class="act-intel-lbl">Sunset</div></div>'
      + '<div class="act-intel-cell"><div class="act-intel-val act-intel-val" style="color:var(--go)">Low</div><div class="act-intel-lbl">Lightning</div></div>'
      + '<div class="act-intel-cell"><div class="act-intel-val">' + exposedStr + '</div><div class="act-intel-lbl">Exposed time</div></div>'
      + '</div>';
  }
 
  // Alert GPX
  var hasAlerts = segs.some(function(s){ return s.overallRisk && s.overallRisk !== 'ok'; });
  if (hasAlerts) {
    html += '<div class="act-gpx-card">'
      + '<div class="act-gpx-title">Alert GPX ready for Garmin</div>'
      + '<div style="font-size:11px;color:var(--text-dim);margin-bottom:8px">Waypoint alerts at risk segments — sync overnight.</div>'
      + '<button class="act-btn ' + analyseBtn + '" onclick="actDownloadGPX()">Download alert GPX</button>'
      + '</div>';
  } else {
    html += '<div style="padding:10px 14px;font-size:11px;color:var(--go)">No alerts — conditions clear throughout</div>';
  }
 
  if(detailOnly){
    renderDoCyclingConditions(data,segments,html);
    return;
  }
  screen.innerHTML = html;
}

function renderDoCyclingConditions(data,segments,legacyHtml){
  var panel=document.querySelector('.do-route-panel');
  if(!panel)return;
  var risk=data.routeRisk==='danger'?'danger':data.routeRisk==='caution'?'caution':'go';
  var label=risk==='danger'?'NOT IDEAL':risk==='caution'?'CAUTION':'GO';
  var evidence=(data.segments||[]).reduce(function(all,seg){return all.concat((seg.risks||[]).map(function(item){return item.label;}));},[]);
  var copy=evidence[0]|| (risk==='go'?'Conditions are clear across the available route checks.':'Review the available route conditions before leaving.');
  var start=segments[0],finish=segments[segments.length-1],duration=start&&finish?Math.round((new Date(finish.etaISO)-new Date(start.etaISO))/60000):0;
  var points=(data.segments&&data.segments.length?data.segments:segments).filter(function(seg,i,list){return seg.type==='start'||seg.type==='finish'||(seg.type==='summit'&&i<list.length-1);}).slice(0,4);
  panel.innerHTML='<header class="do-head"><button class="do-browse-back" type="button" onclick="returnToDoCyclingOverview()">← Route overview</button><div class="do-eyebrow">Audrey · Route conditions</div></header><section class="do-route-card"><div class="do-route-name">'+(actSelectedRoute.name||'Saved ride')+'</div>'
    +'<div class="do-route-conclusion '+risk+'"><div class="do-route-status">'+label+'</div><div class="do-route-copy">'+copy+'</div></div>'
    +'<div class="do-route-facts"><span><strong>'+data.totalKm+' km</strong>Distance</span><span><strong>'+(data.totalEleM||0).toLocaleString()+' m</strong>Ascent</span><span><strong>'+(duration?fmtDuration(duration):'—')+'</strong>Estimated ride</span><span><strong>'+((actSelectedRoute.settings||{}).startTime||'—')+'</strong>Start</span></div>'
    +buildDoCyclingSetup(actSelectedRoute.settings,'Update conditions',"actReanalyse('cycle')")
    +'<div class="do-route-progress">'+points.map(function(point){var title=point.type==='start'?'Start':point.type==='finish'?'Finish':point.segName||'Key climb';return '<div class="do-route-point"><div class="do-route-point-type">'+(point.type||'route point')+'</div><div class="do-route-point-title">'+title+'</div><div class="do-route-point-meta">'+(point.etaStr||'—')+(point.tempC!==undefined?' · '+point.tempC+'°':'')+(point.windKmh?' · '+point.windKmh+' km/h wind':'')+(point.crosswindAngle>45&&point.crosswindAngle<135?' · crosswind':'')+'</div></div>';}).join('')+'</div>'
    +'<details class="do-route-details"><summary>Full route analysis</summary>'+legacyHtml+'</details></section>';
  showDoSubview('.do-route-panel');
}
 
// ── Helpers ───────────────────────────────────────────────
function toggleActSeg(id) {
  var body = document.getElementById(id);
  if (!body) return;
  var open = body.classList.contains('open');
  document.querySelectorAll('.act-seg-body').forEach(function(b){ b.classList.remove('open'); });
  if (!open) body.classList.add('open');
}
 
function actBackToDiscovery(type) {
  var screen = document.getElementById('act-screen-' + type);
  if (!screen) return;
  screen.innerHTML = buildActDiscovery(type, currentData&&currentData.meta ? currentData.meta.currentLocation : '', currentData);
  loadActRoutes(currentData&&currentData.meta ? currentData.meta.currentLocation : '', type);
}
 
function showActLoading(type, msg) {
  var screen = document.getElementById('act-screen-' + type);
  if (screen) screen.innerHTML = '<div class="act-loading">⏳ ' + msg + '</div>';
}
 
function showActError(type, msg) {
  var screen = document.getElementById('act-screen-' + type);
  if (screen) screen.innerHTML = '<div class="act-loading" style="color:var(--danger)">❌ ' + msg + '</div>'
    + '<div class="act-upload-row" onclick="actBackToDiscovery(\'' + type + '\')">← Back to routes</div>';
}
 
function actUploadGPX(type) {
  // Trigger file input — reuse existing cycling file input
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.gpx';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      actAnalyseGPXContent(ev.target.result, file.name.replace('.gpx',''), type);
    };
    reader.readAsText(file);
  };
  input.click();
}
 
function actDownloadGPX() {
  if (!actAnalysisResults || !actSelectedRoute) return;
  var enriched = actSelectedRoute.segments.map(function(seg, i) {
    return Object.assign({}, seg, actAnalysisResults.segments[i] || {});
  });
  var gpxContent = generateAlertGPX(actAnalysisResults.routeName, enriched);
  if (!gpxContent) { alert('No risk alerts — no GPX needed'); return; }
  var blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = (actAnalysisResults.routeName||'route').replace(/\s+/g,'-') + '-alerts.gpx';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
}
 
function filterAct(el, filter, type) {
  var bar=el.closest('.act-filter-bar');
  if(bar)bar.querySelectorAll('.act-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  actCurrentFilter = filter;
  actCurrentFilters[type]=filter;
  var collection=actRouteCollections[type],container=document.getElementById('act-routes-'+type);
  if(collection&&container)renderActRouteList(container,collection.curated,collection.overpass,type,collection.rwgps,'',false);
}
 
function actReanalyse(type) {
  if(actSelectedRoute&&actSelectedRoute.type===type)runActiveActivityAnalysis(type);
}
 
// ── Ski screen ────────────────────────────────────────────
function buildSkiScreen(snow, meta) {

    return '<div style="padding:20px 14px;text-align:center;font-size:12px;color:var(--text-muted)">'

function switchSkiResort(idx, el) {

function buildWaterScreen(d) {

          : d && d.meta && d.meta.currentLocationCoords ? d.meta.currentLocationCoords.lat
          : null;
  var lon = d && d.vehicle && d.vehicle.lon ? d.vehicle.lon
          : d && d.meta && d.meta.currentLocationCoords ? d.meta.currentLocationCoords.lon
          : null;

  // Check if near coast — rough check using weather data or just show loading

    + '</div>';
}
 
// ── 5. Load marine data ───────────────────────────────────
async function loadMarineData(lat, lon, location) {
  console.log('loadMarineData called, lat:', lat, 'lon:', lon);
  var container = document.getElementById('act-water-content');
  console.log('container found:', !!container);
  if (!container) return;
 
  if (!lat || !lon) {
    container.innerHTML = '<div class="water-inland">'
      + '<div style="font-size:24px;margin-bottom:6px">🌊</div>'
      + '<div style="font-weight:600;margin-bottom:4px">No coastal location</div>'
      + '<div>Marine data is available at coastal locations.<br>Currently at ' + (location||'inland location') + '.</div>'
      + '</div>';
    return;
  }
 
  try {
    var params = new URLSearchParams({
      action: 'get_marine',
      lat:    lat,
      lon:    lon,
      _:      Date.now()
    });
    var r    = await fetch(API_URL + '?' + params.toString(), { redirect: 'follow' });
    var data = await r.json();
 
    if (!data.success) throw new Error(data.error || 'Marine data unavailable');
 
    renderMarineData(container, data, location);
 
  } catch(err) {
    container.innerHTML = '<div class="water-inland">⚠️ Could not load marine data: ' + err.message + '</div>';
  }
}
 
// ── 6. Render marine data ─────────────────────────────────
function renderMarineData(container, data, location) {
  var cur      = data.current || {};
  var extremes = data.extremes || [];
  var suit     = data.suitability || {};
  var hasTides = extremes.length > 0;
  var hasMarine = data.marineAvailable === true || [
    cur.waveHeight,cur.waveDir,cur.wavePeriod,cur.swellHeight,
    cur.swellDir,cur.currentKnots,cur.currentDir,cur.waterTempC
  ].some(function(value){return value!==null&&value!==undefined;});

  if (!hasTides && !hasMarine) {
    container.innerHTML = '<div class="water-inland">'
      + '<div style="font-size:24px;margin-bottom:6px">🌊</div>'
      + '<div style="font-weight:600;margin-bottom:4px">No coastal readings for ' + escapeDoHtml(location||'this location') + '</div>'
      + '<div>Tides, waves, swell and water temperature will appear when Audrey has a coastal location.</div>'
      + '</div>';
    return;
  }

  var tideIcon = data.tideState === 'Rising' ? '↑' : '↓';
  var tideColor = data.tideState === 'Rising' ? 'var(--go)' : 'var(--caution)';
  var nextExt = data.nextExtreme;
  var nextStr = '';
  if (nextExt) {
    var nextTime = new Date(nextExt.date).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
    nextStr = nextExt.type + ' ' + nextTime + ' (' + Math.abs(nextExt.height).toFixed(1) + 'm)';
  }

  var html = ''
    + '<div style="padding:8px 14px;background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">'
    + '<div><div style="font-size:11px;font-weight:600">📍 ' + escapeDoHtml(location||'Current location') + '</div>'
    + (hasTides?'<div style="font-size:10px;color:var(--text-muted)">Station: ' + escapeDoHtml(data.station||'Nearest port') + '</div>':'') + '</div>'
    + '<div style="font-size:10px;color:var(--text-muted)">Open-Meteo · WorldTides</div>'
    + '</div>';

  if (hasTides) {
    html += '<div style="padding:8px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">'
      + '<div style="font-family:var(--ui);font-size:14px;font-weight:700;color:' + tideColor + '">' + tideIcon + ' Tide ' + (data.tideState||'—') + '</div>'
      + '<div style="font-size:11px;color:var(--text-muted)">Next: ' + nextStr + '</div></div>'
      + '<div class="tide-strip">';
    extremes.slice(0, 6).forEach(function(ex) {
      var exDate = new Date(ex.date);
      var exTime = exDate.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
      var exDay = exDate.toLocaleDateString('en-GB', {weekday:'short'});
      var isNext = data.nextExtreme && ex.dt === data.nextExtreme.dt;
      var isHigh = ex.type === 'High';
      html += '<div class="tide-row' + (isNext?' tide-now':'') + '"><span class="tide-time">' + exTime + '</span>'
        + '<span style="font-size:10px;color:var(--text-muted)">' + exDay + '</span>'
        + '<span class="tide-type" style="color:' + (isHigh?'var(--frost)':'var(--text-muted)') + '">' + (isHigh?'↑ High':'↓ Low') + '</span>'
        + '<span class="tide-height" style="color:' + (isHigh?'var(--frost)':'var(--text-muted)') + '">' + Math.abs(ex.height).toFixed(1) + 'm</span>'
        + (isNext?'<span style="font-size:9px;background:var(--bg3);padding:1px 5px;border-radius:3px">Next</span>':'<span></span>') + '</div>';
    });
    html += '</div>';
  } else {
    html += '<div class="water-inland">Tide times are not currently available for this location.</div>';
  }

  function waterReading(value,suffix){return value===null||value===undefined?'—':value+(suffix||'');}
  if (hasMarine) {
    var waveArrow = cur.waveDir===null||cur.waveDir===undefined?'':windDegToArrow(cur.waveDir);
    html += '<div class="water-strip">'
      + '<div class="water-cell"><div class="water-val" style="color:' + (cur.waveHeight > 1.5?'var(--danger)':cur.waveHeight > 0.5?'var(--caution)':'var(--go)') + '">' + waterReading(cur.waveHeight,'m') + '</div><div class="water-label">Wave height</div><div class="water-sub">' + waveArrow + ' ' + waterReading(cur.waveDir,'°') + ' · ' + waterReading(cur.wavePeriod,'s') + '</div></div>'
      + '<div class="water-cell"><div class="water-val" style="color:var(--frost)">' + waterReading(cur.swellHeight,'m') + '</div><div class="water-label">Swell</div><div class="water-sub">' + (cur.swellDir===null||cur.swellDir===undefined?'':windDegToArrow(cur.swellDir)) + ' ' + waterReading(cur.swellDir,'°') + '</div></div>'
      + '<div class="water-cell"><div class="water-val">' + waterReading(cur.currentKnots,' kt') + '</div><div class="water-label">Current</div><div class="water-sub">' + (cur.currentDir===null||cur.currentDir===undefined?'':windDegToArrow(cur.currentDir)) + ' ' + waterReading(cur.currentDir,'°') + '</div></div>'
      + '<div class="water-cell"><div class="water-val" style="color:var(--frost)">' + waterReading(cur.waterTempC,'°C') + '</div><div class="water-label">Water temp</div><div class="water-sub">&nbsp;</div></div></div>';

    if (Object.keys(suit).length) {
      html += '<div class="suit-grid">';
      [{key:'swimming',icon:'🏊',label:'Swimming'},{key:'kayaking',icon:'🚣',label:'Kayaking'},{key:'sup',icon:'🏄',label:'SUP'},{key:'surfing',icon:'🌊',label:'Surfing'}].forEach(function(act) {
        var status=suit[act.key]||'caution';
        var cls=status==='good'?'suit-good':status==='poor'?'suit-poor':'suit-caution';
        var label=status==='good'?'✅ Good':status==='poor'?'🔴 Poor':'⚠️ Caution';
        html += '<div class="suit-cell"><span class="suit-activity">'+act.icon+' '+act.label+'</span><span class="suit-status '+cls+'">'+label+'</span></div>';
      });
      html += '</div>';
    }
  } else {
    html += '<div class="water-inland">Wave, swell, current and water temperature data are unavailable at this inland location.</div>';
  }

  html += (data.waveMaxToday!==null&&data.waveMaxToday!==undefined ? '<div style="padding:8px 14px;font-size:11px;color:var(--text-muted);border-top:1px solid var(--border)">'
      + 'Max wave today: <strong>' + data.waveMaxToday + 'm</strong>'
      + (data.waveMaxToday > 2 ? ' · 🔴 Rough conditions' : data.waveMaxToday > 1 ? ' · ⚠️ Moderate' : ' · ✅ Calm')
      + '</div>' : '');

  container.innerHTML = html;
}

async function actSelectRWGPS(routeId, type) {
  showActLoading(type, 'Fetching route from RideWithGPS...');
  try {
    var params = new URLSearchParams({
      action:  'get_ridewithgps_gpx',
      routeId: routeId,
      _:       Date.now()
    });
    var r    = await fetch(API_URL + '?' + params.toString(), { redirect: 'follow' });
    var data = await r.json();
    if (!data.success || !data.gpx) throw new Error(data.error || 'No GPX');
    var route = (window._actRWGPS || []).find(function(r){ return r.id === routeId; });
    actAnalyseGPXContent(data.gpx, route ? route.name : 'RideWithGPS route', type);
  } catch(err) {
    showActError(type, 'Could not fetch route: ' + err.message);
  }
}

async function runAllModulesNow() {
  var btn    = document.querySelector('[onclick="runAllModulesNow()"]');
  var status = document.getElementById('runAllStatus');
  if (btn) btn.textContent = '⏳ Running...';
  if (status) status.textContent = 'Running all modules — this may take 30-60 seconds...';
  try {
    var r = await fetch(API_URL + '?action=run_all_modules&_=' + Date.now(), { redirect: 'follow' });
    var d = await r.json();
    if (btn) btn.textContent = '⚙️ Run all modules now';
    if (status) status.textContent = d.success ? '✅ Done — tap Refresh to see updates' : '❌ ' + (d.error || 'Failed');
  } catch(err) {
    if (btn) btn.textContent = '⚙️ Run all modules now';
    if (status) status.textContent = '❌ ' + err.message;
  }
}

function toggleEnRoute(viewId) {
  var suffix=viewId||'drive';
  var wp  = document.getElementById('enroute-waypoints-'+suffix);
  var ch  = document.getElementById('enroute-chevron-'+suffix);
  if (!wp) return;
  var open = wp.style.display !== 'none';
  wp.style.display = open ? 'none' : 'block';
  if (ch) ch.textContent = open ? '›' : '↓';
}

refresh();
</script>
</body>
</html>
