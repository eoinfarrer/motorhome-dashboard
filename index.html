    +'<div class="van-metric"><div class="van-metric-value" style="color:'+cabin.color+'">'+(v.cabinTempC!==null&&v.cabinTempC!==undefined?v.cabinTempC+'&deg;':'—')+'</div><div class="van-metric-label">Cabin temperature</div><div class="van-metric-status">'+cabin.label+(vanReadingAge(v.cabinTempTimestamp)?' · '+vanReadingAge(v.cabinTempTimestamp):'')+'</div></div>'
    +'<div class="van-metric"><div class="van-metric-value" style="color:'+cabinHumidity.color+'">'+(v.cabinHumidityPct!==null&&v.cabinHumidityPct!==undefined?v.cabinHumidityPct+'%':'—')+'</div><div class="van-metric-label">Cabin humidity</div><div class="van-metric-status">'+cabinHumidity.label+(vanReadingAge(v.cabinHumidityTimestamp)?' · '+vanReadingAge(v.cabinHumidityTimestamp):'')+'</div></div>'
    +'<div class="van-metric"><div class="van-metric-value" style="color:'+garage.color+'">'+(v.garageTempC!==null&&v.garageTempC!==undefined?v.garageTempC+'&deg;':'—')+'</div><div class="van-metric-label">Garage temperature</div><div class="van-metric-status">'+garage.label+(vanReadingAge(v.garageTempTimestamp)?' · '+vanReadingAge(v.garageTempTimestamp):'')+'</div></div>'
    +'<div class="van-metric"><div class="van-metric-value" style="color:'+garageHumidity.color+'">'+(v.garageHumidityPct!==null&&v.garageHumidityPct!==undefined?v.garageHumidityPct+'%':'—')+'</div><div class="van-metric-label">Garage humidity</div><div class="van-metric-status">'+garageHumidity.label+(vanReadingAge(v.garageHumidityTimestamp)?' · '+vanReadingAge(v.garageHumidityTimestamp):'')+'</div></div></div></section>');
  if(lpg)parts.push('<section class="van-surface van-wide"><div class="van-surface-head"><div><div class="van-section-label">LPG &amp; heating</div><div class="van-surface-title">Heating runway</div></div><div class="van-surface-meta">'+(lpg.statusMsg||'')+'</div></div><div class="van-lpg-top"><div><div class="van-lpg-value" style="color:'+(lpgLevel==='danger'?'#e18d80':lpgLevel==='caution'?'#e2b161':'#8ac59b')+'">'+(litres!==null?litres.toFixed(1)+'L':'—')+'</div><div class="van-lpg-status">'+(hasTank&&pct!==null?pct+'% of '+tank+'L tank':'Tank capacity unavailable')+'</div></div><button class="van-refill-btn" id="refillBtn" type="button" onclick="lpgRefill()">Refill</button></div><div class="van-lpg-bar"><div class="van-lpg-fill van-'+lpgLevel+'" style="width:'+(pct===null?0:pct)+'%"></div></div>'
    +(forecast.length?'<div class="van-runway"><div class="van-runway-item"><div class="van-runway-label">Next planned use</div><div class="van-runway-value">'+(nextForecast.location||'Planned stop')+'</div><div class="van-runway-meta">'+(fmtDate(nextForecast.date)||'')+(nextForecast.minTempC!==null?' · '+nextForecast.minTempC+'&deg;':'')+(nextForecast.litresUsed!==null?' · '+nextForecast.litresUsed+'L':'')+'</div></div><div class="van-runway-item"><div class="van-runway-label">End of available plan</div><div class="van-runway-value">'+(lastForecast.tankRemL!==null?lastForecast.tankRemL+'L remaining':'—')+'</div><div class="van-runway-meta">'+(fmtDate(lastForecast.date)||'')+(lastForecast.heatSource?' · '+lastForecast.heatSource:'')+'</div></div></div>':'')
    +'</section>');
  parts.push('<section class="van-surface"><div class="van-section-label">Fuel</div><div class="van-surface-title">Running costs</div><div class="van-fuel-facts"><div class="van-fuel-fact"><div class="van-fuel-label">Diesel</div><div class="van-fuel-value">'+(fc&&fc.pricePerLitre?'£'+fc.pricePerLitre.toFixed(2)+'/L':'—')+'</div></div><div class="van-fuel-fact"><div class="van-fuel-label">Motorhome MPG</div><div class="van-fuel-value">'+(fc&&fc.mpg?fc.mpg.toFixed(1):'—')+'</div></div>'+(nextDrive?'<div class="van-fuel-fact"><div class="van-fuel-label">Next drive</div><div class="van-fuel-value">£'+nextDrive.cost+'</div></div>':'')+'</div><details class="van-details"><summary>Fuel price settings</summary><div class="van-price-row"><span>Diesel <strong>£'+(fc&&fc.pricePerLitre?fc.pricePerLitre.toFixed(2):'—')+'/L</strong></span><button class="van-edit-btn" type="button" onclick="editPrice(\'diesel\',\''+(fc&&fc.pricePerLitre||1.182)+'\')">Edit</button></div><div class="van-price-row"><span>LPG <strong>£'+(fc&&fc.lpgPrice?fc.lpgPrice.toFixed(2):'—')+'/L</strong></span><button class="van-edit-btn" type="button" onclick="editPrice(\'lpg\',\''+(fc&&fc.lpgPrice||0.95)+'\')">Edit</button></div></details></section>');
  parts.push('<section class="van-surface"><div class="van-section-label">Vehicle</div><div class="van-surface-title">Vehicle detail</div><div class="van-detail-list"><div class="van-detail-row"><span>Location</span><strong>'+(map?'<a class="van-map-link" href="'+map+'" target="_blank">'+location+' ↗</a>':location)+'</strong></div><div class="van-detail-row"><span>Telemetry</span><strong>'+telemetry.state+' · '+telemetry.age+'</strong></div><div class="van-detail-row"><span>Last poll</span><strong>'+timestamp+'</strong></div><div class="van-detail-row"><span>Odometer</span><strong>'+(v.odometerMiles?v.odometerMiles.toLocaleString()+' mi':'—')+(v.odometerSource?' · '+v.odometerSource:'')+'</strong></div><div class="van-detail-row"><span>Elevation</span><strong>'+(v.vanElevationM!==null&&v.vanElevationM!==undefined?v.vanElevationM.toLocaleString()+'m':'—')+'</strong></div></div></section>');
  parts.push('</div></div></div></div>');
  return parts.join('');
}

// ── AUDREY 2.0 JOURNEY BRIEFING ──────────────────────────────
// Composes existing nextDrive, itinerary and en-route data into two local
// views. The original route/weather builders and API payload remain untouched.
function buildJourneyView(d,fc){
  var meta=d.meta||{},hasDrive=hasJourneyDrive(d);
  var completed=meta.tripStatus==='POST_TRIP';
  var scene=getJourneyScene(d);
  var title=meta.tripName||'Journey';
  var subtitle=completed?'Trip complete':hasDrive?'Your next move, clearly briefed':'Your trip, at a glance';
  var todayClass=currentJourneyMode==='today'&&hasDrive?' is-active':'';
  var tripClass=currentJourneyMode==='trip'||!hasDrive?' is-active':'';
  return '<div class="journey-experience" data-scene="'+scene.key+'" data-scene-time="'+scene.time+'" style="'+journeySceneStyle(scene)+'"><div class="journey-canvas">'
    +'<header class="journey-head"><div class="journey-eyebrow">Audrey · Journey</div>'
    +'<div class="journey-title">'+title+'</div><div class="journey-subtitle">'+subtitle+'</div>'
    +'<div class="journey-mode-switch" role="tablist" aria-label="Journey view">'
    +'<button class="journey-mode-btn'+todayClass+'" type="button" data-journey-mode="today" onclick="switchJourneyMode(\'today\')"'+(hasDrive?'':' disabled')+'>Today</button>'
    +'<button class="journey-mode-btn'+tripClass+'" type="button" data-journey-mode="trip" onclick="switchJourneyMode(\'trip\')">Trip</button>'
    +'</div></header>'
    +'<section class="journey-mode'+todayClass+'" data-journey-mode="today">'+(hasDrive?buildJourneyToday(meta,d.master,fc):'')+'</section>'
    +'<section class="journey-mode'+tripClass+'" data-journey-mode="trip">'+buildJourneyTrip(d,fc)+'</section>'
    +'</div></div>';
}

// Journey reuses Home's central scene mapping. A drive is explicit evidence
// for the travelling/mountains scene; otherwise this deliberately falls back
// unless the existing payload identifies a supported scene with confidence.
function getJourneyScene(d){
  var meta=d.meta||{};
  var mode=hasJourneyDrive(d)?'drive':meta.tripStatus==='POST_TRIP'?'returned':'unknown';
  return getHomeScene(d,{mode:mode});
}

function journeySceneStyle(scene){
  var style='--journey-scene-position:'+scene.position+';--journey-scene-position-tablet:'+scene.tabletPosition+';--journey-scene-position-wide:'+scene.widePosition+';';
  if(scene.asset)style+='--journey-scene-image:url(\''+scene.asset+'\');';
  return style;
}

function buildJourneyToday(meta,master,fc){
  var nd=meta.nextDrive||{},risk=getHomeRouteRisk(nd,master);
  var timing=journeyTimingFact(nd);
  var fuel=nd.distanceKm&&fc?calcFuel(nd.distanceKm,fc):null;
  return '<section class="journey-drive-brief">'
    +'<div class="journey-kicker">Next drive</div>'
    +'<div class="journey-route"><span>'+((nd.origin||meta.currentLocation)||'Here')+'</span><b class="journey-route-arrow">→</b><span>'+(nd.destination||'Next stop')+'</span></div>'
    +buildJourneyDecision(risk)
    +'<div class="journey-facts">'
    +journeyFact(timing.label,timing.value)
    +journeyFact('Distance',nd.distanceKm?nd.distanceKm+' km':'—')
    +journeyFact('Drive time',nd.durationMin?fmtDuration(nd.durationMin):'—')
    +(fuel?journeyFact('Fuel estimate','£'+fuel.cost):'')
    +'</div>'
    +'</section>'
    +'<div class="journey-section-title">Route conditions</div>'
    +buildJourneyRouteTimeline(nd);
}

function journeyTimingFact(nd){
  var suppliedTime=nd.departureTime||(hasJourneyTime(nd.departure)?nd.departure:'');
  if(suppliedTime)return{label:'Departure',value:suppliedTime};
  var dateOnly=nd.date||nd.departure;
  return{label:'Date',value:dateOnly?(nd.date?fmtDate(nd.date):dateOnly):'Scheduled'};
}

function hasJourneyTime(value){
  return typeof value==='string'&&(/\b\d{1,2}:\d{2}\b/.test(value)||/T\d{2}:\d{2}/.test(value));
}

function journeyFact(label,value){
  return '<div class="journey-fact"><div class="journey-fact-label">'+label+'</div><div class="journey-fact-value">'+value+'</div></div>';
}

function buildJourneyDecision(risk){
  var heading=risk.level==='go'?'Conditions look good':risk.level==='caution'?'Conditions need a check':'Review before leaving';
  return '<div class="journey-decision journey-'+risk.level+'"><div class="journey-decision-status">'+risk.label+'</div><div class="journey-decision-heading">'+heading+'</div><div class="journey-decision-copy">'+risk.copy+'</div></div>';
}

function buildJourneyRouteTimeline(nd){
  var points=nd.enRoute||[];
  var selected=getMeaningfulJourneyPoints(points);
  var origin=nd.origin||'Origin',destination=nd.destination||'Destination';
  var html='<div class="journey-timeline">';
  var timing=journeyTimingFact(nd);
  html+=journeyRoutePoint('Depart',origin,timing.label+' · '+timing.value, '');
  selected.forEach(function(point){
    var state=point.overallRisk==='danger'?'route-danger':point.overallRisk==='caution'?'route-risk':'route-ok';
    var title=journeyPointTitle(point);
    var meta=[];
    if(point.label)meta.push(point.label);
    if(point.etaStr)meta.push('Around '+point.etaStr);
    if(point.tempC!==null&&point.tempC!==undefined)meta.push(point.tempC+'°');
    if(point.windKmh)meta.push(point.windKmh+' km/h wind');
    html+=journeyRoutePoint('Route condition',title,meta.join(' · '),state);
  });
  html+=journeyRoutePoint('Destination',destination,nd.durationMin?'After '+fmtDuration(nd.durationMin):'', '');
  html+='</div>';
  if(points.length)html+=buildJourneyRouteDetails(points);
  return html;
}

function getMeaningfulJourneyPoints(points){
  var selected=[],seen={};
  points.forEach(function(point){
    var hasRisk=point.overallRisk==='danger'||point.overallRisk==='caution'||(point.risks&&point.risks.some(function(r){return r.severity!=='info';}));
    var notable=point.type==='summit'||point.type==='high'||point.type==='exposed';
    if(!hasRisk&&!notable)return;
    var key=(point.label||point.segName||point.distanceKm||'').toString();
    if(!seen[key]&&selected.length<3){seen[key]=true;selected.push(point);}
  });
  return selected;
}

function journeyPointTitle(point){
  var risk=point.risks&&point.risks.find(function(r){return r.severity!=='info';});
  if(risk&&risk.label)return risk.label;
  if(point.segName)return point.segName;
  if(point.overallRisk==='danger')return 'Route risk';
  if(point.overallRisk==='caution')return 'Route caution';
  return point.label||'Route point';
}

function journeyRoutePoint(type,title,meta,state){
  return '<div class="journey-point '+(state||'')+'"><div class="journey-point-card">'
    +'<div class="journey-point-type">'+type+'</div><div class="journey-point-title">'+title+'</div>'
    +(meta?'<div class="journey-point-meta">'+meta+'</div>':'')+'</div></div>';
}

function buildJourneyRouteDetails(points){
  return '<details class="journey-details"><summary>All available route points ('+points.length+')</summary>'
    +points.map(function(point){
      var left=(point.label||point.segName||('km '+(point.distKm||point.distanceKm||'—')));
      var right=[];
      if(point.etaStr)right.push(point.etaStr);
      if(point.tempC!==null&&point.tempC!==undefined)right.push(point.tempC+'°');
      if(point.windKmh)right.push(point.windKmh+' km/h');
      return '<div class="journey-detail-row"><span>'+left+'</span><span>'+right.join(' · ')+'</span></div>';
    }).join('')+'</details>';
}

function buildJourneyTrip(d,fc){
  var meta=d.meta||{},itin=d.itinerary||[],rt=d.runningTotal;
  var completed=meta.tripStatus==='POST_TRIP';
  var totalKm=rt&&rt.totalKm!==undefined?rt.totalKm:itin.reduce(function(sum,row){return sum+(Number(row.distanceKm)||0);},0);
  var stopCount=itin.length;
  var heading=completed?'Completed trip':'Trip timeline';
  var html='<section class="journey-overview"><div class="journey-kicker">'+heading+'</div>'
    +'<div class="journey-overview-grid">'
    +journeyOverview(itin.length,'days')+journeyOverview(totalKm+' km','distance')+journeyOverview(stopCount,'stops')
    +'</div></section><div class="journey-section-title">'+(completed?'Completed timeline':'Trip timeline')+'</div>';
  if(!itin.length)return html+'<div class="journey-point-card"><div class="journey-point-title">No itinerary entries available</div></div>';
  html+='<div class="journey-timeline">';
  itin.forEach(function(row){html+=buildJourneyTripPoint(row,completed,fc);});
  return html+'</div>';
}

function journeyOverview(value,label){
  return '<div><div class="journey-overview-value">'+value+'</div><div class="journey-overview-label">'+label+'</div></div>';
}

function buildJourneyTripPoint(row,completed,fc){
  var state=completed||row.isPast?'is-complete':row.isToday?'is-current':'';
  var date=new Date(row.date+'T00:00:00');
  var day=date.toLocaleDateString('en-GB',{weekday:'short'}),dateLabel=date.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
  var type=(row.type||'Stop').toString(),kind=journeyTimelineKind(type);
  var meta=[];
  if(row.distanceKm)meta.push(row.distanceKm+' km');
  if(row.durationMin)meta.push(fmtDuration(row.durationMin));
  if(row.ehu)meta.push('EHU');
  var forecastUnavailable=row.routeRisk&&isMissingJourneyForecast(row.routeRisk.snowRisk);
  if(row.routeRisk&&row.routeRisk.snowRisk&&!forecastUnavailable)meta.push(row.routeRisk.snowRisk);
  var details=[];
  if(row.notes)details.push('<div class="journey-trip-detail">'+row.notes+'</div>');
  if(forecastUnavailable)details.push('<div class="journey-trip-detail">Forecast not available yet</div>');
  if(row.contact)details.push('<div class="journey-trip-detail">☎ '+row.contact+'</div>');
  if(row.bookingRef)details.push('<div class="journey-trip-detail">Booking ref: '+row.bookingRef+'</div>');
  if(row.address){details.push('<div class="journey-trip-detail"><a target="_blank" href="https://maps.apple.com/?address='+encodeURIComponent(row.address)+'">Open in Maps</a></div>');}
  else if(row.location){details.push('<div class="journey-trip-detail"><a target="_blank" href="https://maps.apple.com/?q='+encodeURIComponent(row.location)+'">Open in Maps</a></div>');}
  ['nightlyCost','cost','price'].forEach(function(key){if(row[key]!==undefined&&row[key]!==null)details.push('<div class="journey-trip-detail">Cost: '+row[key]+'</div>');});
  return '<div class="journey-point journey-trip-point '+state+'"><div class="journey-trip-card journey-'+kind+'-card">'
    +'<div class="journey-date"><strong>'+(row.isToday&&!completed?'Today':day)+'</strong>'+dateLabel+'</div>'
    +'<div><div class="journey-stop">'+journeyTimelineTitle(row,kind)+'</div>'+(meta.length?'<div class="journey-stop-meta">'+meta.join(' · ')+'</div>':'')+'</div>'
    +'<span class="journey-type">'+type+'</span>'
    +(details.length?'<details class="journey-trip-details"><summary>Details</summary>'+details.join('')+'</details>':'')
    +'</div></div>';
}

function journeyTimelineKind(type){
  var normalized=type.toUpperCase();
  return /DRIVE|DEPART|ARRIV|RETURN/.test(normalized)?'leg':'place';
}

function journeyTimelineTitle(row,kind){
  var location=row.location||'Next stop',type=(row.type||'Stop').toString().toUpperCase();
  if(kind==='leg'){
    if(/DEPART/.test(type))return 'Depart · '+location;
    if(/ARRIV/.test(type))return 'Arrive · '+location;
    if(/RETURN/.test(type))return 'Return · '+location;
    return 'Drive to '+location;
  }
  if(/STOPOVER|OVERNIGHT/.test(type))return 'Overnight · '+location;
  return location;
}

function isMissingJourneyForecast(value){
  return typeof value==='string'&&/no forecast|forecast not available|forecast unavailable/i.test(value);
}

// ── AUDREY 2.0 HOME SCENES ───────────────────────────────────
// Scene assets are intentionally local-only. The layered CSS gradients remain
// visible if a file is absent or fails to load, so no broken-image UI is shown.
var HOME_SCENES={
  // Positioning follows each local image's focal subject across portrait,
  // tablet and wide canvases. `cover` keeps the photographs undistorted.
  home:{asset:'assets/scenes/home.jpg',enabled:true,position:'82% center',tabletPosition:'66% center',widePosition:'center 45%'},
  mountains:{asset:'assets/scenes/mountains.jpg',enabled:true,position:'52% center',tabletPosition:'48% center',widePosition:'center 48%'},
  alpine:{asset:'assets/scenes/alpine.jpg',enabled:true,position:'78% center',tabletPosition:'64% center',widePosition:'center 46%'},
  coast:{asset:'assets/scenes/coast.jpg',enabled:true,position:'72% center',tabletPosition:'61% center',widePosition:'center 48%'},
  // No dedicated Highlands image yet: keep its explicit context atmospheric.
  highlands:{asset:'',enabled:false,position:'center 42%',tabletPosition:'center 45%',widePosition:'center 48%'},
  // Travelling uses the mountain asset only when the drive state is explicit.
  travelling:{asset:'assets/scenes/mountains.jpg',enabled:true,position:'52% center',tabletPosition:'48% center',widePosition:'center 48%'},
  generic:{asset:'assets/scenes/home.jpg',enabled:true,position:'82% center',tabletPosition:'66% center',widePosition:'center 45%'}
};

function getHomeScene(d,context){
  var meta=d.meta||{};
  var explicit=[meta.scene,meta.locationType,meta.currentLocationType,meta.regionType,meta.currentLocationContext,meta.activity,meta.todayActivity]
    .filter(function(value){return value!==undefined&&value!==null;}).join(' ').toLowerCase();
  var key='generic';

  if(context.mode==='returned')key='home';
  else if(context.mode==='drive')key='travelling';
  else if(context.mode==='ski')key='alpine';
  // These matches are only against explicit payload labels, never place names.
  else if(/coast|coastal|water|beach|sea/.test(explicit))key='coast';
  else if(/highlands|rural/.test(explicit))key='highlands';
  else if(/mountain|mountains|alpine/.test(explicit))key=meta.season==='winter'?'alpine':'mountains';

  var hour=(new Date()).getHours();
  var time=hour>=22||hour<6?'night':hour>=18?'evening':'day';
  var config=HOME_SCENES[key]||HOME_SCENES.generic;
  return {key:key,time:time,asset:config.enabled?config.asset:'',position:config.position,tabletPosition:config.tabletPosition||config.position,widePosition:config.widePosition||config.position};
}

function homeSceneStyle(scene){
  var style='--home-scene-position:'+scene.position+';--home-scene-position-tablet:'+scene.tabletPosition+';--home-scene-position-wide:'+scene.widePosition+';';
  if(scene.asset)style+='--home-scene-image:url(\''+scene.asset+'\');';
  return style;
}

// ── AUDREY 2.0 HOME BRIEFING ─────────────────────────────────
// This only interprets fields already present in the dashboard response. It
// deliberately links to deeper views instead of duplicating their engines.
function buildHomeView(d,fc){
  var context=getHomeContext(d);
  var scene=getHomeScene(d,context);
  var meta=d.meta||{};
  var parts=[];
  parts.push('<div class="home-experience" data-scene="'+scene.key+'" data-scene-time="'+scene.time+'" style="'+homeSceneStyle(scene)+'"><div class="home-canvas">');
  parts.push('<section class="home-hero home-tone-'+context.tone+'">'
    +'<div class="home-eyebrow">Audrey · '+context.eyebrow+'</div>'
    +'<div class="home-trip-name">'+(meta.tripName||'Audrey')+'</div>'
    +'<div class="home-state-line"><span class="home-state-dot"></span>'+context.stateLabel+'</div>'
    +'<div class="home-message">'+context.message+'</div>'
    +(context.meta?'<div class="home-hero-meta">'+context.meta+'</div>':'')
    +'</section>');
  parts.push('<div class="home-stack">');
  if(context.attention)parts.push('<section class="home-attention">'
    +'<div class="home-attention-label">Needs attention</div>'
    +'<div class="home-attention-copy">'+context.attention+'</div></section>');
  if(!context.attention){
    if(context.mode==='drive')parts.push(buildHomeDriveDecision(meta,d.master,fc));
    else if(context.mode==='returned'||context.mode==='pretrip')parts.push(buildHomeNextContext(meta,fc));
    else parts.push(buildHomeOpportunity(d,context));
  }
  var relevantWeather=getHomeRelevantWeather(d.weather,context);
  if(relevantWeather.length)parts.push(buildHomeConditions(relevantWeather));
  parts.push(buildHomeVehicleStatus(d.vehicle));
  parts.push('</div></div></div>');
  return parts.join('');
}

function getHomeContext(d){
  var meta=d.meta||{},vehicle=d.vehicle||{},snow=d.snowStatus||{};
  var attention=getHomeAttention(d);
  var telemetry=homeTelemetryConfidence(vehicle);
  var dayType=meta.todayType||'';
  var isDrive=['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(dayType)>=0;
  var hasSki=meta.tripStatus==='ACTIVE'&&meta.season==='winter'&&snow.resorts&&snow.resorts.length;
  var hour=(new Date()).getHours();
  var evening=hour>=18||hour<6;
  var result={tone:'calm',eyebrow:'Your motorhome co-pilot',stateLabel:'All good',message:'Here when you need a clear view of the road ahead.',meta:''};

  if(attention){
    result.tone='attention';result.mode='attention';result.eyebrow='Audrey needs your eye';
    result.stateLabel='Attention required';result.message='One thing is worth checking before you settle in.';
    result.attention=attention;return result;
  }
  if(meta.tripStatus==='POST_TRIP'){
    result.mode='returned';result.eyebrow=telemetry.state==='unavailable'?'Status update':'All good';result.stateLabel='Trip complete';
    result.message=telemetry.state==='unavailable'?"You're home. Current vehicle state hasn't been confirmed recently."
      :"You're home. The van looks happy.";
    result.meta=telemetry.state==='unavailable'?telemetry.copy:'';
    return result;
  }
  if(isDrive&&meta.nextDrive){
    result.tone='drive';result.mode='drive';result.eyebrow='Today\'s focus';result.stateLabel='Driving day';
    result.message='Your next move is clear. Check the route brief, then go when it feels right.';
    return result;
  }
  if(hasSki){
    result.mode='ski';result.eyebrow='Today\'s opportunity';result.stateLabel='Winter day';
    result.message='A quick look at the mountain conditions may help shape the day.';
    return result;
  }
  if(evening&&meta.tripStatus!=='PRE_TRIP'){
    result.mode='evening';result.eyebrow='Settle in';result.stateLabel='Evening & overnight';
    result.message='A calm check of tonight and tomorrow, then switch off.';
    return result;
  }
  if(meta.tripStatus==='PRE_TRIP'){
    result.mode='pretrip';result.eyebrow='Looking ahead';result.stateLabel='Trip ahead';
    result.message='The essentials are here when you are ready to plan the next move.';
    return result;
  }
  result.mode='parked';result.eyebrow='Today\'s opportunity';result.stateLabel='Parked up';
  result.message='A good moment to see what the area has to offer.';
  if(telemetry.state==='unavailable'){
    result.eyebrow='Status update';result.stateLabel='Vehicle state unavailable';result.message='Current vehicle telemetry has not been confirmed recently.';result.meta=telemetry.copy;
  }
  return result;
}

// Home deliberately consumes VAN's existing telemetry semantics instead of
// introducing a second freshness threshold or treating stale data as a fault.
function homeTelemetryConfidence(vehicle){
  var v=vehicle||{},telemetry=vanTelemetryInfo(v);
  var timestamp=v.snapshotUpdatedAt||v.locationTimestamp;
  if(!Object.keys(v).length||!timestamp||isNaN(new Date(timestamp).getTime())||['UNAVAILABLE','MISSING','OFFLINE','ERROR'].indexOf(telemetry.state)>=0)return{state:'unavailable',copy:'Vehicle telemetry is unavailable.'};
  if(telemetry.state==='STALE')return{state:'stale',copy:telemetry.age};
  return{state:'current',copy:telemetry.age};
}

function getHomeAttention(d){
  var vehicle=d.vehicle||{},lpg=d.lpg&&d.lpg.current?d.lpg.current:null;
  if(vehicle.systemAlert&&!vehicle.systemAlert.includes('VAN SYSTEMS OK'))return vehicle.systemAlert;
  if(vehicle.batteryV!==null&&vehicle.batteryV!==undefined&&vehicle.batteryV<12.4)return 'Battery is at '+vehicle.batteryV+'V. Check the charging situation.';
  if(lpg&&(lpg.alert==='CRITICAL'||lpg.alert==='LOW'))return lpg.statusMsg||'LPG level is low. Consider a refill.';
  return '';
}

function buildHomeDriveDecision(meta,master,fc){
  var nd=meta.nextDrive||{},risk=getHomeRouteRisk(nd,master);
  var when=nd.departureTime||nd.departure||fmtDate(nd.date)||'Scheduled';
  return '<section class="home-decision">'
    +'<div class="home-decision-kicker">Next drive</div>'
    +'<div class="home-drive-route"><span>'+((nd.origin||meta.currentLocation)||'Here')+'</span><b class="home-drive-arrow">→</b><span>'+((nd.destination)||'Next stop')+'</span></div>'
    +'<div class="home-drive-grid">'
    +'<div class="home-drive-stat"><div class="home-drive-stat-label">Departure</div><div class="home-drive-stat-value">'+when+'</div></div>'
    +'<div class="home-drive-stat"><div class="home-drive-stat-label">Distance</div><div class="home-drive-stat-value">'+(nd.distanceKm?nd.distanceKm+' km':'—')+'</div></div>'
    +'<div class="home-drive-stat"><div class="home-drive-stat-label">Drive time</div><div class="home-drive-stat-value">'+(nd.durationMin?fmtDuration(nd.durationMin):'—')+'</div></div>'
    +'<div class="home-drive-stat"><div class="home-drive-stat-label">Fuel estimate</div><div class="home-drive-stat-value">'+(nd.distanceKm&&fc?('£'+calcFuel(nd.distanceKm,fc).cost):'—')+'</div></div>'
    +'</div>'
    +'<div class="home-risk-row"><span class="home-risk-badge home-risk-'+risk.level+'">'+risk.label+'</span><span class="home-risk-copy">'+risk.copy+'</span></div>'
    +'</section>';
}

function getHomeRouteRisk(nd,master){
  var points=nd.enRoute||[];
  var danger=points.some(function(w){return w.overallRisk==='danger';});
  var caution=points.some(function(w){return w.overallRisk==='caution';});
  var flagged=points.reduce(function(all,w){
    return all.concat((w.risks||[]).filter(function(r){return r.severity!=='info';}).map(function(r){return r.label;}));
  },[]);
  if(danger)return{level:'danger',label:'NOT IDEAL',copy:flagged[0]||'There is a risk on this route. Review the route conditions before leaving.'};
  if(caution)return{level:'caution',label:'CAUTION',copy:flagged[0]||'Some route conditions need a quick check before departure.'};
  return{level:'go',label:'GO',copy:nd.notes||((master&&master.advice)||'Conditions are clear across the available route checks.')};
}

function buildHomeNextContext(meta,fc){
  var nd=meta.nextDrive;
  if(!nd)return '<section class="home-calm-status">'
    +'<div><div class="home-calm-status-title">Nothing needs your attention</div>'
    +'<div class="home-calm-status-copy">No next trip event is currently scheduled.</div></div>'
    +'</section>';
  var fuel=nd.distanceKm&&fc?calcFuel(nd.distanceKm,fc):null;
  return '<section class="home-opportunity">'
    +'<div class="home-section-label">What\'s next?</div>'
    +'<div class="home-opportunity-title">'+(nd.destination||'Your next stop')+'</div>'
    +'<div class="home-opportunity-copy">'+(fmtDate(nd.date)||'Upcoming')+(nd.distanceKm?' · '+nd.distanceKm+' km':'')+(fuel?' · about £'+fuel.cost+' fuel':'')+'</div>'
    +'</section>';
}

function buildHomeOpportunity(d,context){
  var meta=d.meta||{},snow=d.snowStatus||{},weather=getHomeWeather(d.weather);
  if(context.mode==='ski'){
    var resort=snow.resorts[0]||{};
    return '<section class="home-opportunity">'
      +'<div class="home-section-label">Ski conditions</div>'
      +'<div class="home-opportunity-title">'+(resort.name||'Mountain conditions')+'</div>'
      +'<div class="home-opportunity-copy">'+(resort.snowDepthCm?resort.snowDepthCm+'cm base · ':'')+(resort.ssScore?'Score '+resort.ssScore+' · ':'')+(resort.ssTagline||resort.fitment||'Open Activities for the full resort brief.')+'</div>'
      +'<button class="home-opportunity-action" type="button" onclick="switchAppView(\'do\')">Open skiing conditions →</button>'
      +'</section>';
  }
  var label=context.mode==='evening'?'Tonight & tomorrow':"What's good today?";
  var copy=weather
    ?(weather.condition||weather.risk||'Conditions are available')+(weather.maxTempC!==null?' · '+weather.maxTempC+'&deg;':'')+(weather.gustKmh?' · gusts '+weather.gustKmh+' km/h':'')
    :'Activities and local conditions are available when you need them.';
  return '<section class="home-opportunity">'
    +'<div class="home-section-label">'+label+'</div>'
    +'<div class="home-opportunity-title">'+(weather&&weather.location?weather.location:(meta.currentLocation||'Your current area'))+'</div>'
    +'<div class="home-opportunity-copy">'+copy+'</div>'
    +(context.mode!=='evening'?'<button class="home-opportunity-action" type="button" onclick="switchAppView(\'do\')">Explore activities →</button>':'')
    +'</section>';
}

function getHomeWeather(weather){
  if(!weather||!weather.length)return null;
  return weather.find(function(w){return w.isToday;})||weather[0];
}

// Weather is a Home decision aid, not an automatic feed. Ski days only admit
// weather explicitly identified by the payload as mountain/resort context.
function getHomeRelevantWeather(weather,context){
  if(!weather||!weather.length)return [];
  if(context.mode==='returned'||context.mode==='attention'||context.mode==='pretrip')return [];
  if(context.mode!=='ski')return weather;
  return weather.filter(function(w){
    var labels=[w.locationType,w.context,w.category,w.source].filter(Boolean).join(' ').toLowerCase();
    return w.isMountain===true||w.isResort===true||w.isAlpine===true||/mountain|resort|alpine|ski/.test(labels);
  });
}

function buildHomeConditions(weather){
  if(!weather||!weather.length)return'';
  var immediate=weather.filter(function(w){return w.isToday;});
  if(!immediate.length)immediate=weather.slice(0,2);
  immediate=immediate.slice(0,2);
  return '<div class="home-conditions">'+immediate.map(function(w){
    return '<div class="home-condition">'
      +'<div class="home-condition-label">'+(w.location||'Conditions')+'</div>'
      +'<div class="home-condition-main" style="color:'+riskColor(w.risk)+'">'+(w.risk||w.condition||'—')+'</div>'
      +'<div class="home-condition-meta">'+(w.condition||'')+(w.maxTempC!==null?' · '+w.maxTempC+'&deg;':'')+'</div>'
      +'</div>';
  }).join('')+'</div>';
}

function buildHomeVehicleStatus(v){
  if(!v)return'';
  var battery=v.batteryV!==null&&v.batteryV!==undefined?v.batteryV+'V':'—';
  var cabin=v.cabinTempC!==null&&v.cabinTempC!==undefined?v.cabinTempC+'&deg;':'—';
  var garage=v.garageTempC!==null&&v.garageTempC!==undefined?v.garageTempC+'&deg;':'—';
  var telemetry=homeTelemetryConfidence(v),freshness=homeTelemetryFreshness(v);
  var health=telemetry.state!=='unavailable'&&v.systemAlert&&v.systemAlert.includes('VAN SYSTEMS OK')?'✓ Systems normal':'';
  return '<button class="home-vehicle-surface home-vehicle-button" type="button" onclick="switchAppView(\'van\')" aria-label="Open detailed van status">'
    +'<div class="home-vehicle-heading"><span class="home-section-label">Van now</span><span class="home-vehicle-status-meta">'
    +(health?'<span class="home-vehicle-health">'+health+'</span>':'')
    +'<span class="home-telemetry-freshness">'+freshness+'</span></span></div>'
    +'<div class="home-vehicle-grid">'
    +'<div class="home-van-item"><div class="home-van-value">'+battery+'</div><div class="home-van-label">Battery</div></div>'
    +'<div class="home-van-item"><div class="home-van-value">'+cabin+'</div><div class="home-van-label">Cabin</div></div>'
    +'<div class="home-van-item"><div class="home-van-value">'+garage+'</div><div class="home-van-label">Garage</div></div>'
    +'</div></button>';
}

function homeTelemetryFreshness(vehicle){
  var telemetry=homeTelemetryConfidence(vehicle);
  if(telemetry.state==='unavailable')return 'Telemetry unavailable';
  return telemetry.state==='stale'?telemetry.copy:'';
}

function buildMoreFooter(){
  return '<footer class="footer">'
    +'<div class="footer-wordmark">Au<span style="color:var(--gold)">drey</span></div>'
    +'<div style="font-size:10px;color:var(--text-muted);margin-bottom:4px">8M BAILEY AUTOGRAPH</div>'
    +'<div class="last-updated" id="lastUpdated"></div>'
    +'<button class="settings-toggle" id="settingsBtn" onclick="toggleSettings()">⚙️ Settings</button>'
    +'<div class="settings-panel" id="settingsPanel"></div>'
    +'</footer>';
}

// ── MASTER BAR ────────────────────────────────────────────────
function buildMasterBar(master,vehicle){
  if(!master)return'';
  var c=master.color||'#888';
  var alert=vehicle&&vehicle.systemAlert&&!vehicle.systemAlert.includes('VAN SYSTEMS OK')?vehicle.systemAlert:'';
  return'<div class="master-bar">'
    +'<div class="master-status" style="color:'+c+'">'
    +'<span class="status-dot" style="background:'+c+'"></span>'+master.status
    +'</div>'
    +'<div class="master-advice">'+(alert?'<span style="color:'+c+';margin-right:8px">'+alert+'</span>':master.advice)+'</div>'
    +'</div>';
}

// ── COUNTDOWN + NEXT DRIVE ────────────────────────────────────
function buildCountdown(meta,driveHtml){
  if(!meta)return'';
  var number='&mdash;',label='Trip status',badgeClass='',badgeText='';
  if(meta.tripStatus==='PRE_TRIP'&&meta.daysToDepart!==null){
    number=meta.daysToDepart;label='Days to departure';badgeClass='type-DRIVE';badgeText='Upcoming';
  }else if(meta.tripStatus==='ACTIVE'){
    number=meta.daysIntoTrip!==null?meta.daysIntoTrip:'&#9679;';
    label=meta.daysIntoTrip!==null?'Days into trip':'Active trip';
    badgeClass='type-DEPART';badgeText='On the road';
  }else if(meta.tripStatus==='POST_TRIP'){
    number='&#10003;';label='Trip complete';badgeClass='type-RETURN';badgeText='Returned';
  }
  var dateRange=(meta.departDate&&meta.returnDate)
    ?fmtDate(meta.departDate)+' &mdash; '+fmtDate(meta.returnDate)
    :meta.departDate?'From '+fmtDate(meta.departDate):'';
  var countdown='<div class="grid"><div class="countdown-card">'
    +'<div class="countdown-number">'+number+'</div>'
    +'<div class="countdown-detail">'
    +'<div class="countdown-label">'+label+'</div>'
    +'<div class="countdown-trip">'+(meta.tripName||'')+'</div>'
    +'<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'
    +(badgeText?'<span class="trip-status-badge '+badgeClass+'">'+badgeText+'</span>':'')
    +(dateRange?'<span style="font-size:10px;color:var(--text-muted)">'+dateRange+'</span>':'')
    +'</div></div></div>'
    +driveHtml
    +'</div>';
  return countdown;
}


function buildNextDrive(meta,fc,viewId){
  var nd=meta.nextDrive;if(!nd)return'';
  viewId=viewId||'drive';
  var fuel=calcFuel(nd.distanceKm,fc);
 
  // Pass strip — winter trips, drive days only
  var passHtml='';
  if(currentData&&currentData.snowStatus&&currentData.snowStatus.passes&&currentData.meta&&currentData.meta.season==='winter'){
    var isDrive=['DRIVE','DEPART','ARRIVE','RETURN'].indexOf(meta.todayType)>=0;
    var isTmrw=nd.date===fmtDateISO(new Date(Date.now()+86400000));
    if(isDrive||isTmrw){
      var passes=currentData.snowStatus.passes;
      if(passes.length){
        passHtml='<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)">'
          +'<div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);margin-bottom:6px">Passes on route</div>'
          +'<div style="display:flex;gap:10px;flex-wrap:wrap">'
          +passes.map(function(p){
            var c=p.status.includes('Open')?'var(--go)':p.status.includes('Closed')?'var(--danger)':'var(--caution)';
            var icon=p.status.includes('Open')?'✅':p.status.includes('Closed')?'❌':'⚠️';
            return'<span style="font-size:11px">'
              +icon+' <span style="color:var(--text-dim)">'+p.name.replace(' Pass','')+'</span>'
              +' <strong style="color:'+c+'">'+p.status.replace('✅ ','').replace('❌ ','').replace('⚠️ ','')+'</strong>'
              +'</span>';
          }).join('<span style="color:var(--border2)">&nbsp;·&nbsp;</span>')
          +'</div></div>';
      }
    }
  }
 
  return'<div class="drive-card">'
    +'<div class="card-label" style="color:var(--frost);margin-bottom:10px">Next drive &middot; '+fmtDate(nd.date)+'</div>'
    +'<div class="drive-route">'
    +'<span class="drive-origin" style="color:var(--text-dim)">'+(nd.origin||meta.currentLocation||'&mdash;')+'</span>'
    +'<span class="drive-arrow">&rarr;</span>'
    +'<span class="drive-dest">'+nd.destination+'</span>'
    +'</div>'
    +'<div class="drive-meta">'
    +'<div class="drive-stat"><span class="drive-stat-label">Distance</span><span class="drive-stat-value">'+(nd.distanceKm?nd.distanceKm+' km':'&mdash;')+'</span></div>'
    +'<div class="drive-stat"><span class="drive-stat-label">Drive time</span><span class="drive-stat-value">'+(nd.durationMin?fmtDuration(nd.durationMin):'&mdash;')+'</span></div>'
    +(fuel?'<div class="drive-stat"><span class="drive-stat-label">Fuel est</span><span class="drive-stat-value">~'+fuel.litres+'L &middot; &pound;'+fuel.cost+'</span></div>':'')
    +(nd.notes?'<div class="drive-stat"><span class="drive-stat-label">Notes</span><span class="drive-stat-value" style="color:var(--text-dim)">'+nd.notes+'</span></div>':'')
    +'</div>'
        +passHtml
    +buildEnRouteWeather_(nd,viewId)
    +'</div>';
}

function buildEnRouteWeather_(nd,viewId) {
  if (!nd || !nd.enRoute || !nd.enRoute.length) return '';
  var waypointId='enroute-waypoints-'+viewId;
  var chevronId='enroute-chevron-'+viewId;

  var worst = nd.enRoute.some(function(w){ return w.overallRisk==='danger'; })  ? 'danger'
            : nd.enRoute.some(function(w){ return w.overallRisk==='caution'; }) ? 'caution'
            : 'ok';

  var riskColor = worst==='danger'  ? 'var(--danger)'
                : worst==='caution' ? 'var(--caution)'
                : 'var(--go)';
  var riskLabel = worst==='danger'  ? '🔴 Risk on route'
                : worst==='caution' ? '🟡 Caution on route'
                : '🟢 All clear';

  
      var html = '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border2)">'
    + '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;cursor:pointer" onclick="toggleEnRoute(\''+viewId+'\')">'
    + '<div style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)">En-route conditions</div>'
    + '<div style="display:flex;align-items:center;gap:8px">'
    + '<div style="font-size:11px;font-weight:700;color:' + riskColor + '">' + riskLabel + '</div>'
    + '<div id="'+chevronId+'" style="font-size:11px;color:var(--text-muted)">›</div>'
    + '</div></div>'
    + '<div id="'+waypointId+'" style="display:none">';

  nd.enRoute.forEach(function(w) {
    var riskIcon = w.overallRisk==='danger'  ? '🔴'
                 : w.overallRisk==='caution' ? '⚠️'
                 : '✅';
    var tempColor = w.tempC <= 2  ? 'var(--frost)'
                  : w.tempC >= 28 ? 'var(--caution)'
                  : 'var(--text-dim)';

    html += '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;'
      + 'border-bottom:1px solid var(--border);font-size:11px">'
      + '<div style="color:var(--text-muted);min-width:36px">km ' + w.distKm + '</div>'
      + '<div style="flex:1;font-weight:600">' + w.label + '</div>'
      + '<div style="color:var(--text-muted);min-width:36px">' + w.etaStr + '</div>'
      + '<div style="color:' + tempColor + ';min-width:38px">' + w.tempC + '°</div>'
      + '<div style="color:var(--text-muted);min-width:50px">' + w.windKmh + 'km/h</div>'
      + '<div>' + riskIcon + '</div>'
      + '</div>'
      + (w.risks && w.risks.length ? '<div style="font-size:10px;color:var(--caution);padding:2px 0 4px 44px">'
        + w.risks.filter(function(r){ return r.severity!=='info'; })
               .map(function(r){ return r.label; }).join(' · ')
        + '</div>' : '');
  });

  
  html += '</div></div>'; // close waypoints + outer

  // Auto-expand if there are risks
  if (worst !== 'ok') {
    html = html.replace('display:none', 'display:block');
    html = html.replace('>›<', '>↓<');
  }

  return html;
}
 
// helper — format date as yyyy-MM-dd for comparison
function fmtDateISO(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

// ── VEHICLE ───────────────────────────────────────────────────
function buildVehicleSection(v){
  if(!v)return'';
  var bc=v.batteryV?(v.batteryV>=13?'var(--go)':v.batteryV>=12.4?'var(--caution)':'var(--danger)'):'var(--text-dim)';
  var gc=v.garageTempC!==null?(v.garageTempC<=2?'var(--danger)':v.garageTempC<=5?'var(--frost)':'var(--text)'):'var(--text-dim)';
  var cc=v.cabinTempC!==null?(v.cabinTempC<15?'var(--frost)':v.cabinTempC>26?'var(--caution)':'var(--go)'):'var(--text-dim)';
  var oc=v.odometerMiles?'var(--text)':'var(--text-dim)';
  var locationLink='';
  if(v.lat&&v.lon){
    var mapsUrl='https://maps.apple.com/?ll='+v.lat+','+v.lon+'&q=Audrey';
    var staleStr='';
    if(v.locationTimestamp){
      var mins=Math.round((Date.now()-new Date(v.locationTimestamp).getTime())/60000);
      var hrs=Math.floor(mins/60);
      staleStr=hrs>0?' ('+hrs+'h ago)':mins>1?' ('+mins+'m ago)':'';
    }
    locationLink='<a href="'+mapsUrl+'" target="_blank" style="font-size:11px;color:var(--frost);text-decoration:none" onclick="event.stopPropagation()">&#128205; Current location'+staleStr+'</a>';
  }
  var statusMeta=locationLink;
  var body='<div class="van-grid">'
    +'<div class="van-card"><span class="van-card-icon">&#128267;</span>'
    +'<div class="van-card-value" style="color:'+bc+'">'+(v.batteryV!==null?v.batteryV+'V':'&mdash;')+'</div>'
    +'<div class="van-card-label">Battery</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#127968;</span>'
    +'<div class="van-card-value" style="color:'+cc+'">'+(v.cabinTempC!==null?v.cabinTempC+'&deg;':'&mdash;')+'</div>'
    +'<div class="van-card-label">Cabin</div></div>'
    +'<div class="van-card"><span class="van-card-icon">&#128656;</span>'
    +'<div class="van-card-value" style="color:'+gc+'">'+(v.garageTempC!==null?v.garageTempC+'&deg;':'&mdash;')+'</div>'

// ── WEATHER ───────────────────────────────────────────────────
function buildWeatherSection(weather,options){
  options=options||{};
  if(!weather||!weather.length){
    return options.allowUnavailable?makeSection('weather','Weather','Forecast unavailable','',
      '<div class="weather-empty"><strong>Forecast not available yet</strong>Weather for these trip dates will appear when they enter the available forecast window.</div>'):
      '';
  }

    // Limit display to today + 3 days, or trip start + 3 days if PRE_TRIP
  var now=new Date();now.setHours(0,0,0,0);
  var cutoff=new Date(now.getTime()+3*86400000);
  var filtered=weather.filter(function(w){
    var d=new Date(w.date+'T00:00:00');
    return d<=cutoff;
  });
  // If no weather in today+3 window, show from first available date
  if(!filtered.length && weather.length) {
    var firstDate=new Date(weather[0].date+'T00:00:00');firstDate.setHours(0,0,0,0);
    var tripCutoff=new Date(firstDate.getTime()+3*86400000);
    filtered=weather.filter(function(w){
      var d=new Date(w.date+'T00:00:00');
      return d>=firstDate && d<=tripCutoff;
    });
    // Adjust day labels to be relative to trip start
    now=firstDate;
  }
  weather=filtered;
  if(!weather.length){
    return options.allowUnavailable?makeSection('weather','Weather','Forecast unavailable','',
      '<div class="weather-empty"><strong>Forecast not available yet</strong>Weather for these trip dates will appear when they enter the available forecast window.</div>'):
      '';
  }

  // Group by location preserving first-appearance order
  var groups={},order=[];
  weather.forEach(function(w){
    if(!groups[w.location]){groups[w.location]=[];order.push(w.location);}
    groups[w.location].push(w);
  });
  var now=new Date();now.setHours(0,0,0,0);
  var tom=new Date(now.getTime()+86400000);
  var dat=new Date(now.getTime()+2*86400000);
  function dayLabel(ds){
    var d=new Date(ds+'T00:00:00');d.setHours(0,0,0,0);
    if(d.getTime()===now.getTime())return'Today';
    if(d.getTime()===tom.getTime())return'Tomorrow';
    if(d.getTime()===dat.getTime())return d.toLocaleDateString('en-GB',{weekday:'long'});
    return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  }
  var body='<div class="weather-list">';
  order.forEach(function(loc){
    var rows=groups[loc];
    body+='<div class="weather-loc-head">'+loc+'</div>';
    rows.forEach(function(w){
      var rc=riskColor(w.risk);
      body+='<div class="weather-row'+(w.isToday?' today':'')+'">'
        +'<div class="weather-date"><strong>'+dayLabel(w.date)+'</strong></div>'
        +'<div class="weather-middle"><div class="weather-condition">'+w.condition+'</div></div>'
        +'<div class="weather-stats">'
        +'<div class="weather-risk" style="color:'+rc+'">'+w.risk+'</div>'
        +'<div class="weather-nums">'
        +(w.minTempC!==null?w.minTempC+'&deg;':'')
+(w.maxTempC!==null?' &mdash; '+w.maxTempC+'&deg; &middot; ':' &middot; ')
+(w.gustKmh?w.gustKmh+' km/h':'')
+(w.windDir?' '+w.windDir.replace(/\s*\(\d+°\)/,''):'')
        +(w.snowMm&&w.snowMm>0?' &middot; '+w.snowMm+'mm':'')
        +'</div></div></div>';
    });
  });
  body+='</div>';
  return makeSection('weather','Weather','Today + 3 days','',body);
}

// ── ITINERARY ─────────────────────────────────────────────────
function buildItinerarySection(itin,fc){
  var rows=itin.map(function(r){
    var d=new Date(r.date+'T00:00:00');
    var day=d.toLocaleDateString('en-GB',{weekday:'short'});
    var dt=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
    var cls=r.isToday?' today':r.isPast?' past':'';
    var fuel=['DRIVE','DEPART','STOPOVER','ARRIVE','RETURN'].indexOf(r.type)>=0?calcFuel(r.distanceKm,fc):null;
    var fuelStr=fuel?' &middot; ~'+fuel.litres+'L/&pound;'+fuel.cost:'';
    var meta=[
      r.distanceKm?r.distanceKm+' km':'',
      r.durationMin?fmtDuration(r.durationMin):'',
      r.notes
    ].filter(Boolean).join(' &middot; ')+fuelStr;
    var mapsUrl=r.address
      ?'https://maps.apple.com/?address='+encodeURIComponent(r.address)
      :'https://maps.apple.com/?q='+encodeURIComponent(r.location);
    var ehuIcon=r.ehu?' <span style="font-size:11px;color:var(--frost)">&#128268;</span>':'';
    var riskHtml=(r.routeRisk&&r.routeRisk.snowRisk&&r.type!=='STAY')
      ?'<div style="font-size:11px;margin-top:3px;color:'+riskColor(r.routeRisk.snowRisk)+';font-weight:500">'+r.routeRisk.snowRisk+'</div>'
      :'';
    var contactHtml='';
    if(r.contact||r.bookingRef){
      var cp=[];
      if(r.contact)cp.push('<a href="tel:'+r.contact.replace(/[^0-9+]/g,'')+'" style="color:var(--frost);text-decoration:none">&#128222; '+r.contact+'</a>');
      if(r.bookingRef)cp.push('<span style="color:var(--text-muted)">REF: '+r.bookingRef+'</span>');
      contactHtml='<div style="font-size:11px;margin-top:3px;display:flex;gap:10px;flex-wrap:wrap">'+cp.join('')+'</div>';
    }
    return'<div class="itin-row'+cls+'">'
      +'<div class="itin-date"><strong>'+(r.isToday?'Today':day)+'</strong>'+dt+'</div>'
      +'<div>'
      +'<div class="itin-location">'+r.location+ehuIcon+'</div>'
      +(meta?'<div class="itin-notes">'+meta+'</div>':'')
      +contactHtml
      +riskHtml
      +'</div>'
      +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">'
      +'<span class="itin-badge type-'+r.type+'">'+r.type+'</span>'
      +(r.type!=='STAY'?'<a href="'+mapsUrl+'" target="_blank" style="font-size:10px;color:var(--frost);text-decoration:none">&#128205; Maps</a>':'')
      +'</div></div>';
  }).join('');
  return makeSection('itinerary','Itinerary',itin.length+' days','','<div>'+rows+'</div>');
}

// ── UTILITIES ─────────────────────────────────────────────────
function calcFuel(distanceKm,fc){
  if(!distanceKm||!fc)return null;
  var miles=distanceKm/1.60934;
  var litres=miles/fc.mpg*4.54609;
  var cost=litres*fc.pricePerLitre;
  return{litres:Math.round(litres),cost:cost.toFixed(0)};
}
function fmtDate(iso){
  if(!iso)return'';
  return new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'2-digit'});
}
function fmtDuration(mins){
  var h=Math.floor(mins/60),m=mins%60;
  return h>0?h+'h'+(m>0?' '+m+'m':''):m+'m';
}
function riskColor(risk){
  if(!risk)return'var(--text-dim)';
  if(risk.indexOf('DANGER')>=0||risk.indexOf('ICE')>=0||risk.indexOf('EXTREME')>=0)return'var(--danger)';
  if(risk.indexOf('CAUTION')>=0||risk.indexOf('WIND')>=0||risk.indexOf('High')>=0||risk.indexOf('Moderate')>=0)return'var(--caution)';
  if(risk.indexOf('Clear')>=0||risk.indexOf('OK')>=0)return'var(--go)';
  return'var(--text-dim)';
}

// ── LPG REFILL ────────────────────────────────────────────────
async function lpgRefill(){
  var btn=document.getElementById('refillBtn');
  if(!btn)return;
  btn.textContent='Logging...';btn.style.opacity='0.5';
  try{
    var params=new URLSearchParams();
    params.set('action','lpg_refill');
    if(currentTrip)params.set('trip',currentTrip);
    params.set('_',Date.now());
    var r=await fetch(API_URL+'?'+params.toString(),{redirect:'follow',headers:{'Accept':'application/json'}});
    var d=await r.json();
    if(d.error)throw new Error(d.error);
    btn.textContent='&#10003; Refilled';btn.style.color='var(--go)';btn.style.opacity='1';
    setTimeout(function(){refresh();},1500);
  }catch(e){
    btn.textContent='Error';btn.style.color='var(--danger)';btn.style.opacity='1';
    setTimeout(function(){btn.textContent='&#9981; Refill';btn.style.color='var(--frost)';},3000);
  }
}

function buildSnowSection(snow, meta, itin) {
  if (!snow || !snow.resorts || !snow.resorts.length) return '';

  // ── Section meta ─────────────────────────────────────────────

  if (snow.hasBluebird) summaryParts.push('☀️ Bluebird');
  if (snow.passBlocked) summaryParts.push('🚫 Pass closed');
  var sectionMeta = summaryParts.join(' · ') || snow.resorts.length + ' resorts';
 
  // ── Resort summary strip ─────────────────────────────────────
  var resortStrip = '<div style="display:grid;grid-template-columns:repeat('+Math.min(snow.resorts.length,4)+',1fr);border-bottom:1px solid var(--border)">'
    + snow.resorts.slice(0,4).map(function(r, idx) {
        var scoreColor = r.ssScore >= 80 ? 'var(--frost)'
                       : r.ssScore >= 60 ? 'var(--go)'
                       : r.ssScore >= 40 ? 'var(--caution)'

                       : 'var(--text-muted)';
        var snowNum = r.snowDepthCm > 0

          : '<div style="font-size:16px;font-weight:700;font-family:var(--display);color:var(--text-muted);line-height:1;margin-bottom:2px">—</div>';
        var badge = r.isPowder
          ? '<span style="font-size:8px;padding:1px 5px;border-radius:3px;background:#ddeeff;color:#185fa5;font-weight:600">❄️</span>'
          : r.isBluebird
          ? '<span style="font-size:8px;padding:1px 5px;border-radius:3px;background:#fdf0d8;color:#7a4800;font-weight:600">☀️</span>'
          : '<span style="height:14px;display:inline-block"></span>';
        return '<div style="padding:10px 6px;text-align:center;border-right:'+(idx<snow.resorts.length-1?'1px solid var(--border)':'none')+';cursor:pointer" onclick="toggleResortCard(\'rc-'+idx+'\')">'
          +'<div style="font-size:9px;color:var(--text-muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+r.name+'</div>'
          + snowNum
          +'<div style="display:flex;align-items:center;justify-content:center;gap:3px;margin-bottom:3px">'
          +'<div style="width:6px;height:6px;border-radius:50%;background:'+scoreColor+'"></div>'
          +'<span style="font-size:10px;color:var(--text-muted)">'+(r.ssScore>0?r.ssScore:'—')+'</span>'
          +'</div>'
          + badge
          +'</div>';
      }).join('')
    + '</div>';
 
  // ── Van context strip ────────────────────────────────────────
  var r0 = snow.resorts[0];
  var vanAlert = r0 && r0.snowAtVanLevel
    ? '<span style="font-size:10px;font-weight:600;color:var(--caution);background:#fcf8e3;padding:2px 8px;border-radius:4px">❄️ Snow at van level</span>'
    : '';
  var vanStrip = vanAlert ? '<div style="display:flex;align-items:center;justify-content:space-between;padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--border);flex-wrap:wrap;gap:6px">'
    +(function(){
      var vanElev = currentData&&currentData.vehicle&&currentData.vehicle.vanElevationM;
      return '<span style="font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted)">🚐 Van · '+(vanElev?vanElev.toLocaleString()+'m':'—')+'</span>';
    })()
    +'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'

    +(r0&&r0.freezeM?'<span style="font-size:11px;color:var(--text-dim)">↑ Freeze <strong style="color:var(--text)">'+Math.round(r0.freezeM).toLocaleString()+'m</strong></span>':'')
    +(r0&&r0.botWindKh?'<span style="font-size:11px;color:var(--text-dim)">💨 <strong style="color:var(--text)">'+r0.botWindKh+' km/h</strong></span>':'')
    + vanAlert
    +'</div></div>':'';
 
  // ── Drive day road risk banner ───────────────────────────────
  var roadRiskHtml = '';

  // ── Per-resort collapsible cards ─────────────────────────────

                   : 'var(--border2)';

    var botWind = r.botWindKh || r.windKmh || 0;

    var topWind = r.topWindKh || 0;
 
    // Wind colour

    // Fitment colour

// Lifts and runs
      +(r.liftsTotal>0
        ?'<div style="padding:8px 14px;border-bottom:1px solid var(--border)">'
          +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">'
          +'<span style="font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-muted)">Lifts &amp; runs</span>'

          +'</div></div>'
        :'')
      // 3-day forecast strip
      +(r.forecast3d&&r.forecast3d.length
        ?'<div>'
          +r.forecast3d.map(function(d){
            var isSnow  = d.snowfall>0;
            var dateObj = new Date(d.date+'T00:00:00');
            var dayLbl  = dateObj.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
            var snowCol = isSnow?'var(--frost)':'var(--text-muted)';
            var icon    = d.snowfall>=5?'❄️':d.snowfall>0?'🌨️':d.precipProb>60?'🌧️':d.precipProb>30?'⛅':'☀️';
            return'<div style="display:grid;grid-template-columns:80px 36px 1fr auto;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid var(--border)">'
              +'<span style="font-size:11px;color:var(--text-dim)">'+dayLbl+'</span>'
              +'<span style="font-size:12px;font-weight:600;color:'+snowCol+'">'+(isSnow?d.snowfall.toFixed(1)+'cm':'0cm')+'</span>'
              +'<span style="font-size:11px;color:var(--text-dim)">'+icon+' '+d.desc+'</span>'
              +'<span style="font-size:10px;color:var(--text-muted)">'+Math.round(d.tempMin)+'–'+Math.round(d.tempMax)+'°</span>'
              +'</div>';
          }).join('')
          +'</div>'
        :'')

      +'</div></div>';
 
  }).join('');
 
  var body = roadRiskHtml + resortStrip + vanStrip + resortsHtml;
  return makeSection('snow', 'Snow &middot; Conditions', sectionMeta, '', body);
}
 
// Toggle individual resort card
function toggleResortCard(id) {
  var body = document.querySelector('.rc-body-' + id);
  var chev = document.querySelector('.rc-chev-' + id);
  if (!body) return;
  var open = body.style.display === 'none';

function buildBudgetSection(budget) {
  if (!budget) return '';

  var total    = budget.estimateTotal;
  var actual   = budget.actualTotal;
  var hasActual = Object.values(budget.manual).some(function(m){ return m.actual !== null; });
  var rateNote = budget.rate ? '1€ = £' + budget.rate.toFixed(4) : '';

  // Section meta — headline figure
  var sectionMeta = hasActual
    ? 'Est £' + total.toLocaleString() + ' · Act £' + actual.toLocaleString()
    : 'Est £' + total.toLocaleString();

  // Table helper
  function row(label, est, act, notes, isEur) {
    var actStr = act !== null ? '£' + Math.round(act).toLocaleString() : '—';
    var estStr = '£' + Math.round(est).toLocaleString();
    var origStr = isEur && est ? ' <span style="font-size:10px;color:var(--text-muted)">(' + Math.round(est / (budget.rate||0.85)) + '€)</span>' : '';
    return '<tr style="border-bottom:1px solid var(--border)">'
      + '<td style="padding:6px 0;color:var(--text-dim);font-size:13px">' + label
      + (notes ? '<div style="font-size:10px;color:var(--text-muted)">' + notes + '</div>' : '')
      + '</td>'
      + '<td style="padding:6px 0;text-align:right;font-size:13px;color:var(--text)">' + estStr + origStr + '</td>'
      + '<td style="padding:6px 0;text-align:right;font-size:13px;color:'
      + (act !== null ? 'var(--go)' : 'var(--text-muted)') + '">' + actStr + '</td>'
      + '</tr>';
  }

  var body = '<div style="padding:0 18px 12px">'
    // Column headers
    + '<table style="width:100%;border-collapse:collapse;margin-top:12px">'
    + '<thead><tr>'
    + '<th style="text-align:left;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Category</th>'
    + '<th style="text-align:right;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Estimate</th>'
    + '<th style="text-align:right;font-size:9px;letter-spacing:2px;color:var(--text-muted);text-transform:uppercase;padding-bottom:6px">Actual</th>'
    + '</tr></thead><tbody>';

  // Auto-calculated rows
  if (budget.auto) {
    if (budget.auto.fuel)      body += row('Fuel',      budget.auto.fuel.estimate,      null, '', false);
    if (budget.auto.lpg)       body += row('LPG',       budget.auto.lpg.estimate,       null, '', false);
    if (budget.auto.campsites) body += row('Campsites', budget.auto.campsites.estimate, null, '', false);
  }

  // Manual rows from trip sheet budget block
  Object.keys(budget.manual).forEach(function(label) {
    var m = budget.manual[label];
    body += row(label, m.estimate, m.actual, m.notes, m.isEur);
  });

  // Total row
  body += '<tr>'
    + '<td style="padding:10px 0 4px;font-weight:700;font-family:var(--display);font-size:14px">Total</td>'
    + '<td style="padding:10px 0 4px;text-align:right;font-weight:700;font-family:var(--display);font-size:14px;color:var(--gold)">£' + total.toLocaleString() + '</td>'
    + '<td style="padding:10px 0 4px;text-align:right;font-weight:700;font-family:var(--display);font-size:14px;color:'
    + (hasActual ? 'var(--go)' : 'var(--text-muted)') + '">'
    + (hasActual ? '£' + actual.toLocaleString() : '—') + '</td>'
    + '</tr>'
    + '</tbody></table>'
    + (rateNote ? '<div style="font-size:10px;color:var(--text-muted);margin-top:6px">' + rateNote + '</div>' : '')
    + '</div>';

  // Collapsed by default — pass 'true' as 5th arg to makeSection
  var section = makeSection('budget', 'Budget', sectionMeta, '', body);
  return section;
}

// ── GPX PARSER MODULE — paste into index.html ────────────────
// Handles both namespaced (Strava) and non-namespaced GPX files
// Works with <trk>/<trkpt> and <rte>/<rtept> formats

// ── Main parse function ───────────────────────────────────────
function parseGPX(xmlText) {
  var parser = new DOMParser();
  var doc    = parser.parseFromString(xmlText, 'text/xml');

  // Handle namespace — Strava uses http://www.topografix.com/GPX/1/1
  // Try namespaced first, fall back to non-namespaced
  var NS = 'http://www.topografix.com/GPX/1/1';

  function getPoints(tag) {
    var pts = doc.getElementsByTagNameNS(NS, tag);
    if (!pts.length) pts = doc.getElementsByTagName(tag);
    return Array.from(pts);
  }

  function getText(el, tag) {
    var found = el.getElementsByTagNameNS(NS, tag);
    if (!found.length) found = el.getElementsByTagName(tag);
    return found.length ? found[0].textContent.trim() : '';
  }

  // Get track points (recorded) or route points (planned)
  var points = getPoints('trkpt');
  if (!points.length) points = getPoints('rtept');
  if (!points.length) return null;

  // Extract lat/lon/elevation per point
  var trackPoints = [];
  var cumKm = 0;
  var prevLat, prevLon;

  points.forEach(function(pt, i) {
    var lat = parseFloat(pt.getAttribute('lat'));
    var lon = parseFloat(pt.getAttribute('lon'));
    var ele = parseFloat(getText(pt, 'ele')) || 0;

    if (isNaN(lat) || isNaN(lon)) return;

    if (i > 0 && prevLat !== undefined) {
      cumKm += haversineKm(prevLat, prevLon, lat, lon);
    }

    trackPoints.push({
      lat:        lat,
      lon:        lon,
      ele:        ele,
      distanceKm: Math.round(cumKm * 10) / 10
    });

    prevLat = lat;
    prevLon = lon;
  });

  if (!trackPoints.length) return null;

  // Route name
  var nameEl = doc.getElementsByTagNameNS(NS, 'name');
  if (!nameEl.length) nameEl = doc.getElementsByTagName('name');
  var routeName = nameEl.length ? nameEl[0].textContent.trim() : 'Route';

  // Total elevation gain
  var totalEleGain = 0;
  for (var i = 1; i < trackPoints.length; i++) {
    var gain = trackPoints[i].ele - trackPoints[i-1].ele;
    if (gain > 0) totalEleGain += gain;
  }

  return {
    name:        routeName,
    totalKm:     Math.round(trackPoints[trackPoints.length-1].distanceKm * 10) / 10,
    totalEleM:   Math.round(totalEleGain),
    minEle:      Math.round(Math.min.apply(null, trackPoints.map(function(p){ return p.ele; }))),
    maxEle:      Math.round(Math.max.apply(null, trackPoints.map(function(p){ return p.ele; }))),
    points:      trackPoints
  };
}

// ── Haversine distance ────────────────────────────────────────
function haversineKm(lat1, lon1, lat2, lon2) {
  var R    = 6371;
  var dLat = (lat2-lat1) * Math.PI/180;
  var dLon = (lon2-lon1) * Math.PI/180;
  var a    = Math.sin(dLat/2)*Math.sin(dLat/2)
           + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)
           * Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Wind bearing calculation ──────────────────────────────────
function calcBearing(lat1, lon1, lat2, lon2) {
  var dLon  = (lon2-lon1) * Math.PI/180;
  var lat1r = lat1 * Math.PI/180;
  var lat2r = lat2 * Math.PI/180;
  var y     = Math.sin(dLon) * Math.cos(lat2r);
  var x     = Math.cos(lat1r)*Math.sin(lat2r) - Math.sin(lat1r)*Math.cos(lat2r)*Math.cos(dLon);
  return (Math.atan2(y, x) * 180/Math.PI + 360) % 360;
}

// ── Segment detection — finds key climbs and cols ─────────────
function detectSegments(gpx, startTime, flatSpeedKmh, climbSpeedKmh) {
  var points = gpx.points;
  flatSpeedKmh  = flatSpeedKmh  || 35;
  climbSpeedKmh = climbSpeedKmh || 10;
  var paceMinPerKm = 60 / flatSpeedKmh;
  

  // Sample every Nth point for performance
  // More samples for shorter routes — better resolution
  var targetSamples = gpx.totalKm > 100 ? 150 : gpx.totalKm > 50 ? 200 : 300;
  var SAMPLE = Math.max(1, Math.floor(points.length / targetSamples));
  var sampled = [];
  for (var i = 0; i < points.length; i += SAMPLE) {
    sampled.push(points[i]);
  }

  // Find local elevation maxima (col summits)
  var rawSummits = [];
  var WIN = 3; // window either side

  for (var i = WIN; i < sampled.length - WIN; i++) {
    var pt  = sampled[i];
    var ele = pt.ele;

    // Check if local maximum
    var isMax = true;
    for (var j = i-WIN; j <= i+WIN; j++) {
      if (j !== i && sampled[j].ele >= ele) { isMax = false; break; }
    }

    // Auto threshold — adaptive based on route max elevation
    // Alpine: 60% of max ele (e.g. 2000m route → 1200m threshold)
    // Yorkshire: much lower — 20% of max ele or 100m minimum
    var eleThreshold = gpx.maxEle > 1000
      ? Math.max(800,  gpx.maxEle * 0.6)   // Alpine — high cols only
      : Math.max(50,   gpx.maxEle * 0.2);  // Local — any meaningful summit

    if (!isMax || ele < eleThreshold) continue;

    // Calculate elevation gain approaching summit
    var lookbackEle = sampled[Math.max(0, i-10)].ele;
    var gain = ele - lookbackEle;

    // Gain threshold — also adaptive
    var gainThreshold = gpx.maxEle > 1000 ? 80 : 30;
    if (gain < gainThreshold) continue;

    // Calculate ETA at this point
    var etaMins = calcETA(pt.distanceKm, flatSpeedKmh, gain, climbSpeedKmh);
    var eta     = new Date(startTime.getTime() + etaMins * 60000);

    // Route bearing at this segment (for crosswind calculation)
    var prevPt = sampled[Math.max(0, i-5)];
    var bearing = calcBearing(prevPt.lat, prevPt.lon, pt.lat, pt.lon);

    rawSummits.push({
      lat:        pt.lat,
      lon:        pt.lon,
      ele:        Math.round(ele),
      distanceKm: pt.distanceKm,
      etaISO:     eta.toISOString(),
      etaStr:     formatTime_(eta),
      elevGain:   Math.round(gain),
      bearing:    Math.round(bearing),
      type:       'summit'
    });
  }

  // Deduplicate summits within 1km of each other — keep highest
  var summits = [];
  rawSummits.forEach(function(s) {
    // Smaller dedup window for local routes — 0.5km, 2km for Alpine
    var dedupKm = gpx.maxEle > 1000 ? 2.0 : 0.5;
    var nearby = summits.findIndex(function(existing) {
      return Math.abs(existing.distanceKm - s.distanceKm) < dedupKm;
    });
    if (nearby >= 0) {
      if (s.ele > summits[nearby].ele) summits[nearby] = s;
    } else {
      summits.push(s);
    }
  });

  // Add start
  var startPt = points[0];
  var startEta = new Date(startTime.getTime());
  summits.unshift({
    lat: startPt.lat, lon: startPt.lon, ele: Math.round(startPt.ele),
    distanceKm: 0, etaISO: startEta.toISOString(),
    etaStr: formatTime_(startEta), elevGain: 0,
    bearing: 0, type: 'start', name: 'Start'
  });

  // Add finish
  var finishPt  = points[points.length-1];
  var totalMins = calcETA(finishPt.distanceKm, flatSpeedKmh, 0, climbSpeedKmh);
  var finishEta = new Date(startTime.getTime() + totalMins * 60000);
  summits.push({
    lat: finishPt.lat, lon: finishPt.lon, ele: Math.round(finishPt.ele),
    distanceKm: finishPt.distanceKm, etaISO: finishEta.toISOString(),
    etaStr: formatTime_(finishEta), elevGain: 0,
    bearing: 0, type: 'finish', name: 'Finish'
  });

  return summits;
}

// ── ETA calculation — pace adjusted for gradient ──────────────
function calcETA(distanceKm, flatSpeedKmh, elevGain, climbSpeedKmh) {
  climbSpeedKmh = climbSpeedKmh || flatSpeedKmh * 0.35;
  if (distanceKm <= 0) return 0;
  var gradientPct  = elevGain > 0 ? (elevGain / (distanceKm * 1000)) * 100 : 0;
  var blendFactor  = Math.min(gradientPct / 8, 1);
  var effectiveSpd = flatSpeedKmh * (1 - blendFactor) + climbSpeedKmh * blendFactor;
  return (distanceKm / effectiveSpd) * 60;
}

function windDegToArrow(deg) {
  var arrows = ['↓','↙','←','↖','↑','↗','→','↘'];
  return arrows[Math.round((deg || 0) / 45) % 8];
}

// ── Format time helper ────────────────────────────────────────
function formatTime_(date) {
  return date.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' });
}

// ── Generate alert GPX for Garmin ────────────────────────────
function generateAlertGPX(routeName, segments) {
  var NAME_OPEN  = '<' + 'name>';
  var NAME_CLOSE = '<' + '/name>';
  var DESC_OPEN  = '<' + 'desc>';
  var DESC_CLOSE = '<' + '/desc>';
  var wpts = segments.filter(function(s) {
    return s.overallRisk && s.overallRisk !== 'ok' && s.type !== 'start';
  });

  // Also include all summits as informational waypoints
  var summits = segments.filter(function(s) {
    return s.type === 'summit' && s.overallRisk === 'ok';
  });

  var xml = '<?xml version="1.0" encoding="UTF-8"?>\n'
    + '<gpx version="1.1" creator="Audrey Cima"\n'
    + '  xmlns="http://www.topografix.com/GPX/1/1"\n'
    + '  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"\n'
    + '  xsi:schemaLocation="http://www.topografix.com/GPX/1/1 http://www.topografix.com/GPX/1/1/gpx.xsd">\n'
    + '  <metadata>\n'
    + '    <' + 'name>' + sanitizeXML(routeName) + ' - Cima Alerts<' + '/name>\n'
    + '    <' + 'desc>Weather alerts generated by Audrey Cima<' + '/desc>\n'
    + '  </metadata>\n';

  // Risk waypoints — prominent alerts
  wpts.forEach(function(s) {
    var riskType = s.risks && s.risks.length ? s.risks[0].type : 'caution';
    var sym = 'Flag, Red';

    // Clean label — no emoji for Garmin compatibility
    var label = s.risks && s.risks.length
      ? s.risks[0].label.replace(/[^\x00-\x7F]/g, '').trim().substring(0, 30)
      : 'Check conditions';
    if (!label) label = 'Weather Alert';

    var name = s.segName
      ? sanitizeXML(s.segName) + ' - ' + label
      : 'km' + s.distanceKm + ' - ' + label;

    var desc = 'ETA ' + s.etaStr
      + (s.tempC !== undefined ? ' | ' + s.tempC + 'C' : '')
      + (s.windKmh ? ' | Wind ' + s.windKmh + 'km/h' : '')
      + (s.precipProb ? ' | Rain ' + s.precipProb + '%' : '');

    xml += '  <wpt lat="' + s.lat + '" lon="' + s.lon + '">\n'
        +  '    <ele>' + s.ele + '</ele>\n'
        +  '    ' + NAME_OPEN + sanitizeXML(name) + NAME_CLOSE + '\n'
        +  '    ' + DESC_OPEN + sanitizeXML(desc) + DESC_CLOSE + '\n'
        +  '    <sym>' + sym + '</sym>\n'
        +  '  </wpt>\n';
  });

  // Summit waypoints — informational, no risk
  summits.forEach(function(s) {
    var name = s.segName
      ? sanitizeXML(s.segName) + ' ' + s.ele + 'm'
      : s.ele + 'm col';

    var desc = 'ETA ' + s.etaStr
      + (s.tempC !== undefined ? ' | ' + s.tempC + 'C' : '')
      + (s.windKmh ? ' | Wind ' + s.windKmh + 'km/h' : '')
      + ' | Clear';

    xml += '  <wpt lat="' + s.lat + '" lon="' + s.lon + '">\n'
        +  '    <ele>' + s.ele + '</ele>\n'
        +  '    ' + NAME_OPEN + sanitizeXML(name) + NAME_CLOSE + '\n'
        +  '    ' + DESC_OPEN + sanitizeXML(desc) + DESC_CLOSE + '\n'
        +  '    <sym>Flag, Blue</sym>\n'
        +  '  </wpt>\n';
  });

  xml += '</gpx>';
  return xml;
}

function sanitizeXML(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/[^\x00-\x7F]/g, ''); // strip non-ASCII including emoji
}

async function runGPXAnalysis() {
  if (!cyclingGPX) return;
 
  var startTimeStr = document.getElementById('cyclingStartTime').value || '06:30';
  var flatSpeed  = parseFloat(document.getElementById('cyclingFlatSpeed').value)  || 35;
  var climbSpeed = parseFloat(document.getElementById('cyclingClimbSpeed').value) || 10;
  var pace       = 60 / flatSpeed; // kept for compatibility
 
  // Build start datetime — use date picker if set, else today/tomorrow
  var now      = new Date();
  var parts    = startTimeStr.split(':');
  var dateInput = document.getElementById('cyclingDate').value;
  var startDt;
  if (dateInput) {
    var dp = dateInput.split('-');
    startDt = new Date(parseInt(dp[0]), parseInt(dp[1])-1, parseInt(dp[2]),
                       parseInt(parts[0]), parseInt(parts[1]), 0);
  } else {
    startDt = new Date(now.getFullYear(), now.getMonth(), now.getDate(),
                       parseInt(parts[0]), parseInt(parts[1]), 0);
    if (startDt <= now) startDt.setDate(startDt.getDate() + 1);
  }
 
  // Detect segments
  cyclingSegments = detectSegments(cyclingGPX, startDt, flatSpeed, climbSpeed);
 // Cap at 10 segments to avoid URL length issues
  if (cyclingSegments.length > 10) {
    var start  = cyclingSegments[0];
    var finish = cyclingSegments[cyclingSegments.length - 1];
    var middle = cyclingSegments.slice(1, -1)
      .sort(function(a,b){ return b.ele - a.ele; }) // highest first
      .slice(0, 8);
    middle.sort(function(a,b){ return a.distanceKm - b.distanceKm; }); // restore order
    cyclingSegments = [start].concat(middle).concat([finish]);
  }
  console.log('Segments to analyse:', JSON.stringify(cyclingSegments).substring(0, 500));
  console.log('Segment count:', cyclingSegments ? cyclingSegments.length : 'null');
  // Show loading
  document.getElementById('cyclingModalBody').innerHTML =
    '<div class="cycling-loading">🌤️ Fetching weather for ' + cyclingSegments.length + ' segments...<br>'
    + '<span style="font-size:11px;color:var(--text-muted)">This takes a few seconds</span></div>';
 
  try {
    // Trim segments to key fields only for GET request
    var trimmedSegs = cyclingSegments.map(function(s) {
      return {
        lat: s.lat, lon: s.lon, ele: s.ele,
        distanceKm: s.distanceKm, etaISO: s.etaISO,
        etaStr: s.etaStr, type: s.type, bearing: s.bearing || 0
      };
    });

    var params = new URLSearchParams();
    params.set('action',    'analyse_gpx');
    params.set('segments',  JSON.stringify(trimmedSegs));
    params.set('routeName', cyclingGPX.name);
    params.set('totalKm',   cyclingGPX.totalKm);
    params.set('totalEleM', cyclingGPX.totalEleM);
    params.set('_',         Date.now());

    var r = await fetch(API_URL + '?' + params.toString(), {
      redirect: 'follow',
      headers: { 'Accept': 'application/json' }
    });
    var data = await r.json();
 
    console.log('API response:', JSON.stringify(data).substring(0, 500));
    if (data.error) throw new Error(data.error);
    if (!data.success) throw new Error('Analysis failed — ' + JSON.stringify(data).substring(0, 200));
 
    cyclingResults = data;
    renderCyclingResults(data);
    enrichSegmentNames(cyclingSegments); // async name enrichment
 
  } catch(err) {
    document.getElementById('cyclingModalBody').innerHTML =
      '<div class="cycling-loading" style="color:var(--danger)">❌ Analysis failed: ' + err.message + '</div>';
  }
}

async function enrichSegmentNames(segments) {
  // Batch all Alpine segments into one Overpass query
  var alpineSegs = segments.filter(function(s, i) {
    return s.type !== 'start' && s.type !== 'finish' && s.ele > 1000;
  });

  // Build single batch query for all segments
  if (alpineSegs.length) {
    try {
      var unionParts = alpineSegs.map(function(s) {
        return 'node["mountain_pass"](around:1500,' + s.lat + ',' + s.lon + ');'
             + 'node["natural"="saddle"](around:1500,' + s.lat + ',' + s.lon + ');';
      }).join('');

      var query = '[out:json][timeout:25];(' + unionParts + ');out;';

      var r = await fetch('https://overpass-api.de/api/interpreter', {
        method: 'POST',
        body: 'data=' + encodeURIComponent(query),
        signal: AbortSignal.timeout(30000)
      });

      if (r.ok) {
        var text = await r.text();
        if (text.startsWith('{')) {
          var data = JSON.parse(text);
          // Match each result to nearest segment
          (data.elements || []).forEach(function(el) {
            if (!el.tags || !el.tags.name) return;
            var tags = el.tags;
            var name = tags['name:it'] || tags['name:en'] || tags.name;
            if (name && name.includes(' - ')) {
              var parts = name.split(' - ');
              var italian = parts.find(function(p){ return p.match(/^[Pp]asso/); });
              name = italian || parts[0];
            }
            // Find closest segment
            var closest = null;
            var minDist = 2; // max 2km
            alpineSegs.forEach(function(s, idx) {
              var dist = Math.sqrt(
                Math.pow(el.lat - s.lat, 2) + Math.pow(el.lon - s.lon, 2)
              ) * 111; // rough km
              if (dist < minDist) { minDist = dist; closest = s; }
            });
            if (closest) {
              closest._overpassName = name;
            }
          });
        }
      }
    } catch(e) {
      console.warn('Overpass batch failed: ' + e.message);
    }
  }

  // Now update DOM — Overpass names + TomTom fallback for local
  for (var i = 0; i < segments.length; i++) {
    var seg = segments[i];
    if (seg.type === 'start' || seg.type === 'finish') continue;

    // Start with TomTom name from API, overwrite with Overpass if Alpine pass found
    var name = seg._overpassName || null;
    // If no Overpass name, keep the TomTom segName already in the results
    if (!name && cyclingResults && cyclingResults.segments[i] && 
        cyclingResults.segments[i].segName && 
        !cyclingResults.segments[i].segName.includes('m col')) {
      name = cyclingResults.segments[i].segName;
    }

    

    if (name) {
      var el = document.querySelector('[data-seg-idx="' + i + '"] .cycling-seg-name');
      if (el) el.textContent = name;
      if (cyclingResults && cyclingResults.segments[i]) {
        cyclingResults.segments[i].segName = name;
      }
    }
  }
}


 
function downloadAlertGPX() {
  if (!cyclingResults || !cyclingSegments) return;
 
  // Merge weather results back into segments for GPX generation
  var enriched = cyclingSegments.map(function(seg, i) {
    return Object.assign({}, seg, cyclingResults.segments[i] || {});
  });
 
  var gpxContent = generateAlertGPX(cyclingResults.routeName, enriched);
  if (!gpxContent) {
    alert('No risk alerts detected — no GPX needed!');
    return;
  }
 
  // Download the file
  var blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = url;
  a.download = (cyclingResults.routeName || 'route').replace(/\s+/g,'-') + '-cima-alerts.gpx';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
