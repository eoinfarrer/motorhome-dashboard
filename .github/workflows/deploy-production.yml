name: Deploy Audrey production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Validate Cloudflare secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CF_TOKEN" || (echo 'Missing CLOUDFLARE_API_TOKEN secret' >&2; exit 1)
          test -n "$CF_ACCOUNT" || (echo 'Missing CLOUDFLARE_ACCOUNT_ID secret' >&2; exit 1)
      - name: Deploy Worker and static service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:secure
      - name: Smoke test public health endpoint
        run: curl --fail --silent --show-error --retry 3 --retry-delay 5 https://audrey-gateway.eoinfarrer.workers.dev/health
